# VENDORED COPY of Mindburn-Labs/platform-actions .github/workflows/ci.yml at
# tag v2 (6d84391e40ef265dfcaf8485090c6a9dbf15eed4). This repository is public
# and platform-actions is internal, and GitHub does not let a public repository
# call an internal reusable workflow. When platform-actions becomes public,
# delete this file and point ci.yml at
# Mindburn-Labs/platform-actions/.github/workflows/ci.yml@v2. Until then, keep it
# byte-identical to v2 below this header.
#
# CI v2: the one CI contract every Mindburn-Labs repository calls.
#
#   jobs:
#     ci:
#       uses: Mindburn-Labs/platform-actions/.github/workflows/ci.yml@v2
#
# The caller triggers on pull_request, push to the default branch and
# merge_group, with no path filters, so `gate` reports on every change and can
# be the single required status check. GitHub names the check after the caller
# job: with the job id `ci` above it is `ci / gate`.
#
# Jobs:
#   check           toolchains detected from the repository, then `make check`.
#   dependency-scan pull requests and merge groups only: fails on a HIGH or
#                   CRITICAL vulnerability that is present at head and absent
#                   at base. Inherited findings are Dependabot's job.
#   gate            needs every other job; fails if any of them failed or was
#                   cancelled.
#
# Scripts are inline on purpose: a reusable workflow checks out the CALLER, so
# it cannot read helper files from this repository.
name: CI v2

on:
  workflow_call:
    inputs:
      setup-commands:
        description: Shell commands run after toolchain setup and before `make check` (for example `npm ci`).
        type: string
        default: ''
      extra-commands:
        description: Shell commands run after `make check` succeeds, in the same job.
        type: string
        default: ''
    secrets:
      MINDBURN_ORG_READ_TOKEN:
        description: >-
          Optional. Needed only when a go.mod uses `replace ... => ../<repo>`:
          the check job then clones those sibling repositories next to the
          checkout.
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect toolchains
        id: detect
        run: |
          files="$(git ls-files)"
          found() { grep -Eq "$1" <<<"${files}"; }
          emit() { printf '%s=%s\n' "$1" "$2" >>"${GITHUB_OUTPUT}"; }
          shallowest() { grep -E "$1" <<<"${files}" | awk -F/ 'NR == 1 || NF < depth { best = $0; depth = NF } END { print best }'; }

          if found '(^|/)go\.mod$'; then
            emit go true
            emit go_version_file "$(shallowest '(^|/)go\.mod$')"
          fi

          if found '(^|/)package-lock\.json$'; then
            emit node true
            emit node_cache npm
            emit node_lock '**/package-lock.json'
          fi
          if found '(^|/)pnpm-lock\.yaml$'; then
            emit node true
            emit pnpm true
            if ! found '(^|/)package-lock\.json$'; then
              emit node_cache pnpm
              emit node_lock '**/pnpm-lock.yaml'
            fi
            # pnpm/action-setup reads packageManager from package.json and
            # refuses a second version, so pass one only when it is absent.
            package_manager="$(jq -r '.packageManager // ""' package.json 2>/dev/null || true)"
            if [[ "${package_manager}" != pnpm@* ]]; then
              emit pnpm_version 10
            fi
          fi
          if [[ -f .nvmrc ]]; then
            emit node_version_file .nvmrc
          elif [[ -f .node-version ]]; then
            emit node_version_file .node-version
          fi

          if found '(^|/)(pyproject\.toml|requirements[^/]*\.txt)$'; then
            emit python true
          fi
          if [[ -f .python-version ]]; then
            emit python_version_file .python-version
          fi

          if [[ -f Gemfile ]]; then
            emit ruby true
            if [[ -f .ruby-version || -f .tool-versions || -f mise.toml ]]; then
              emit ruby_version default
            else
              emit ruby_version ruby
            fi
          fi

          if found '(^|/)Cargo\.toml$'; then
            emit rust true
            {
              echo 'rust_workspaces<<RUST_WORKSPACES'
              grep -E '(^|/)Cargo\.lock$' <<<"${files}" | xargs -r -n1 dirname || true
              echo 'RUST_WORKSPACES'
            } >>"${GITHUB_OUTPUT}"
          fi

          if found '\.tf$'; then
            emit terraform true
          fi

          if found '(^|/)Chart\.yaml$'; then
            emit helm true
          fi

          echo "detected:"
          grep -E '^[a-z]+=true$' "${GITHUB_OUTPUT}" | sort -u | sed 's/=true$//; s/^/  /' || echo "  no language toolchain"

      - name: Set up Go
        if: steps.detect.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ steps.detect.outputs.go_version_file }}
          cache-dependency-path: '**/go.sum'

      - name: Clone sibling repositories for go.mod replace directives
        if: steps.detect.outputs.go == 'true'
        env:
          MINDBURN_ORG_READ_TOKEN: ${{ secrets.MINDBURN_ORG_READ_TOKEN }}
        run: |
          # Local-dev pattern: `replace github.com/Mindburn-Labs/<repo> => ../<repo>`.
          # A relative replace that resolves outside this checkout names a
          # sibling repository; one that stays inside it needs nothing.
          siblings=()
          while IFS= read -r -d '' mod; do
            while IFS= read -r target; do
              resolved="$(realpath -m --relative-to=. "$(dirname "${mod}")/${target}")"
              if [[ "${resolved}" == ../* ]]; then
                resolved="${resolved#../}"
                siblings+=("${resolved%%/*}")
              fi
            done < <(grep -oE '=> \.\.?/[^[:space:]]+' "${mod}" | sed 's/^=> //' || true)
          done < <(git ls-files -z -- 'go.mod' '*/go.mod')
          if [[ "${#siblings[@]}" -gt 0 ]]; then
            mapfile -t siblings < <(printf '%s\n' "${siblings[@]}" | sort -u)
          fi
          if [[ "${#siblings[@]}" -eq 0 ]]; then
            echo "no sibling replace targets"
            exit 0
          fi
          if [[ -f vendor/modules.txt ]] && GOWORK=off go list -mod=vendor ./... >/dev/null 2>&1; then
            echo "vendored modules satisfy the replace targets"
            exit 0
          fi
          if [[ -z "${MINDBURN_ORG_READ_TOKEN}" ]]; then
            echo "::error::go.mod replaces point at sibling repositories (${siblings[*]}); pass MINDBURN_ORG_READ_TOKEN in the caller's secrets: block"
            exit 1
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${MINDBURN_ORG_READ_TOKEN}" | base64 -w0)"
          for repo in "${siblings[@]}"; do
            echo "cloning ../${repo}"
            git -c http.extraheader="${auth}" clone --quiet --depth 1 \
              "https://github.com/Mindburn-Labs/${repo}.git" "../${repo}"
          done

      - name: Set up pnpm
        if: steps.detect.outputs.pnpm == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.detect.outputs.pnpm_version }}

      - name: Set up Node.js
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.detect.outputs.node_version_file == '' && 'lts/*' || '' }}
          node-version-file: ${{ steps.detect.outputs.node_version_file }}
          cache: ${{ steps.detect.outputs.node_cache }}
          cache-dependency-path: ${{ steps.detect.outputs.node_lock }}

      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.detect.outputs.python_version_file == '' && '3.12' || '' }}
          python-version-file: ${{ steps.detect.outputs.python_version_file }}
          cache: pip
          cache-dependency-path: |
            **/requirements*.txt
            **/pyproject.toml

      - name: Set up Ruby
        if: steps.detect.outputs.ruby == 'true'
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          ruby-version: ${{ steps.detect.outputs.ruby_version }}
          bundler-cache: true

      - name: Set up Rust
        if: steps.detect.outputs.rust == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Keep cargo's own warning behaviour; the action defaults to deny.
          build-warnings: warn
          cache-workspaces: ${{ steps.detect.outputs.rust_workspaces }}

      - name: Set up Terraform
        if: steps.detect.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: steps.detect.outputs.terraform == 'true'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_wrapper: false

      - name: Share a provider cache between Terraform and OpenTofu
        if: steps.detect.outputs.terraform == 'true'
        run: |
          mkdir -p "${HOME}/.terraform.d/plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=${HOME}/.terraform.d/plugin-cache" >>"${GITHUB_ENV}"

      - name: Cache Terraform providers
        if: steps.detect.outputs.terraform == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Set up Helm
        if: steps.detect.outputs.helm == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Run setup commands
        if: inputs.setup-commands != ''
        env:
          COMMANDS: ${{ inputs.setup-commands }}
        run: eval "${COMMANDS}"

      - name: make check
        run: |
          if [[ ! -f Makefile && ! -f makefile && ! -f GNUmakefile ]]; then
            echo "::error::CI v2 runs 'make check'; this repository has no Makefile"
            exit 1
          fi
          make check

      - name: Run extra commands
        if: inputs.extra-commands != ''
        env:
          COMMANDS: ${{ inputs.extra-commands }}
        run: eval "${COMMANDS}"

  dependency-scan:
    name: dependency scan
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      OSV_SCANNER_VERSION: v2.6.0
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - name: Check out the change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false

      - name: Check out the base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Install osv-scanner
        run: |
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' \
            --output "${bin}/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${bin}/osv-scanner" | sha256sum --check --strict
          chmod +x "${bin}/osv-scanner"
          echo "${bin}" >>"${GITHUB_PATH}"

      - name: Scan base and head
        run: |
          # Exit 1 means "vulnerabilities found", which the next step judges.
          # Anything else is a scanner failure and fails the job.
          scan() {
            osv-scanner scan source --recursive --no-call-analysis=all --allow-no-lockfiles \
              --format json --output-file "$2" "$1" || [[ $? -eq 1 ]]
          }
          scan base base.json
          scan head head.json

      - name: Fail on HIGH or CRITICAL vulnerabilities new in this change
        run: |
          # One line per (ecosystem, package, advisory) at HIGH or CRITICAL:
          # CVSS >= 7.0, or a GitHub advisory rated HIGH/CRITICAL. The version
          # is reported but is not part of the key, so a bump that leaves an
          # advisory open is not counted as new.
          findings() {
            jq -r '
              .results[]?.packages[]? as $p
              | $p.groups[]? as $g
              | select(
                  ((($g.max_severity // "") | tonumber?) // 0) >= 7
                  or any(
                    $p.vulnerabilities[]? | select(.id as $id | $g.ids | index($id));
                    (.database_specific.severity? // "" | ascii_upcase) | IN("HIGH", "CRITICAL")
                  )
                )
              | $g.ids[] as $id
              | [$p.package.ecosystem, $p.package.name, $id, $p.package.version, ($g.max_severity // "")]
              | @tsv
            ' "$1" | sort -u
          }
          findings base.json | cut -f1-3 >base.keys
          findings head.json >head.tsv
          awk -F'\t' 'FILENAME == ARGV[1] { seen[$0]; next } !(($1 FS $2 FS $3) in seen)' base.keys head.tsv >new.tsv
          inherited=$(( $(wc -l <head.tsv) - $(wc -l <new.tsv) ))
          if [[ "${inherited}" -gt 0 ]]; then
            echo "::notice::${inherited} HIGH/CRITICAL finding(s) already exist on the base branch; they are not caused by this change"
          fi
          if [[ -s new.tsv ]]; then
            while IFS=$'\t' read -r ecosystem name id version severity; do
              echo "::error::${ecosystem} ${name}@${version}: ${id} (CVSS ${severity:-n/a}) is new in this change"
            done <new.tsv
            exit 1
          fi
          echo "no new HIGH/CRITICAL vulnerabilities"

  gate:
    if: always()
    needs: [check, dependency-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS}"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"${NEEDS}" >/dev/null
