networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: svc-helm-control-plane
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # The Helm connectivity hook is namespace-local and carries both labels.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: helm-ai-kernel
              app.kubernetes.io/component: test
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.116.0.8/32
      ports:
        - protocol: TCP
          port: 5432
