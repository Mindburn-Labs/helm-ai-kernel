  - id: CTL-059
    title: "Gateway signed decision and outcome receipts"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      Every decision helm-gateway admission writes through recordDecision
      commits in its own transaction with one signed receipt
      (helm-tracker#276); tested for ADMITTED, DENIED, ESCALATED, the
      stepped-up re-admission of an approved escalation, a stop's lift and a
      model-call admission. The receipt is a classical Ed25519 receipt.v5
      envelope over the attempt row the decision's UPDATE returned:
      decision_id is <attempt_id>:<version>, args_hash the hex SHA-256 of the
      exact argument bytes the attempt stored (its argument_digest, not a JCS
      re-encoding), policy_hash the SHA-256 of the locked authority versions,
      and output_hash the SHA-256 of a closed helm.gateway.receipt-binding.v1
      document, stored as exact JCS bytes with it, which also binds the
      approver's workload and any step-up proof used up. The outcome of every
      admitted effect is receipted the same way, in the transaction that
      records it (recordOutcome): OBSERVED and RECONCILED, SUCCEEDED or
      FAILED, from a read-back of Dispatch, Observe, the reconciliation job
      or the MCP tools, from an adapter's NOT_SENT answer, and from a model
      call's confirmed, estimated, refused or late-confirmed settlement, and
      a model call's SETTLED; tested for each. An outcome receipt's status is
      the outcome state and its verdict empty; its policy_hash is that of the
      authority versions the permit was issued under (the decision
      receipt's), and its output_hash is the SHA-256 of its own closed
      document, helm.gateway.outcome-binding.v1, so decision receipts keep
      receipt-binding.v1 byte for byte. That document binds the attempt core
      (tenant, workspace, attempt, version, from and to state, effect type,
      request, target and argument digests, permit, authority versions), the
      outcome and its basis, the stored observation it rests on, what
      established it (read-back, NOT_SENT or model call), whether a read-back
      found the object absent, what it did to the reservation, every
      exposure as the ledger holds it after the write, and for a model call
      its money row (currency, held, estimated, confirmed and billable
      micros) and the SHA-256 of the RFC 8785 form of its stored usage, so a late usage report re-settles with a
      receipt of the new amounts. The builder refuses a (from, to) pair no
      outcome write makes, an observation of another outcome, and settlement
      facts that do not fit how the outcome was established. Receipts form one
      hash chain per (tenant, workspace): the chain row is the last row lock
      the transaction takes on a pre-existing row, so a workspace's decisions
      and outcomes serialize on it until commit; lamport_clock is the
      sequence, prev_hash the predecessor's chain hash, and the ledger refuses
      a fork, a second genesis or a reused sequence. A signing failure, a
      refused profile, a missing observation or a moved head rolls the
      decision or the outcome back (an attempt whose outcome rolled back keeps
      its state for a later read-back), and deferred constraint triggers
      (migrations 15 and 16) refuse at commit any attempt that enters
      ADMITTED, DENIED or ESCALATED, or enters (or is rewritten at a new
      version in) OBSERVED, RECONCILED or SETTLED, without the receipt of that
      version and state, whoever writes it, including an older gateway still
      serving during an upgrade. Migration 16 locks authority_effect_attempts
      before it alters authority_receipts, and pins both fence functions'
      search_path to the gateway schema, so a look-alike authority_receipts
      on a writer's search_path or in its temporary schema satisfies neither
      fence.
      admission refuses a nil signer and one whose receipts are not classical
      Ed25519 that verify offline under its published key; serve refuses to
      start without HELM_GATEWAY_RECEIPT_SIGNING_KEY_FILE (a 32-byte seed,
      never a passphrase or all zeros) and a key id, verbatim or derived from
      a prefix and the key's fingerprint. The runtime role may only SELECT and
      INSERT receipt rows, and the stored chain verifies with receiptverify
      under the gateway key alone. EffectAttempt.receipts names each receipt
      by chain, sequence, chain hash and key id.
    status: enforced
    entry_points:
      - "core/pkg/gateway/runtime.serve"
      - "core/pkg/gateway/runtime.receiptSignerFromEnv"
      - "core/pkg/gateway/admission.New"
      - "core/pkg/gateway/admission.CheckReceiptSigner"
      - "core/pkg/gateway/admission.Service.recordDecision"
      - "core/pkg/gateway/admission.Service.recordDispatch"
      - "core/pkg/gateway/admission.Service.recordObservation"
      - "core/pkg/gateway/admission.Service.SettleModelCall"
      - "core/pkg/gateway/admission.recordOutcome"
      - "core/pkg/gateway/admission.appendReceipt"
    config:
      - "HELM_GATEWAY_RECEIPT_SIGNING_KEY_FILE (a 32-byte Ed25519 seed, hex or base64) and HELM_GATEWAY_RECEIPT_KEY_ID or HELM_GATEWAY_RECEIPT_KEY_ID_PREFIX; the chart mounts gateway.receipts.existingSecret, or its autoSeed Secret, into the gateway Pod only, and by default sets the prefix."
      - "Gateway schema migration 15: authority_receipt_chains and authority_receipts under forced row security, and the deferred decision-receipt fence on authority_effect_attempts. The chart's 002_grants.sql gives the runtime role SELECT, INSERT only on authority_receipts."
      - "Gateway schema migration 16: authority_receipts also holds OBSERVED, RECONCILED and SETTLED receipts, and the deferred outcome-receipt fence on authority_effect_attempts."
    protected_operations:
      - "Every ADMITTED, DENIED and ESCALATED write of helm.gateway.v1.EffectGatewayService Propose, Approve and Lift, the MCP tools on the worker and executor listeners, and the model gateway's admissions on helm-gateway serve."
      - "Every OBSERVED, RECONCILED and SETTLED write of helm.gateway.v1.EffectGatewayService Dispatch and Observe, the reconcile job, the MCP tools' dispatch and read-back, and the model gateway's settlement on helm-gateway serve."
    bypass_assumptions:
      - "The receipt format is receipt.v5, an interim: the gateway's own facts are signed only through output_hash, and the binding bytes are retained beside the receipt. The gateway is one of the producers Mindburn-Labs/helm-tracker#53 moves to the DSSE v6 envelope; receipt.v5 stays verify-only after that. A gateway receipt's args_hash is the exact-argument-bytes digest, not the JCS-arguments hash contracts.Receipt documents for other producers."
      - "Receipts cover decisions and outcomes. Not receipted, and not fenced: ESCALATED to REJECTED and EXPIRED (no effect was admitted), CANCELLED (a refused claim or a cancellation: nothing was dispatched, and the decision receipt stays the attempt's last), the lifecycle in between (DISPATCHING, DISPATCHED, UNKNOWN), and ESCALATED_TO_HUMAN (no outcome is known, and an outcome a human later establishes has no gateway write path today). An effect API attempt's reservation stays held there, but a cut model call (UNKNOWN) has already moved its hold to estimated, spending budget as an estimate; that spend is receipted only when a provider confirmation reconciles the call (RECONCILED, then SETTLED), and never if none arrives. There are no start or heartbeat lifecycle receipts; delivery gate 2 needs the decision and the outcome only. COMPENSATED is in the schema but nothing writes it."
      - "The outcome fence checks that a receipt exists for the row's (tenant, attempt, version, state) when the state or the version changes. The runtime role holds UPDATE on authority_effect_attempts, so it can rewrite the outcome, its basis or its reason in place at the same version without the fence noticing; the signed receipt still records what was settled, and a reader compares the row with it."
      - "An outcome receipt binds the one observation its outcome rests on. Distinct provider facts a later read-back records after the attempt settled are kept as observations, not receipted; a model call's late usage is receipted because it re-settles the attempt at a new version."
      - "During an upgrade to schema 16, an older gateway's outcome fails at commit: an effect API attempt stays DISPATCHING, DISPATCHED or UNKNOWN for the reconciliation job the claim enqueued, and a model call's settlement is not written, so the attempt keeps its hold and is reconciled as the model gateway documents for any settlement that cannot be written. Outcomes an older gateway committed before the migration keep no receipt."
      - "The signing key lives in the gateway process and its Secret. Whoever holds the seed, or the gateway's runtime database role together with it, can sign and insert a receipt the chain accepts; a row inserted without the key does not verify offline."
      - "A missing receipt is detected only as a gap before a later receipt. The runtime role moves the chain head on every append; the database owner can also delete the newest receipts and rewind the head, which the chain alone cannot reveal. Chain export and external anchoring are the follow-up."
      - "With gateway.receipts.autoSeed the key is generated by the chart and kept through Helm lookup. A pipeline that renders with helm template, or a deleted Secret, starts a new key (and, with the default derived key id, a new key id); receipts signed before verify only under the old public key, which must be recorded (helm-gateway receipt-key) to stay verifiable."
      - "The receipt.v5 timestamp is outside the signed preimage; the next receipt's prev_hash covers it, and decided_at (a decision) or settled_at (an outcome) is signed through the binding. Order is the signed sequence."
      - "The ledger fence is a database trigger; the database owner (or a superuser in replica mode) can drop or bypass it."
      - "Outcome receipts sign helm.gateway.outcome-binding.v1, a second closed document beside receipt-binding.v1. receiptverify checks their signature, chain links and output_hash like any receipt.v5; reading what an outcome binding says needs its schema, which the verifier lane adds."
      - "An outcome binding's settlement facts are the exposure and model-call rows its own transaction read just before signing. The runtime role holds UPDATE on authority_exposures and authority_model_calls, so a later in-place rewrite is not fenced; the signed receipt keeps what was settled, and a reader compares the rows with it."
      - "Migration 16 takes authority_effect_attempts before authority_receipts, so an older gateway's decision cannot deadlock it. A transaction that reads authority_receipts and then writes an attempt (Propose's work-effect replay check) can still form a cycle with it; PostgreSQL's deadlock detector aborts one side, and a failed migration records nothing and runs again."
      - "The fences' search_path is pinned to the schema that holds authority_receipts when migration 16 runs (read from pg_class); a deployment that moved the tables to another schema afterwards would have to pin the functions again."
      - "A model call's settlement clears expired replay bodies tenant-wide and keeps those rows locked until it commits, through the signing of its receipts; concurrent settlements skip rows another is clearing (SKIP LOCKED) rather than wait for them."
    tests:
      allowed:
        - "core/pkg/gateway/admission.TestPostgresDecisionsCommitWithSignedChainedReceipts"
        - "core/pkg/gateway/admission.TestPostgresLiftAndModelCallDecisionsCarryReceipts"
        - "core/pkg/gateway/admission.TestDecisionTransactionAppendsItsSignedReceiptLast"
        - "core/pkg/gateway/admission.TestDecisionReceiptBindsTheStoredDecision"
        - "core/pkg/gateway/server.TestPostgresAttemptReceiptRefsOnTheWire"
        - "core/pkg/gateway/runtime.TestReceiptKeyAcceptsHexAndBase64SeedsAndPrintsOnlyThePublicHalf"
        - "core/pkg/gateway/admission.TestPostgresEveryEffectOutcomeCommitsWithItsSignedReceipt"
        - "core/pkg/gateway/admission.TestPostgresModelCallOutcomesCarryReceipts"
        - "core/pkg/gateway/mcpserver.TestPostgresMCPToolOutcomesAreReceipted"
        - "core/pkg/gateway/admission.TestEveryOutcomeWriteAppendsItsSignedReceiptLast"
        - "core/pkg/gateway/admission.TestOutcomeReceiptBindsTheStoredOutcome"
        - "core/pkg/gateway/admission.TestModelCallSettlementAppendsItsSignedReceiptsLast"
        - "core/pkg/gateway/admission.TestDecisionBindingIsUnchangedByOutcomeReceipts"
      forbidden:
        - "core/pkg/gateway/admission.TestNewRefusesAMissingOrUnusableReceiptSigner"
        - "core/pkg/gateway/admission.TestADecisionWhoseReceiptCannotBeSignedFailsTheTransaction"
        - "core/pkg/gateway/runtime.TestServeRefusesToStartWithoutAUsableReceiptKey"
        - "core/pkg/gateway/admission.TestPostgresADecisionWithoutItsReceiptFailsAtCommit"
        - "core/pkg/gateway/admission.TestPostgresSigningFailureCommitsNoDecision"
        - "core/pkg/gateway/admission.TestPostgresReceiptRowsAreAppendOnlyForTheRuntimeRole"
        - "core/pkg/gateway/admission.TestPostgresStoredReceiptsVerifyOfflineWithTheGatewayKey"
        - "core/pkg/gateway/admission.TestPostgresChartBootstrapGivesTheRuntimeRoleOnlyItsGrants"
        - "core/pkg/gateway/admission.TestAnOutcomeWhoseReceiptCannotBeSignedFailsTheTransaction"
        - "core/pkg/gateway/admission.TestPostgresAnOutcomeWithoutItsReceiptFailsAtCommit"
        - "core/pkg/gateway/admission.TestPostgresOutcomeReceiptsVerifyOfflineAsAChain"
        - "core/pkg/gateway/admission.TestPostgresFencesIgnoreALookAlikeReceiptTable"
      removal:
        - "core/pkg/gateway/admission.TestDecisionTransactionAppendsItsSignedReceiptLast"
        - "core/pkg/gateway/admission.TestADecisionWhoseReceiptCannotBeSignedFailsTheTransaction"
        - "core/pkg/gateway/admission.TestDecisionReceiptBindsTheStoredDecision"
        - "core/pkg/gateway/admission.TestNewRefusesAMissingOrUnusableReceiptSigner"
        - "core/pkg/gateway/admission.TestReceiptFenceIsADeferredCheckOnEveryDecisionWrite"
        - "core/pkg/gateway/runtime.TestServeRefusesToStartWithoutAUsableReceiptKey"
        - "core/pkg/gateway/admission.TestEveryOutcomeWriteAppendsItsSignedReceiptLast"
        - "core/pkg/gateway/admission.TestAnOutcomeWhoseReceiptCannotBeSignedFailsTheTransaction"
        - "core/pkg/gateway/admission.TestOutcomeReceiptBindsTheStoredOutcome"
        - "core/pkg/gateway/admission.TestOutcomeFenceIsADeferredCheckOnEveryOutcomeWrite"
        - "core/pkg/gateway/admission.TestModelCallSettlementAppendsItsSignedReceiptsLast"
      bypass:
        - "core/pkg/gateway/admission.TestPostgresReceiptChainStaysContiguousUnderConcurrentProposals"
        - "core/pkg/gateway/admission.TestPostgresReceiptSchemaUpgradesFrom14"
        - "core/pkg/gateway/admission.TestPostgresOutcomeReceiptChainStaysContiguousUnderConcurrentSettles"
        - "core/pkg/gateway/admission.TestPostgresOutcomeReceiptSchemaUpgradesFrom15"
        - "core/pkg/gateway/admission.TestPostgresFencesIgnoreALookAlikeReceiptTable"

  - id: CTL-060
    title: "Gateway receipts verify offline with their bindings"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      A reader verifies helm-gateway's signed decision and outcome receipts (CTL-059)
      offline, the gateway's own facts included (helm-tracker#276).
      receiptverify, receipt_verify and the WASM verifier take a gateway
      receipt's binding document (bundle member gateway_bindings, receipt id
      to the base64 of the exact bytes, or receipt_verify --binding
      <receipt_id>=<file>) and run a binding check: it passes only when every
      supplied binding's receipt is signed under receipt.v5, the binding's
      SHA-256 is that receipt's signed output_hash, the binding is the closed
      document its binding_version names (helm.gateway.receipt-binding.v1
      for a decision, helm.gateway.outcome-binding.v1 for an outcome; an
      unknown version fails) in its own JCS form, and its chain id
      (length-framed from its tenant and workspace), sequence, attempt and
      version, state, reason code, policy hash and argument digest equal the
      receipt's session_id, lamport_clock, decision_id, effect_id, status,
      reason_code, policy_hash and args_hash; a decision binding's verdict
      and decided_at equal the receipt's verdict and timestamp, and an
      outcome binding's state is OBSERVED, RECONCILED or SETTLED, it names
      its permit, the receipt's verdict is empty and its settled_at equals
      the receipt's timestamp (outside the receipt.v5 preimage, bound by
      these rows). A
      binding for a receipt the bundle does not hold, or for a receipt id
      the bundle holds twice, fails; with no binding the check is
      not_applicable, never a pass. The result counts gateway_receipts and
      bindings_checked, and receipt_verify --require-bindings
      (Options.RequireGatewayBindings) fails a gateway receipt that has no
      binding, so exit 0 then covers every gateway receipt's own facts.
      helm-gateway serves GET /api/v1/receipt-keyring on its API listener,
      public and read-only, in the Kernel's keyring shape (CTL-050) under its
      own label, gateway-receipt-keyring.v1, for the key it signs receipts
      with, and refuses to start with a signer it cannot publish. GetAttemptReceipts returns an attempt's receipts as the exact
      stored envelope and binding bytes, to a helm.gateway.read token that can
      read the attempt (its tenant, workspace and episode scope).
      ExportReceiptChain returns receipts from_seq to to_seq, at most 256, of
      the chain of the token's tenant and workspace, in order, as the document
      receipt_verify checks offline; it refuses a workspace_id other than the
      token's and an episode token, reads a range that runs past the chain's
      head up to the head and names it (one that starts past it is not
      found), and never returns a range with a gap. A frozen gateway chain of
      three decisions and one outcome keeps verifying.
    status: enforced
    entry_points:
      - "core/pkg/receiptverify.VerifyBundle"
      - "core/pkg/receiptverify.VerifyBundleWith"
      - "core/pkg/receiptverify.ParseGatewayBinding"
      - "core/pkg/receiptverify.ParseGatewayOutcomeBinding"
      - "core/cmd/receipt_verify.addBindings"
      - "core/pkg/gateway/admission.encodeReceiptBundle"
      - "core/pkg/gateway/admission.Service.GetReceipts"
      - "core/pkg/gateway/admission.Service.ExportReceiptChain"
      - "core/pkg/gateway/server.Server.GetAttemptReceipts"
      - "core/pkg/gateway/server.Server.ExportReceiptChain"
      - "core/pkg/gateway/runtime.receiptKeyringHandler"
    config:
      - "None beyond CTL-059's receipt key: the keyring describes HELM_GATEWAY_RECEIPT_SIGNING_KEY_FILE's public half under its key id. One export holds at most admission.MaxExportReceipts (256) receipts; the keyring route allows the Kernel's public route class rate (120 a second, bursts of 240) per gateway process."
    protected_operations:
      - "helm.gateway.v1.EffectGatewayService GetAttemptReceipts and ExportReceiptChain, and GET /api/v1/receipt-keyring, on helm-gateway serve's API listener."
      - "receipt_verify --receipt with gateway_bindings or --binding, with or without --require-bindings, and receiptverify.VerifyJSON in the WASM verifier."
    bypass_assumptions:
      - "The binding check proves the key holder signed these gateway facts. It cannot show the facts are true of a ledger the verifier does not see, and it says nothing of a receipt whose binding is not supplied: without --require-bindings exit 0 does not cover such a receipt. The WASM bridge has no require option; its caller compares bindings_checked with gateway_receipts."
      - "Trust in the key is the reader's: the keyring is public and unauthenticated by design. Over plain HTTP it can be substituted in transit; fetch it over the gateway's TLS listener or pin the key out of band (helm-gateway receipt-key). Behind HELM_TLS_CLIENT_AUTH=require the API listener also asks the reader for a client certificate."
      - "An export proves its range is contiguous and signed. It does not show that nothing follows to_seq: the database owner can delete the newest receipts and rewind the head (CTL-059); head_seq is what the ledger said when it was read."
      - "Continuation and reassignment grants do not extend to receipts: such a token reads the receipts of the attempts its own scope covers only. An episode token cannot export the chain, which holds every episode's decisions in its workspace."
      - "The keyring route's rate bound is per process, shared by all callers, as the Kernel's public class is; a caller exhausting it delays other readers of the public key, never a decision."
      - "Only the binding versions the verifier names are recognised; a receipt that commits to another fails the binding check until the verifier learns that version. A gateway receipt is recognised by its session_id prefix (helm-gateway:), which its producer writes."
    tests:
      allowed:
        - "core/pkg/receiptverify.TestFrozenGatewayChainStillVerifies"
        - "core/pkg/gateway/admission.TestEncodeReceiptBundleRoundTrips"
        - "core/pkg/gateway/admission.TestFrozenGatewayChainIsWhatTheBuilderSigns"
        - "core/pkg/gateway/admission.TestOutcomeBindingMatchesItsSchema"
        - "core/cmd/receipt_verify.TestGatewayExportVerifiesWithItsBindings"
        - "core/cmd/receipt_verify.TestBindingFlagChecksOneReceipt"
        - "core/pkg/gateway/admission.TestReceiptExportIsTheWholeRangeOrNothing"
        - "core/pkg/gateway/admission.TestAttemptReceiptsAreReadOnlyForAVisibleAttempt"
        - "core/pkg/gateway/admission.TestPostgresReceiptExportVerifiesOfflineWithBindings"
        - "core/pkg/gateway/server.TestPostgresReceiptReadsOnTheWire"
        - "core/pkg/gateway/runtime.TestServePublishesTheReceiptKeyringOnTheMainListener"
      forbidden:
        - "core/pkg/receiptverify.TestTamperedGatewayBindingFails"
        - "core/pkg/receiptverify.TestGatewayChainGapFails"
        - "core/pkg/receiptverify.TestGatewayBindingMustAgreeWithTheSignedReceipt"
        - "core/pkg/receiptverify.TestParseGatewayBindingIsClosedAndCanonical"
        - "core/pkg/receiptverify.TestABindingNeedsAReceiptV5Signature"
        - "core/pkg/receiptverify.TestDuplicateReceiptIDCannotPlaceABinding"
        - "core/pkg/receiptverify.TestGatewayOutcomeBindingMustAgreeWithTheSignedReceipt"
        - "core/pkg/receiptverify.TestParseGatewayOutcomeBindingIsClosedAndCanonical"
        - "core/pkg/receiptverify.TestRequireGatewayBindings"
        - "core/cmd/receipt_verify.TestRequireBindingsFailsAGatewayReceiptWithoutOne"
        - "core/pkg/gateway/admission.TestReceiptExportRefusesBeforeReadingTheLedger"
        - "core/pkg/gateway/admission.TestPostgresReceiptReadsStayInTheTokensTenantAndWorkspace"
        - "core/pkg/gateway/runtime.TestReceiptKeyringRouteIsRateLimited"
        - "core/pkg/gateway/runtime.TestReceiptKeyringRefusesASignerItCannotPublish"
      removal:
        - "core/pkg/receiptverify.TestTamperedGatewayBindingFails"
        - "core/pkg/receiptverify.TestGatewayBindingMustAgreeWithTheSignedReceipt"
        - "core/pkg/receiptverify.TestParseGatewayBindingIsClosedAndCanonical"
        - "core/pkg/receiptverify.TestABindingNeedsAReceiptV5Signature"
        - "core/pkg/receiptverify.TestRequireGatewayBindings"
        - "core/cmd/receipt_verify.TestRequireBindingsFailsAGatewayReceiptWithoutOne"
        - "core/pkg/receiptverify.TestGatewayOutcomeBindingMustAgreeWithTheSignedReceipt"
        - "core/cmd/receipt_verify.TestBindingFlagChecksOneReceipt"
        - "core/pkg/gateway/admission.TestReceiptExportRefusesBeforeReadingTheLedger"
        - "core/pkg/gateway/admission.TestReceiptExportIsTheWholeRangeOrNothing"
        - "core/pkg/gateway/admission.TestAttemptReceiptsAreReadOnlyForAVisibleAttempt"
        - "core/pkg/gateway/runtime.TestServePublishesTheReceiptKeyringOnTheMainListener"
        - "core/pkg/gateway/runtime.TestReceiptKeyringRouteIsRateLimited"
      bypass:
        - "core/pkg/receiptverify.TestGatewayBindingCheckIsNotApplicableWithoutBindings"
        - "core/pkg/receiptverify.TestGatewayChainIDFramesTenantAndWorkspace"

  - id: CTL-061
    title: "TON Acton runs local, fork and testnet only, and never tenant code beside a key"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      helm-gateway performs TON Acton operations as gateway effects (helm-tracker#266)
      in the owner's scope. Local operations: project new and init, version,
      doctor, env, doc, build, check, format, format_check, test, wrapper
      generation, compile, disasm, library info and fetch. Forks of testnet and
      mainnet state: script.fork_testnet and script.fork_mainnet. Testnet
      operations: library.publish_testnet, library.topup_testnet and
      source.verify_testnet. Two classes are refused at Propose, before any
      mandate, adapter or database read, and have no adapter: every mainnet
      operation (library.publish_mainnet, library.topup_mainnet, script.mainnet,
      source.verify_mainnet) with ERR_TON_MAINNET_REFUSED, and script.testnet
      with ERR_TON_TENANT_CODE_WITH_KEY_REFUSED, because an Acton script is
      tenant-authored code that can read the process environment and files and
      must not share a process with a signing key. Acton can execute tenant
      files in every operation except version, doctor, env, doc, project new and
      project init, so those operations are declared only when the operator
      configures an isolation command (HELM_GATEWAY_TON_ACTON_ISOLATION_CMD, a
      JSON array: the program and arguments that run Acton under another uid or
      in a container with no access to the gateway's credential files); without
      it they fail closed at declaration. The adapter re-validates every
      argument itself (no flag-shaped or escaping path, no network other than
      testnet, only the properties the operation takes), refuses a workspace
      that holds a .env or wallets.toml in the project or any directory above it
      up to the tenant root (Acton loads them on its own), and compares a
      declared acton_version or tolk_compiler_version with what the configured
      binary reports for acton --version, refusing on any mismatch or any pin
      the binary does not report. The testnet wallet secret is held by the
      gateway's custody (one owner-only file per tenant and wallet_ref, outside
      the workspace), is put in one environment variable of the Acton process
      for a testnet call only, and is never in a request body, the argv, the
      run record or the result; exact occurrences in output are replaced before
      anything is stored. Testnet operations are declared only when a testnet
      RPC, a wallets file and an isolation command are configured. An attempt
      marker is created exclusively before Acton starts: if it cannot be
      written nothing is launched, and an existing marker means the attempt is
      not launched again. Dispatch answers NOT_SENT when the adapter or the
      connector's policy refuses before a process runs, when the binary cannot
      start, or when a read-only operation failed or was cut short; SENT when
      Acton ran; and INDEFINITE when a write or broadcast was cut short, exited
      non-zero, left no record or printed something other than its output
      contract (ERR_CONNECTOR_CONTRACT_DRIFT). Observe reads back the attempt's
      run record, and for a broadcast the transaction on testnet through the
      RPC; a marker with no record is UNKNOWN, never FAILED by absence. A result
      must satisfy the declared result schema.
    status: enforced
    entry_points:
      - "core/pkg/gateway/admission.validateProposal"
      - "core/pkg/gateway/adapters/tonacton.Adapter.Dispatch"
      - "core/pkg/gateway/adapters/tonacton.Adapter.Observe"
      - "core/pkg/gateway/custody.TONWallets.Token"
      - "core/pkg/gateway/runtime.tonActonFromEnv"
    config:
      - "HELM_GATEWAY_TON_ACTON_BIN and HELM_GATEWAY_TON_ACTON_WORKSPACE (absolute paths, both or neither) install the operations that do not run over tenant files."
      - "HELM_GATEWAY_TON_ACTON_ISOLATION_CMD (a JSON array whose first element is an absolute program) adds the operations that run over tenant files."
      - "HELM_GATEWAY_TON_TESTNET_RPC_URL and HELM_GATEWAY_TON_TESTNET_WALLETS_FILE (both or neither, only with the isolation command) add the testnet operations; HELM_GATEWAY_TON_TESTNET_MAX_SPEND is their per-action TON ceiling, default 1. These are operator-provided: the gateway chart does not mount a wallets file or set these variables yet."
    protected_operations:
      - "Running Acton for a tenant, and broadcasting from the gateway's testnet wallet, through the Propose, Dispatch and Observe path of helm-gateway."
    bypass_assumptions:
      - "Nothing confines Acton unless the operator's isolation command does. The gateway cannot see what the command does; the control claims only that the operations that run over tenant files are not declared without one, and that wallet secret files must be owner-only and outside the workspace. If the isolation command runs Acton under the gateway's own uid, or with a credential file mounted, tenant code can read it."
      - "Mediation is observed-only for every operation: Acton runs on the gateway host and the workspace is reachable by whoever operates it, so the gateway is not the only path to any effect."
      - "The testnet wallet secret is in the Acton process environment for the length of a testnet call. publish, topup and verify were not shown, against upstream Acton, to run no tenant-authored code; they are admitted on the strength of the isolation command and the .env and wallets.toml refusal, and the secret is a testnet key whose tenant owns the wallet_ref. A mainnet key must never be mounted. script.testnet, the one operation known to run tenant Tolk, is refused."
      - "Redaction replaces exact occurrences of the secret only; an encoded or reversed copy in output is not recognised."
      - "max_ton_spend is a declared ceiling compared with the configured ceiling; the amount actually spent is not measured against it. The testnet check shows a transaction with the printed hash exists on the account, not what it did."
      - "A version or Tolk pin is confirmed only as a substring of acton --version output. A binary that does not print the Tolk compiler version makes every Tolk pin fail closed. The workspace file check is made before the run; a tenant can write a .env between the check and the run."
      - "The broadcast output contract (one JSON object with address and tx_hash) and the variable ACTON_WALLET_SECRET are the gateway's declared interface to Acton, not qualified against a real Acton release; a release that differs makes testnet operations INDEFINITE, never SUCCEEDED."
      - "The run record and the attempt marker are files in the tenant's workspace written by the gateway; anyone who can write there can forge or delete them. A forged record cannot confirm a broadcast, which also needs the RPC; a deleted marker and record read as FAILED by absence for an operation that left no other trace. Authority, reservations and receipts stay in Postgres."
      - "Project paths inside a project are checked by pattern; Acton itself follows symlinks a project contains."
    tests:
      allowed:
        - "core/pkg/gateway/adapters/tonacton.TestLocalBuildRunsWithoutTheWalletAndReadsBack"
        - "core/pkg/gateway/adapters/tonacton.TestTestnetBroadcastKeepsTheSecretInTheEnvironmentOnly"
        - "core/pkg/gateway/adapters/tonacton.TestProjectNewAndInit"
      forbidden:
        - "core/pkg/gateway/admission.TestTONMainnetEffectsAreRefusedBeforeAnyDatabaseUse"
        - "core/pkg/gateway/adapters/tonacton.TestMainnetEffectsAreRefusedByTheAdapterToo"
        - "core/pkg/gateway/adapters/tonacton.TestDispatchRefusals"
        - "core/pkg/gateway/adapters/tonacton.TestAdapterRevalidatesArgumentsWithoutTheSchema"
        - "core/pkg/gateway/adapters/tonacton.TestWorkspaceConfigActonLoadsIsRefused"
        - "core/pkg/gateway/adapters/tonacton.TestOperationsOverTenantFilesNeedIsolation"
        - "core/pkg/gateway/custody.TestTONWalletsServeOnlyTheTenantsOwnWallet"
      removal:
        - "core/pkg/gateway/adapters/tonacton.TestDeclarationsAreTheOwnersScopeAndNeverMainnet"
        - "core/pkg/gateway/adapters/tonacton.TestEveryConnectorCommandIsDecided"
        - "core/pkg/gateway/runtime.TestTONActonIsOptionalAndAllOrNothing"
        - "core/pkg/gateway/admission.TestTONMainnetEffectsAreRefusedBeforeAnyDatabaseUse"
      bypass:
        - "core/pkg/gateway/adapters/tonacton.TestSecretEchoedByActonIsRedacted"
        - "core/pkg/gateway/adapters/tonacton.TestProjectCannotResolveOutsideTheTenantWorkspace"
        - "core/pkg/gateway/adapters/tonacton.TestTestnetFailureModes"
        - "core/pkg/gateway/adapters/tonacton.TestChainReadBack"
        - "core/pkg/gateway/adapters/tonacton.TestVersionPinsAreMeasuredAgainstTheBinary"
        - "core/pkg/gateway/adapters/tonacton.TestAttemptMarkerKeepsAnUnrecordedBroadcastUnknown"
        - "core/pkg/gateway/adapters/tonacton.TestRecordWriteFailureAfterABroadcastIsIndefiniteAndStaysUnknown"
        - "core/pkg/gateway/adapters/tonacton.TestPlaintextWalletMaterialIsRefusedByPolicy"
        - "core/pkg/gateway/custody.TestRoutedSendsTONEffectsToTheWalletsOnly"
        - "core/pkg/gateway/custody.TestTONWalletSecretMustBeOwnerOnly"

  - id: CTL-062
    title: "Gateway sandbox effects stay in their tenant and hold no provider key"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      When an operator configures a sandbox provider, helm-gateway performs
      sandbox.create, sandbox.exec and sandbox.terminate through it
      (helm-tracker#266, P17): Docker, E2B, Daytona, OpenSandbox and Claude
      Managed Agents, behind one adapter. The provider and the sandbox come
      only from the effect's target (sandbox/{provider}[/{sandbox_id}], checked
      at Propose by effectargs.SandboxTarget and again by the adapter), never
      from its arguments, whose closed schemas admission checks and which
      carry no environment and no secret. The adapter compares the permit's
      argument digest with the bytes it acts on before any provider call. A
      sandbox it creates carries a label with a digest of the creating tenant
      and one with the attempt; exec and terminate act only on a sandbox that
      carries the calling tenant's label, and a sandbox of another tenant, or
      one the gateway did not create, is refused as one that does not exist
      (NOT_SENT, PRECONDITION_FAILED), so a provider account shared by
      tenants does not share its sandboxes. Create looks for a sandbox
      carrying its attempt's label before it writes and never creates a
      second; exec records its start, output and exit status in the sandbox
      and does not start twice for one attempt. The provider key is asked
      for from the gateway's custody (custody.SandboxKeys, the key file the
      operator mounted into the gateway Pod only) on every operation, handed
      to the provider client for that operation, and appears in no request
      body, URL, command, label, stored attempt, observation or receipt; a
      keyless provider (Docker) is never asked. A dispatch is NOT_SENT only
      when the effect certainly did not happen (a refusal before any write, or
      a provider 4xx other than 408; for exec, a wrapper status of 125 to 127
      only when the sandbox's record, read back, shows no start, since a
      provider may derive that status from stderr the command wrote); a
      transport failure, a 5xx, a timeout, an answer too large or an answer of
      the wrong shape after a write is INDEFINITE
      (ERR_CONNECTOR_CONTRACT_DRIFT or PROVIDER_RESPONSE_TOO_LARGE for the last
      two), and Observe reconciles it by reading the provider back: the
      sandbox inventory by label for create and terminate, and the record the
      command left in the sandbox for exec. A list answer that is not a list
      (null, {}, no items array) is ERR_CONNECTOR_CONTRACT_DRIFT, never an
      empty list, and a missing exec record is UNKNOWN, never FAILED: the
      command may have run and removed it. The command runs in a subshell, so
      a builtin (eval, exec, exit) cannot end the wrapper. An established result
      is a schema-checked artifact (admission.typedResult). Every provider
      answer is read through a size limit and no redirect is followed, so the
      key is never replayed to another host, and every provider URL must be
      an https URL (tls_required: false is refused), which stops the gateway
      at start, so no call, including the reads before a create, sends the key
      in clear. A create's limits and egress policy are applied by the
      provider or the create is refused (NOT_SENT): E2B and Daytona send none
      of them and refuse a create until they do. Claude Managed Agents
      commands run only on the customer's worker (a RemoteRunner over HTTPS
      with the custody's bearer token), never on the gateway's own host; its
      sandbox ids are random, every exec and terminate carries the tenant
      digest and the worker is to refuse another tenant's, an exec carries the
      egress policy and limits the worker is to apply, terminate calls the
      worker, and its egress changes are refused. Docker sandboxes are
      labelled containers from an image pinned by digest, with no
      environment, no mounts, no network, all capabilities dropped, a
      read-only root and `sleep` as the only entrypoint, so the image's own
      code never runs at create. With no provider configured the gateway has
      no sandbox effect type.
    status: enforced
    entry_points:
      - "core/pkg/gateway/runtime.sandboxFromEnv"
      - "core/pkg/gateway/sandboxproviders.Build"
      - "core/pkg/gateway/adapters/sandbox.Adapter.Dispatch"
      - "core/pkg/gateway/adapters/sandbox.Adapter.Observe"
      - "core/pkg/gateway/adapters/sandbox.Adapter.resolve"
      - "core/pkg/gateway/adapters/sandbox.op.owned"
      - "core/pkg/gateway/custody.SandboxKeys.Token"
      - "core/pkg/gateway/custody.Route.Token"
      - "core/pkg/gateway/effectargs.SandboxTarget"
      - "core/pkg/connectors/sandbox.DoJSON"
    config:
      - "HELM_GATEWAY_SANDBOX_CONFIG_FILE: a JSON file (core/pkg/gateway/adapters/sandbox.Config) that lists the enabled providers and, for each provider that takes a key, the path of its key file (an operator mounts the Secret into the gateway Pod only; the Helm chart has no values for it yet). Unset, no sandbox effect type exists. A field that does not belong to a provider, an unknown field and a provider listed twice stop the gateway."
      - "A tenant registers sandbox.create, sandbox.exec and sandbox.terminate as effect types with the risk classes the catalog declares (medium, high, low), and a mandate grants them over targets; the gateway's adapter does not grant."
    protected_operations:
      - "Every sandbox.create, sandbox.exec and sandbox.terminate dispatch and read-back of helm.gateway.v1.EffectGatewayService and of the MCP tools on the worker and executor listeners, on helm-gateway serve."
      - "The provider key for a sandbox effect: custody.SandboxKeys.Token, reached only through the adapter's TokenSource."
    bypass_assumptions:
      - "The cloud providers' wire shapes (E2B, Daytona, OpenSandbox) follow each adapter's documented style and are proven only against fake provider servers; no provider account exists, so no live qualification has run. The Claude Managed Agents worker exec protocol v1 is defined by RemoteRunner and proven only against a fake worker; no worker in this tree implements it. Whether a worker binds a sandbox id to its first tenant, applies the egress policy and limits it is sent and ends a sandbox on terminate is the worker's promise: the gateway checks only that the worker echoes the tenant and says it applied the spec and terminated."
      - "Tenant isolation is the label the adapter puts on a sandbox it creates. The provider account is shared: anyone who holds the account's key outside the gateway, or a provider feature that edits a sandbox's labels, can defeat it. The tenant label is a digest of the tenant id, not a secret."
      - "sandbox.exec is declared high risk, but the effect type's risk class in a tenant's rows decides whether admission asks for approval and a step-up; a tenant that registers it lower runs commands without them."
      - "Observe reads the command's result from the record the command's own sandbox keeps under /tmp/.helm/<attempt>. A command can overwrite or delete that record, so the result's trust class is sandbox_reported, never provider_readback, and a missing record leaves the exec UNKNOWN. The result carries the exit status, the output sizes and the first 8 KiB of each stream, not the complete output. A timed_out state means the command had not finished past its timeout and may still be running: neither the gateway nor the Docker provider kills it. The sandbox image needs sh, mkdir, date, cat, wc, mv and head; a sandbox that is gone before the read-back leaves the exec UNKNOWN."
      - "A 4xx to a write is taken as a definite refusal (except 408). A provider that executes a write and then answers 4xx would make a NOT_SENT wrong."
      - "A dispatch that looks for an existing sandbox and finds none, then creates, is not atomic with another gateway replica doing the same for the same attempt; the claim that consumes the permit is, and a permit is consumed once."
      - "Claude Managed Agents sandboxes are session-scoped records in the gateway process (the adapter keeps them in memory). A restart zeroes only that record, not the worker: the sandboxes it held keep running on the worker and the gateway can no longer reach, read back or terminate them. Create makes bookkeeping directories under the configured workspace and outputs roots on the gateway host and makes no worker request; its create and terminate read-backs read the gateway's own record (trust class gateway_record, not provider_readback). The managed-agent receipts it computes are signed with the gateway's receipt key through Sign over the hash of the receipt body, not through SignReceipt over a gateway receipt, and are not stored in the gateway's ledger."
      - "The Docker provider drives a docker CLI that talks to a daemon: access to a daemon socket is root-equivalent on that host. Use a private daemon (docker_socket), not the host's. The live Docker test skips without a daemon and a local image, so it is not one of this control's proofs."
      - "The provider key is cached by the gateway's custody until its key file changes (custody providerKeyFile.reloadIfChanged), is handed to the provider client for each operation, and is not zeroed in the gateway process's memory."
      - "The Docker provider's exec timeout stops the docker CLI, not the process in the container, and the gateway's wrapper does not kill a command past its timeout; a command that outlives its timeout keeps running until the sandbox ends."
      - "A sandbox with network access is refused on Docker (the default bridge links the containers of different tenants and the host), and a disk limit is refused there; E2B and Daytona refuse every create until their create call carries the limits and the egress policy. The OpenSandbox create sends them, on a wire shape no live server has confirmed."
    tests:
      allowed:
        - "core/pkg/gateway/adapters/sandbox.TestCreateDispatchesOnceLabelsTheSandboxAndReadsItBack"
        - "core/pkg/gateway/adapters/sandbox.TestExecRunsTheCommandOnceAndReadsItsRecordBack"
        - "core/pkg/gateway/adapters/sandbox.TestExecRecordLargeOutputIsBoundedAndWorkdirIsUsed"
        - "core/pkg/gateway/adapters/sandbox.TestTerminateAndItsReadBack"
        - "core/pkg/gateway/adapters/sandbox.TestAnIndefiniteCreateIsReconciledByReadBack"
        - "core/pkg/gateway/sandboxproviders.TestCloudProvidersRunTheWholeLifecycleAgainstFakeServers"
        - "core/pkg/gateway/sandboxproviders.TestCloudCreateFaultsAreClassifiedAndReconciledByReadBack"
        - "core/pkg/gateway/sandboxproviders.TestClaudeManagedExecutesOnlyOnTheRemoteWorker"
        - "core/pkg/gateway/sandboxproviders.TestE2BAndDaytonaRefuseACreateWhoseLimitsTheyDoNotApply"
        - "core/pkg/gateway/sandboxproviders.TestAListAnswerOfTheWrongShapeLeavesTheCreateUnknown"
        - "core/pkg/gateway/sandboxproviders.TestDockerRefusesANetworkedSandboxAtAdmission"
        - "core/pkg/gateway/adapters/sandbox.TestExecRemovedRecordIsUnknownNotFailed"
        - "core/pkg/connectors/sandbox/claudemanaged.TestRemoteRunnerCarriesTheTenantAndSpecAndVerifiesTheEcho"
        - "core/pkg/connectors/sandbox/claudemanaged.TestHostedTerminateReachesTheWorkerBeforeTheRecordChanges"
        - "core/pkg/connectors/sandbox/claudemanaged.TestSandboxIDsAreRandomAndDoNotRepeatAcrossAdapters"
        - "core/pkg/connectors/sandbox/e2b.TestGatewayFindAnswerOfTheWrongShapeIsDrift"
        - "core/pkg/sandbox/docker.TestExecClassification"
        - "core/pkg/gateway/runtime.TestSandboxEffectsAreWiredFromTheConfigurationFile"
        - "core/pkg/gateway/custody.TestSandboxKeysServeTheTargetProvidersKeyOnly"
        - "core/pkg/gateway/admission.TestPostgresSandboxEffectsAdmitDispatchReconcileAndStayInTheirTenant"
      forbidden:
        - "core/pkg/gateway/adapters/sandbox.TestATenantReachesOnlyItsOwnSandboxes"
        - "core/pkg/gateway/adapters/sandbox.TestDispatchComparesTheArgumentDigestBeforeAnyProviderCall"
        - "core/pkg/gateway/adapters/sandbox.TestTargetsComeOnlyFromTheTarget"
        - "core/pkg/gateway/adapters/sandbox.TestCreateNotSentVersusIndefinite"
        - "core/pkg/gateway/adapters/sandbox.TestExecDispatchClassification"
        - "core/pkg/gateway/adapters/sandbox.TestExecOnASandboxThatIsNotRunning"
        - "core/pkg/gateway/adapters/sandbox.TestAnEffectWithoutAnInvocationDoesNotDispatch"
        - "core/pkg/gateway/adapters/sandbox.TestACredentialIsAskedForPerCallAndNeverLeavesTheProviderClient"
        - "core/pkg/gateway/sandboxproviders.TestCloudCreateWithoutAKeyOrWithAWrongKeySendsNothingUseful"
        - "core/pkg/gateway/adapters/sandbox.TestDeclarationsCompileAndTheirParsersAgreeWithTheirSchemas"
        - "core/pkg/gateway/adapters/sandbox.TestParseConfigAcceptsAWellFormedFileAndRefusesTheRest"
        - "core/pkg/gateway/sandboxproviders.TestDockerRuntimeMustBePinnedByDigest"
        - "core/pkg/gateway/effectargs.TestSandboxTargetsComeOnlyFromTheTarget"
        - "core/pkg/gateway/effectargs.TestValidateChecksASandboxEffectsTargetBeforeAdmission"
        - "core/pkg/gateway/runtime.TestSandboxEffectsAreOffUnlessConfigured"
        - "core/pkg/gateway/runtime.TestSandboxConfigurationErrorsStopTheGateway"
        - "core/pkg/gateway/custody.TestRouteSendsSandboxEffectsToTheSandboxCustodyAndTheRestAway"
        - "core/pkg/connectors/sandbox/claudemanaged.TestHostedRefusesLocalAndNilRunners"
        - "core/pkg/connectors/sandbox/claudemanaged.TestWorkerWorkDirNeverSendsAPathOnTheGatewayHost"
      removal:
        - "core/pkg/gateway/adapters/sandbox.TestATenantReachesOnlyItsOwnSandboxes"
        - "core/pkg/gateway/sandboxproviders.TestCloudProvidersRunTheWholeLifecycleAgainstFakeServers"
        - "core/pkg/gateway/adapters/sandbox.TestDispatchComparesTheArgumentDigestBeforeAnyProviderCall"
        - "core/pkg/gateway/adapters/sandbox.TestAKeylessProviderIsNeverAskedForACredential"
        - "core/pkg/gateway/adapters/sandbox.TestExecDoesNotStartTwiceForOneAttempt"
        - "core/pkg/gateway/sandboxproviders.TestBuildRefusesPlainHTTPAndInsecureTLSAtStart"
        - "core/pkg/gateway/adapters/sandbox.TestExecBuiltinsCannotEndTheWrapper"
        - "core/pkg/sandbox/docker.TestCreateArgsAreHardenedAndPinned"
        - "core/pkg/gateway/adapters/sandbox.TestCreateDispatchesOnceLabelsTheSandboxAndReadsItBack"
        - "core/pkg/gateway/custody.TestRouteSendsSandboxEffectsToTheSandboxCustodyAndTheRestAway"
        - "core/pkg/gateway/effectargs.TestSandboxTargetsComeOnlyFromTheTarget"
        - "core/pkg/gateway/runtime.TestSandboxEffectsAreWiredFromTheConfigurationFile"
      bypass:
        - "core/pkg/gateway/adapters/sandbox.TestCreateReadBackStates"
        - "core/pkg/gateway/sandboxproviders.TestACreateDoesNotFollowARedirectWithTheKey"
        - "core/pkg/gateway/adapters/sandbox.TestExecReadBackWhileTheCommandRunsAndAfterItsTimeout"
        - "core/pkg/gateway/sandboxproviders.TestAnUnconfiguredProviderIsNotReachedByItsTarget"
        - "core/pkg/connectors/sandbox.TestDoJSONDoesNotFollowARedirectWithTheCredential"
        - "core/pkg/connectors/sandbox.TestShellJoinRunsTheOriginalArgumentVector"
        - "core/pkg/connectors/sandbox.TestValidIDRefusesWhatCouldEscapeAPathOrACommandLine"
        - "core/pkg/connectors/sandbox/e2b.TestGatewayFindFiltersOnTheClientAndNeverTruncates"
        - "core/pkg/connectors/sandbox/claudemanaged.TestRemoteRunnerDoesNotFollowRedirects"

  - id: CTL-066
    title: "A model call's hold bounds what the provider can bill"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      helm-gateway's model gateway quotes a call at one token per request byte
      plus a token floor for each inline image and each tool definition the
      provider adds, and the clamped output maximum at the route's price, the
      input at the dearest cache-write price when the request may write a
      prompt cache (on an anthropic or openai-compatible route that names
      none, 1.25 and 2 times input), and refuses with 400, before any attempt
      exists, every request form whose bill that quote does not bound: a
      member of the request, of a message, of an input item, of a content
      part, of a block or block source, or of reasoning, text, thinking,
      output_config, output_format or context_management outside a closed
      list per API (core/pkg/gateway/modelbound), Responses instructions that
      are not a string, so a stored conversation, a stored prompt, store true,
      a reasoning item without its encrypted content, an item named by its id
      alone, remote or uploaded media, a data URL that is not an image, PDFs,
      cited documents, audio, predicted outputs, routing members, priority
      tiers, compaction and Anthropic's speed and inference_geo, and an
      anthropic-beta outside its allowlist, which it forwards on the Messages
      API only. It forwards a Responses request with store false unless it
      names it, and on a vendor route the standard service tier when the
      request names none or auto (helm-tracker#313).
    status: enforced
    entry_points:
      - "core/pkg/gateway/modelgw.inspect"
      - "core/pkg/gateway/modelgw.boundRequest"
      - "core/pkg/gateway/modelgw.anthropicBetaRefusal"
      - "core/pkg/gateway/modelgw.Route.Quote"
      - "core/pkg/gateway/modelbound.Check"
      - "core/pkg/gateway/modelbound.BetaRefusal"
      - "core/pkg/gateway/modelgw.ParseConfig"
    config:
      - "HELM_GATEWAY_MODEL_ROUTES_FILE: each route's price, output maximum and provider kind (openai and anthropic get the standard service tier named; anthropic and openai-compatible routes that name no cache_write_5m or cache_write_1h get 1.25 and 2 times input)."
    protected_operations:
      - "Every model call on helm-gateway serve's /v1/responses, /v1/chat/completions and /v1/messages, on the main and the worker listener."
    bypass_assumptions:
      - "Bytes bound tokens because the providers' tokenizers emit at most one token per byte, and chat templates and tool definitions rendered from a request's JSON cost no more tokens than their bytes."
      - "The image and tool floors are at or above the costs the providers document (docs/architecture/model-gateway.md); a provider that bills more for an image or a hidden tool definition than documented is not bounded."
      - "The provider honours the output maximum, and the route's price is the provider's highest for a request of max_request_bytes at the tier the gateway sends; on an openai-compatible route an absent service tier is assumed to bill at the route's price."
      - "An input item that carries its content is billed for that content, not for a stored item of the same id."
      - "Headers other than anthropic-beta change nothing the provider bills; anthropic-beta and anthropic-version are forwarded on the Messages API only."
      - "Encrypted reasoning (encrypted_content), thinking signatures and redacted_thinking data a request carries cost no more input tokens than their bytes; an openai-compatible upstream keeps the reasoning budget reasoning_effort asks for within the forwarded output maximum."
      - "A cache write bills at most the route's cache-write price; on an openai-compatible route the gateway reads no cache-write count and settles a write at the input price, though the hold covers it."
      - "A provider that bills above the hold anyway is recorded: the confirmed amount stays on the budget counter and billable is capped at the hold."
    tests:
      allowed:
        - "core/pkg/gateway/modelgw.TestRequestsTheQuoteUnderstandsStillPass"
        - "core/pkg/gateway/modelgw.TestHiddenToolDefinitionsAreInTheHold"
        - "core/pkg/gateway/modelgw.TestResponsesAreNotStored"
        - "core/pkg/gateway/modelbound.TestKnownMembersPass"
      forbidden:
        - "core/pkg/gateway/modelgw.TestRequestFormsWhoseCostTheQuoteCannotSeeAreRefused"
        - "core/pkg/gateway/modelgw.TestTheHoldCoversWhatAnAllowedRequestCanBill"
        - "core/pkg/gateway/modelgw.TestLongContextBetaIsRefused"
        - "core/pkg/gateway/modelgw.TestAnthropicBetasAreAllowlisted"
        - "core/pkg/gateway/modelgw.TestStoredStateNamedByIDIsRefused"
        - "core/pkg/gateway/modelgw.TestServiceTierIsTheStandardTier"
        - "core/pkg/gateway/modelgw.TestNestedMembersAreClosed"
        - "core/pkg/gateway/modelgw.TestCitedDocumentsAreRefused"
        - "core/pkg/gateway/modelgw.TestInlineMediaMustBeAnImage"
        - "core/pkg/gateway/modelgw.TestChatMessageMembersAreClosed"
        - "core/pkg/gateway/modelgw.TestFittedDefaultOutputCountsTheFloors"
        - "core/pkg/gateway/modelgw.TestPartMembersAreClosedOnTheModelGateway"
        - "core/pkg/gateway/modelgw.TestAnthropicBetaIsNotForwardedOffTheMessagesAPI"
        - "core/pkg/gateway/modelgw.TestCacheWritesAreHeldAtTheWritePrice"
        - "core/pkg/gateway/modelbound.TestPartItemAndBlockMembersAreClosed"
        - "core/pkg/gateway/modelbound.TestFloorsArePinned"
        - "core/pkg/gateway/modelbound.TestStreamMustBeABoolean"
        - "core/pkg/gateway/modelbound.TestCacheWritesNeedTheOption"
