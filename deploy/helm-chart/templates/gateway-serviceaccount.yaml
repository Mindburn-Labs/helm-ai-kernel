{{- if .Values.gateway.enabled }}
{{- include "helm-ai-kernel.gatewayValidate" . }}
# The gateway calls no Kubernetes API, so it carries no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "helm-ai-kernel.gatewayName" . }}
  labels:
    {{- include "helm-ai-kernel.gatewayLabels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
