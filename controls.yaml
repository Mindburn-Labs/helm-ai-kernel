      - "The fence denies newly governed dispatches only; it does not cancel work already in flight."
    tests:
      allowed:
        - "core/cmd/helm-ai-kernel.TestEmergencyStopFenceRoutePersistsSignedFenceAndReplays"
      forbidden:
        - "core/pkg/guardian.TestScopedStopFenceDeniesExplicitlyScopedDispatch"
        - "core/pkg/guardian.TestScopedStopReaderFailureFailsClosedForScopedDispatch"
        - "core/cmd/helm-ai-kernel.TestEmergencyStopFenceRouteFailsClosed"
        - "core/cmd/helm-ai-kernel.TestEvaluateRouteBindsWorkspaceFromVerifiedHeaderWhenScopedFenceEnabled"
      removal:
        - "core/pkg/guardian.TestScopedStopFenceDeniesExplicitlyScopedDispatch"
      bypass:
        - "core/pkg/guardian.TestScopedStopReaderDeniesUnscopedEvaluationToPreventFenceBypass"

  - id: CTL-006
    title: "Fence-scope binding"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      With the emergency-stop fence enabled, runtime routes bind the configured
      tenant and workspace, and a caller asserting another scope is refused.
    status: enforced
    entry_points:
      - "core/cmd/helm-ai-kernel.bindRuntimeScope"
    config:
      - "HELM_EMERGENCY_STOP_FENCE_ENABLED"
      - "HELM_RUNTIME_TENANT_ID"
      - "HELM_RUNTIME_WORKSPACE_ID"
    protected_operations:
      - "Evaluate, receipt and ext_authz routes while the fence is enabled."
    bypass_assumptions:
      - "With the fence off (the chart default), nothing is bound: the kernel answers for the tenant the caller asserts. This is the known gap that CTL-007 records."
    tests:
      allowed:
        - "core/cmd/helm-ai-kernel.TestFencedReceiptReadsBindTheConfiguredTenant"
      forbidden:
        - "core/cmd/helm-ai-kernel.TestFencedReceiptReadsBindTheConfiguredTenant"
        - "core/cmd/helm-ai-kernel.TestReceiptRoutesRequireConfiguredWorkspaceWhenScopedFenceEnabled"
        - "core/cmd/helm-ai-kernel.TestExtAuthzTakesTheScopeFromConfigurationNotTheBody"
      removal:
        - "core/cmd/helm-ai-kernel.TestFencedReceiptReadsBindTheConfiguredTenant"
      bypass:
        - "core/cmd/helm-ai-kernel.TestFenceOffControlPlaneCallersKeepTheirPreviousBehavior"

  - id: CTL-007
    title: "Tenant and principal come from the token"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      Tenant and principal come only from the authenticated credential (binding
      rule R9).
    status: observed-only
    reason: >-
      Not held. Tenant and principal arrive as X-Helm-Tenant-ID and
      X-Helm-Principal-ID headers beside a shared bearer key. The kernel checks
      them against the configured pair or a principal-binding row, but does not
      derive them from the credential. Only the approval workload routes take
      tenant and workspace from a verified JWT, and CTL-006 binds the configured
      scope while the emergency-stop fence is on.
    entry_points:
      - "core/cmd/helm-ai-kernel.requireRuntimeTenant"
    config:
      - "HELM_RUNTIME_TENANT_ID"
      - "HELM_RUNTIME_PRINCIPAL_ID"
    protected_operations:
      - "Tenant-scoped runtime routes."
    bypass_assumptions:
      - "Any holder of the shared key may assert any registered tenant and principal pair."
    tests:
      allowed: []
      forbidden:
        - "core/cmd/helm-ai-kernel.TestTenantScopedRuntimeAuthRejectsTenantMismatch"
        - "core/cmd/helm-ai-kernel.TestTenantScopedRuntimeAuthRejectsNonEnvPairNotInStore"
      removal: []
      bypass: []

  - id: CTL-008
    title: "Approval grant is consumed once"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      An approval grant is consumed at most once, only by the verified workload
      it names.
    status: enforced
    entry_points:
      - "core/pkg/boundary/approvalceremony.Service.ConsumeGrant"
    config:
      - "HELM_APPROVAL_CONSUMPTION_ENABLED (off by default; off means the routes are absent)"
      - "HELM_APPROVAL_CONSUMER_ISSUER"
      - "HELM_APPROVAL_CONSUMER_AUDIENCE"
    protected_operations:
      - "Approval grant consumption through the approval consumption routes on Postgres."
    bypass_assumptions:
      - "The single-consume proof needs Postgres; it skips in make test and runs in .github/workflows/approval-ceremony.yml, where a skip fails."
    tests:
      allowed:
        - "core/pkg/boundary/approvalceremony.TestServiceConsumesAndRecoversOnlyForExactWorkloadIdentity"
      forbidden:
        - "core/pkg/boundary/approvalceremony.TestServiceRejectsUnverifiedConsumerBeforePersistence"
        - "core/pkg/boundary/approvalceremony.TestPostgresLifecycleSingleIssueAndConsume"
        - "core/cmd/helm-ai-kernel.TestApprovalGrantConsumptionRoutesFailClosedOnWorkloadAuthentication"
      removal:
        - "core/pkg/boundary/approvalceremony.TestPostgresLifecycleSingleIssueAndConsume"
      bypass:
        - "core/cmd/helm-ai-kernel.TestApprovalGrantConsumptionConsumeEnforcesVerifiedScopedFence"

  - id: CTL-009
    title: "Evidence bundle verification"
    owner: Mindburn Labs core team (conformance)
    claim: >-
      Receipts and evidence bundles verify, and a tampered, truncated or
      untrusted bundle fails verification.
    status: enforced
    entry_points:
      - "core/pkg/verifier.VerifyBundleWithOptions"
    config: []
    protected_operations:
      - "`helm-ai-kernel verify` over an EvidencePack bundle."
    bypass_assumptions:
      - "A self-attested seal is rejected by default; a caller that opts into accepting one gets weaker evidence."
    tests:
      allowed:
        - "core/pkg/verifier.TestVerifyBundle_Valid"
      forbidden:
        - "core/pkg/verifier.TestVerifyBundle_HashMismatch"
        - "core/pkg/verifier.TestChainIntegrity_DetectsTamperedReceiptBody"
        - "core/pkg/verifier.TestVerifyBundleRejectsUntrustedEmbeddedSignatures"
      removal:
        - "core/pkg/verifier.TestVerifyBundle_HashMismatch"
        - "core/pkg/verifier.TestChainIntegrity_DetectsTamperedReceiptBody"
      bypass:
        - "core/pkg/verifier.TestVerifyBundle_RejectsSelfAttestedSealByDefault"

  - id: CTL-010
    title: "MCP tool-call mediation"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      A tool call through the HELM MCP server is decided by the Guardian before
      dispatch; a denied call or an unapproved server never reaches the
      executor.
    status: enforced
    entry_points:
      - "core/pkg/mcp.GovernedExecutor.Execute"
    config: []
    protected_operations:
      - "tools/call over the HELM MCP server's stdio and HTTP transports."
    bypass_assumptions:
      - "A client that talks to a tool server directly is not governed (INV-024)."
      - "`helm-ai-kernel mcp approve` refuses to mint approval authority without a verifier."
    tests:
      allowed:
        - "core/cmd/helm-ai-kernel.TestMCPMediationProofTransportsRouteToolCallsThroughExecutor"
      forbidden:
        - "core/cmd/helm-ai-kernel.TestMCPMediationProofPolicyDenialsBlockDispatchAcrossTransports"
        - "core/cmd/helm-ai-kernel.TestMCPMediationProofUnapprovedServersBlockDispatchAcrossTransports"
        - "core/cmd/helm-ai-kernel.TestMCPMediationProofSchemaErrorsBlockBeforeExecutor"
      removal:
        - "core/cmd/helm-ai-kernel.TestMCPMediationProofPolicyDenialsBlockDispatchAcrossTransports"
      bypass:
        - "core/cmd/helm-ai-kernel.TestMCPMediationProofUnsupportedWebSocketTransportFailsClosed"
        - "core/cmd/helm-ai-kernel.TestRunMCPApproveFailsClosedWithoutVerifier"

  - id: CTL-011
    title: "Guardian budget draw-down"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      An action that passes policy draws down its budget, and a failed draw-down
      denies it.
    status: observed-only
    reason: >-
      No shipped path injects a budget tracker: Guardian.SetBudgetTracker has no
      production caller and WithBudgetTracker is in
      scripts/ci/deadcode-allowlist.txt, so the draw-down gate is skipped at
      runtime. No route reports a budget enforcer: GET /api/v1/budget/status,
      which answered a hard-coded active one, was removed (HELM-780).
    entry_points:
      - "core/pkg/guardian.Guardian.SetBudgetTracker"
    config: []
    protected_operations:
      - "Guardian evaluations of actions that carry a budget_id."
    bypass_assumptions:
      - "No budget tracker is configured in a shipped binary."
    tests:
      allowed: []
      forbidden:
        - "core/pkg/guardian.TestGuardian_BudgetConsumeFailureFailsClosed"
        - "core/pkg/guardian.TestGuardian_BudgetEnforcement"
      removal: []
      bypass: []

  - id: CTL-012
    title: "Decision receipts are signed and tampering fails"
    owner: Mindburn Labs core team (crypto)
    claim: >-
      Every governed decision is persisted with a signed receipt, and a receipt
      whose verdict or signature was altered fails `helm-ai-kernel verify
      receipt`.
    status: enforced
    entry_points:
      - "core/cmd/helm-ai-kernel.persistDecisionReceiptForTenantWithProvenance"
      - "core/cmd/helm-ai-kernel.runVerifyReceiptCmd"
    config:
      - "HELM_TRANSPARENCY_DEGRADE (defers the transparency-log anchor; does not skip signing)"
    protected_operations:
      - "Receipts written by the evaluate route, the governed proxy and the MCP gateway."
      - "Offline verification against a trusted public key."
    bypass_assumptions:
      - "Verification needs the caller to supply the trusted key; a self-attested key is refused by default."
      - "MCP gateway receipts are written outside tenant scope."
    tests:
      allowed:
        - "core/cmd/helm-ai-kernel.TestVerifyReceiptCLITrustedCopiedFile"
        - "core/cmd/helm-ai-kernel.TestPersistDecisionReceiptSignsAndStoresReceipt"
      forbidden:
        - "core/cmd/helm-ai-kernel.TestVerifyReceiptCLITamperedVerdict"
        - "core/cmd/helm-ai-kernel.TestVerifyReceiptCLITamperedSignature"
        - "core/cmd/helm-ai-kernel.TestVerifyReceiptCLIWrongTrustedKey"
      removal:
        - "core/cmd/helm-ai-kernel.TestVerifyReceiptCLITamperedVerdict"
        - "core/cmd/helm-ai-kernel.TestVerifyReceiptCLITamperedSignature"
      bypass:
        - "core/pkg/receiptverify.TestSelfAttestedKeyIsRefusedByDefault"
        - "core/cmd/helm-ai-kernel.TestPersistDecisionReceiptBlocksWhenTransparencyAppendFailsFailClosed"

  - id: CTL-013
    title: "API rate limiting"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      The API listener sheds requests over the configured global, class,
      endpoint and actor rates.
    status: enforced
    entry_points:
      - "core/pkg/api.GlobalRateLimiter.Middleware"
      - "core/cmd/helm-ai-kernel.buildAPIHandler"
    config:
      - "HELM_LIMIT_GLOBAL_RPS"
      - "HELM_LIMIT_GLOBAL_BURST"
      - "HELM_LIMIT_ACTOR_RPS"
      - "HELM_LIMIT_ENDPOINT_RPS"
      - "HELM_CONCURRENCY_MAX"
      - "HELM_TRUSTED_PROXY_CIDRS"
    protected_operations:
      - "Every request to the API listener."
    bypass_assumptions:
      - "Raising the limits weakens the control; nothing bounds them."
      - "Forwarded headers count only from peers in HELM_TRUSTED_PROXY_CIDRS."
    tests:
      allowed:
        - "core/pkg/api.TestGlobalRateLimiter_Middleware_AllowsWithinLimit"
      forbidden:
        - "core/pkg/api.TestGlobalRateLimiter_Middleware_RejectsOverLimit"
      removal:
        - "core/pkg/api.TestGlobalRateLimiter_Middleware_RejectsOverLimit"
        - "core/cmd/helm-ai-kernel.TestBuildAPIHandlerLayerOrder"
      bypass:
        - "core/pkg/api.TestRateLimiterIgnoresForwardedHeadersFromUntrustedPeer"

  - id: CTL-014
    title: "Dispatch admission is idempotent"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      A dispatch admission stores its idempotency key hash; an exact retry
      returns the same record and a changed request conflicts.
    status: enforced
    entry_points:
      - "core/pkg/boundary/approvalceremony.DispatchAdmitter.Claim"
    config:
      - "HELM_APPROVAL_CONSUMPTION_ENABLED (off by default; off means the route is absent)"
      - "HELM_APPROVAL_DISPATCH_SCOPE"
    protected_operations:
      - "POST /internal/v1/approval-grants/admit-dispatch on Postgres. The kernel admits; the data plane dispatches."
    bypass_assumptions:
      - "The SQL-level proof is Postgres-gated and runs in .github/workflows/approval-ceremony.yml."
    tests:
      allowed:
        - "core/pkg/boundary/approvalceremony.TestDispatchAdmitterBindsPostLockTimeAndExactRetry"
        - "core/cmd/helm-ai-kernel.TestApprovalDispatchAdmissionRoutesUseSeparateVerifiedCapability"
      forbidden:
        - "core/pkg/boundary/approvalceremony.TestDispatchAdmitterBindsPostLockTimeAndExactRetry"
        - "core/cmd/helm-ai-kernel.TestApprovalDispatchAdmissionRoutesFailClosedBeforeAuthority"
      removal:
        - "core/pkg/boundary/approvalceremony.TestDispatchAdmitterBindsPostLockTimeAndExactRetry"
      bypass:
        - "core/cmd/helm-ai-kernel.TestApprovalDispatchAdmissionFenceDenialIsBounded"

  - id: CTL-015
    title: "Effect reservation before dispatch"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      An admitted dispatch reserves its effect in Postgres before anything is
      sent, so a duplicate never creates a second dispatch (binding rule R6).
    status: observed-only
    reason: >-
      Unreachable from core/cmd/helm-ai-kernel: NewEffectReservationAdmitter and
      EffectReservationAdmitter.Admit are in scripts/ci/deadcode-allowlist.txt,
      as is the generic api.IdempotencyMiddleware. The Postgres tests prove the
      library only.
    entry_points:
      - "core/pkg/boundary/approvalceremony.EffectReservationAdmitter.Admit"
    config: []
    protected_operations:
      - "Reserving an effect for an admitted dispatch."
    bypass_assumptions:
      - "No shipped caller exists."
    tests:
      allowed: []
      forbidden:
        - "core/pkg/boundary/approvalceremony.TestPostgresEffectReservationOrdersFenceRevocationAndLifecycle"
      removal: []
      bypass: []

  - id: CTL-016
    title: "Spend proxy quotes before dispatch"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      In `helm-ai-kernel spend-proxy`, an inference request is dispatched only
      after an allowing quote, and a replayed idempotency key never reaches the
      provider.
    status: enforced
    entry_points:
      - "core/pkg/api.GovernedGateway.handleInference"
      - "core/pkg/inferencegateway.Engine.Quote"
    config:
      - "spend-proxy --addr (default 127.0.0.1; a non-loopback address is not refused)"
    protected_operations:
      - "Inference requests through the spend proxy."
    bypass_assumptions:
      - "The ledger is a JSONL file, not Postgres (R5)."
      - "The spend-proxy listener has no auth; the tenant comes from configuration."
    tests:
      allowed:
        - "core/pkg/spendproxy.TestGovernedRouteEndToEnd"
      forbidden:
        - "core/pkg/spendproxy.TestDeniedRouteNoDispatchAndDurableAudit"
        - "core/pkg/spendproxy.TestReplayedKeyNeverReachesProvider"
        - "core/pkg/spendproxy.TestUnknownEnvelopeFailsClosed"
      removal:
        - "core/pkg/spendproxy.TestDeniedRouteNoDispatchAndDurableAudit"
        - "core/pkg/spendproxy.TestReplayedKeyNeverReachesProvider"
      bypass: []

  - id: CTL-017
    title: "Boundary Enforcement Profile attestation"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      The kernel compiles systemd and nftables enforcement artifacts from
      hash-bound policy input and fails attestation when the live posture
      drifts.
    status: observed-only
    reason: >-
      The kernel attests; systemd and nftables enforce. The shipped binary
      observes posture at service start and on demand, and
      deploy/appliance/helm-boundary-attest.service turns a failed attestation
      into a blocked gateway start.
    entry_points:
      - "core/cmd/helm-ai-kernel.runBoundaryProfileAttest"
    config: []
    protected_operations:
      - "Gateway start on the appliance."
    bypass_assumptions:
      - "Drift between attestations is not detected; the check is not continuous."
    tests:
      allowed:
        - "core/cmd/helm-ai-kernel.TestBoundaryProfileCompileVerifyFlow"
      forbidden:
        - "core/cmd/helm-ai-kernel.TestBoundaryProfileAttestEnforceFailsClosedOffAppliance"
        - "core/cmd/helm-ai-kernel.TestBoundaryProfileAttestTamperedArtifactsHardError"
      removal: []
      bypass: []
