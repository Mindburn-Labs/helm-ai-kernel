  - id: CTL-053
    title: "Gateway approval decisions"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      helm-gateway records at most one decision per ESCALATED attempt, by an
      active human principal of the tenant distinct from the requester
      (ADR-0001 I6), with a helm.gateway.decide token bound by RFC 9396
      authorization_details to that attempt and action and used once: its
      jti is recorded in Postgres in the decision's transaction. The
      approval digest must equal the attempt's, the escalation must not have
      expired, and an approval of a high, irreversible or authority-widening
      effect, judged on the risk re-admission computes, needs a step-up proof:
      a compact helm.gateway.stepup token of the decide token's approver and
      tenant, verified like any gateway token, fresh (an iat, and an exp at
      most 300 seconds after it) and bound by authorization_details
      (helm_step_up) to the attempt, the approval digest and the method
      webauthn, stating user_verified true. Its jti is used once, recorded in
      Postgres in the approval's transaction after the decide token's, and the
      approval record keeps the proof exactly as received with its issuer, jti
      and method. Without a valid, unused proof the approval fails closed
      (STEP_UP_REQUIRED), the attempt stays ESCALATED and neither token is used
      up; a proof for an effect that needs none is ignored. A token past exp
      plus the skew by the database clock is refused, so a purge never makes
      one replayable. Approve re-runs
      admission in the same transaction, re-reading stops, the mandate chain
      and counters, so the attempt becomes ADMITTED or DENIED; a refused
      precondition leaves it ESCALATED. Cancel follows ESCALATED or ADMITTED
      to CANCELLED only, voiding the permit and releasing held exposure in
      the same transaction, for the requester's propose token or an active
      human operator's single-use stop token bound by authorization_details
      (helm_effect_cancel) to that attempt.
    status: enforced
    entry_points:
      - "core/pkg/gateway/admission.Service.Approve"
      - "core/pkg/gateway/admission.Service.Reject"
      - "core/pkg/gateway/admission.Service.Cancel"
      - "core/pkg/gateway/server.Server.Approve"
      - "core/pkg/gateway/server.Server.Cancel"
    config:
      - "The HELM_CP_IDENTITY_* token configuration of CTL-052; decide and stop tokens are minted per decision by the Control Plane and carry iss, jti and exp. A step-up proof is one more such token (one audience, the issuer's keys, the configured actor, the certificate binding when required) and needs no configuration of its own."
    protected_operations:
      - "Approve, Reject and Cancel of helm.gateway.v1.EffectGatewayService on helm-gateway serve."
    bypass_assumptions:
      - "A step-up proof is the issuer's attestation that it verified the approver's WebAuthn assertion over the approval digest, not the gateway's own check: the gateway holds no credential registry, so a compromised Control Plane issuer can mint a proof as it can mint a decide token (the trust limits of CTL-052 apply)."
      - "A medium effect a mandate escalates (approval_required) is approved without step-up, and a proof presented for it is ignored: it cannot refuse the approval, and it is not used up or recorded."
      - "An escalation past its expiry is refused; the River job of CTL-056 moves it to EXPIRED."
      - "A decide token binds the attempt and action; the approver sees and hashes the arguments through GetAttemptContent, which this slice serves but cannot force a client to use."
      - "Releasing an ADMITTED attempt keeps its distinct-value rows, so the value still counts as seen in its bucket."
      - "The trust limits of CTL-052 (ADR-0005 issuer trust, no deployment yet) apply."
    tests:
      allowed:
        - "core/pkg/gateway/admission.TestPostgresApproveByADistinctHumanAdmits"
