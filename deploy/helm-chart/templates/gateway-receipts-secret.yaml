{{- if and .Values.gateway.enabled .Values.gateway.receipts.autoSeed (not .Values.gateway.receipts.existingSecret) }}
{{- include "helm-ai-kernel.gatewayValidate" . }}
{{- $name := include "helm-ai-kernel.gatewayReceiptsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $seed := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "seed") }}
{{- $seed = index $existing.data "seed" }}
{{- else }}
{{- $seed = randBytes 32 | b64enc }}
{{- end }}
# The gateway's receipt signing seed (gateway.receipts.autoSeed;
# helm-tracker#276): 32 random bytes, base64, generated on the first install
# and read back with `lookup` on every upgrade, so the key receipts are signed
# with stays the same. It is kept on uninstall: losing it would end the key a
# chain is verified with. Only the gateway Pod mounts it (R8).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "helm-ai-kernel.gatewayLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  seed: {{ $seed | quote }}
{{- end }}
