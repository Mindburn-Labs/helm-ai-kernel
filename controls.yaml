  - id: CTL-021
    title: "ZeroID and SPIFFE envelopes are refused"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      A request presenting a zeroid_token or spiffe_uri is denied, because the
      kernel cannot verify either; no unverified principal is bound.
    status: enforced
    entry_points:
      - "core/pkg/guardian.ZeroIDInterceptor.Evaluate"
    config: []
    protected_operations:
      - "Every Guardian evaluation; the interceptor is first in the chain."
    bypass_assumptions:
