  - id: CTL-049
    title: "Principal binding integrity"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      A principal is bound in one tenant only. Binding a principal that already
      has a binding in another tenant is refused with 409 TENANT_ISOLATION and
      counted in helm_principal_rebind_refused_total; the check and the insert
      are one transaction, serialized per principal, so concurrent binds into
      different tenants cannot both succeed. Only principals listed in
      HELM_CROSS_TENANT_PRINCIPALS may hold bindings in several tenants.
    status: enforced
    entry_points:
      - "core/cmd/helm-ai-kernel.RegisterPrincipalBindingRoutes"
      - "core/pkg/store.PostgresPrincipalBindingStore.Bind"
      - "core/pkg/store.SQLitePrincipalBindingStore.Bind"
    config:
      - "HELM_CROSS_TENANT_PRINCIPALS"
    protected_operations:
      - "POST /api/v1/admin/principal-bindings, and through it the ADR-0005 §3 binding cross-check on Control Plane token routes."
    bypass_assumptions:
      - "A principal listed in HELM_CROSS_TENANT_PRINCIPALS may be bound in any number of tenants, and the §3 cross-check then admits its token in each of them. Each such bind is logged."
      - "Bindings written before this check (or directly in the database) are not revisited; a re-bind of an existing pair answers 200 whatever other tenants the principal holds."
      - "The route trusts HELM_ADMIN_API_KEY: any holder of that key can bind a fresh principal into any one tenant."
    tests:
      allowed:
        - "core/pkg/store.TestPrincipalBindingStoreSQLite"
        - "core/cmd/helm-ai-kernel.TestPrincipalBindingRoutesUpsertsAndIsIdempotent"
      forbidden:
        - "core/cmd/helm-ai-kernel.TestPrincipalBindingRouteRefusesCrossTenantRebind"
        - "core/pkg/store.TestPrincipalBindingStoreSQLiteRefusesCrossTenantBind"
        - "core/pkg/postgresmigration.TestPostgresPrincipalBindRefusesConcurrentCrossTenantBinds"
      removal:
        - "core/cmd/helm-ai-kernel.TestPrincipalBindingRouteRefusesCrossTenantRebind"
        - "core/pkg/store.TestPrincipalBindingStoreSQLiteRefusesCrossTenantBind"
      bypass:
        - "core/cmd/helm-ai-kernel.TestPrincipalBindingRouteAllowsListedCrossTenantPrincipals"
        - "core/cmd/helm-ai-kernel.TestControlPlaneTokenCrossCheckForACrossTenantPrincipal"

  - id: CTL-050
    title: "Public receipt keyring"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      GET /api/v1/receipt-keyring publishes exactly the key id, profile and
      public keys that the running receipt signer stamps on every receipt, in
      the kernel-evaluate-receipt-keyring.v1 shape the Control Plane pins as
