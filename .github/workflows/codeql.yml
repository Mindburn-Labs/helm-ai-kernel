name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 2"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Fast gate (~5s): decide which CodeQL languages actually changed. The four
  # CodeQL matrix jobs are required status checks, so the
  # workflow must still trigger on every PR/push — when a language did not
  # change, its job reports success without running analysis.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      javascript-typescript: ${{ steps.filter.outputs.javascript-typescript }}
      python: ${{ steps.filter.outputs.python }}
      java-kotlin: ${{ steps.filter.outputs.java-kotlin }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          # schedule / workflow_dispatch / unknown base → full sweep
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            for k in go javascript-typescript python java-kotlin; do
              echo "$k=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          # NUL-delimited paths preserve names containing spaces, newlines, or
          # non-ASCII bytes. Unknown files deliberately trigger a full sweep:
          # Markdown, legal text, and Rust-only inputs can skip CodeQL entirely.
          go=false
          javascript_typescript=false
          python=false
          java_kotlin=false
          full=false
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/workflows/codeql.yml|.github/codeql/*|.github/codeql*.yml|.github/codeql*.yaml)
                full=true
                ;;
              *.md|LICENSE|LICENSE.*|NOTICE|NOTICE.*)
                ;;
              *.go|go.mod|*/go.mod|go.sum|*/go.sum|go.work|*/go.work|go.work.sum|*/go.work.sum|vendor/*|*/vendor/*)
                go=true
                ;;
              *.js|*.jsx|*.ts|*.tsx|*.mjs|*.cjs|*.mts|*.cts|*.vue|*.svelte|*.astro|package.json|*/package.json|package-lock.json|*/package-lock.json|npm-shrinkwrap.json|*/npm-shrinkwrap.json|pnpm-lock.yaml|*/pnpm-lock.yaml|yarn.lock|*/yarn.lock|bun.lock|*/bun.lock|bun.lockb|*/bun.lockb|tsconfig*.json|*/tsconfig*.json|jsconfig.json|*/jsconfig.json)
                javascript_typescript=true
                ;;
              *.py|pyproject.toml|*/pyproject.toml|setup.cfg|*/setup.cfg|requirements*.txt|*/requirements*.txt|requirements*.in|*/requirements*.in|Pipfile|*/Pipfile|Pipfile.lock|*/Pipfile.lock|poetry.lock|*/poetry.lock|uv.lock|*/uv.lock|.python-version|*/.python-version)
                python=true
                ;;
              *.java|*.kt|*.kts|pom.xml|*/pom.xml|build.gradle|*/build.gradle|settings.gradle|*/settings.gradle|gradle.properties|*/gradle.properties|gradle/*|*/gradle/*|gradlew|*/gradlew|gradlew.bat|*/gradlew.bat)
                java_kotlin=true
                ;;
              *.rs|Cargo.toml|*/Cargo.toml|Cargo.lock|*/Cargo.lock|.cargo/*|*/.cargo/*)
                ;;
              *)
                full=true
                ;;
            esac
          done < <(git diff --name-only -z "$BASE"...HEAD)
          if [ "$full" = true ]; then
            go=true
            javascript_typescript=true
            python=true
            java_kotlin=true
          fi
          {
            echo "go=$go"
            echo "javascript-typescript=$javascript_typescript"
            echo "python=$python"
            echo "java-kotlin=$java_kotlin"
          } >> "$GITHUB_OUTPUT"

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
          - language: javascript-typescript
          - language: python
          - language: java-kotlin
    steps:
      - name: Skip when no relevant changes
        if: needs.changes.outputs[matrix.language] != 'true'
        run: echo "no ${{ matrix.language }} changes in this range; analysis skipped"
      - if: needs.changes.outputs[matrix.language] == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - if: matrix.language == 'go' && needs.changes.outputs[matrix.language] == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.25.12"
          cache-dependency-path: "**/go.sum"
          cache: true
      - if: needs.changes.outputs[matrix.language] == 'true'
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
      - if: matrix.language == 'go' && needs.changes.outputs[matrix.language] == 'true'
        name: Build Go modules for CodeQL
        run: |
          go version
          go test \
            ./core/cmd/helm-ai-kernel \
            ./core/pkg/... \
            ./examples/go_client/... \
            ./examples/otel-genai/... \
            ./sdk/go/... \
            ./tests/conformance/... \
            ./tests/launchpad/... \
            -run '^$'
      - if: needs.changes.outputs[matrix.language] == 'true'
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        with:
          category: "/language:${{ matrix.language }}"

  rust-audit:
    name: Rust audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust SDK dependencies
        working-directory: sdk/rust
        run: cargo audit
