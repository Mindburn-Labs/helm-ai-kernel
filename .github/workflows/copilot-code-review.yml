name: Copilot code review runner

# Declares the runner GitHub Copilot code review executes on. Without this file
# Copilot falls back to copilot-setup-steps.yml; with neither, the review starts
# on default behavior and can lose the race for a runner under load. Seen once on
# #689: it timed out and posted a review that had reviewed nothing, while the
# `copilot_code_review` ruleset rule still read as satisfied. Later pushes to the
# same PR reviewed fine without this file, so the failure is intermittent — this
# makes the start deterministic, it does not repair a broken gate.
#
# The job name is fixed: Copilot only picks up a job called `copilot-setup-steps`.
# Copilot checks out the repository itself, so no setup steps are needed here.
#
# Path-scoped triggers keep this out of normal PR runs; it executes only when
# this file changes, so `runs-on` stays verifiable without adding CI noise.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-code-review.yml
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm runner availability
        run: echo "Runner reachable; Copilot code review performs its own checkout."
