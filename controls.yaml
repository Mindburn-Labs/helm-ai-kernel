    tests:
      allowed:
        - "core/pkg/guardian.TestZeroIDContinuousEvaluation"
      forbidden:
        - "core/pkg/guardian.TestZeroIDContinuousEvaluation"
      removal:
        - "core/pkg/guardian.TestZeroIDContinuousEvaluation"
      bypass: []

  - id: CTL-022
    title: "The request body carries no security authority"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      Reserved security context keys supplied by a caller are stripped before
      the Guardian sees them; trusted values come only from the authenticated
      transport.
    status: enforced
    entry_points:
      - "core/cmd/helm-ai-kernel.bindAuthenticatedGuardianContext"
      - "core/pkg/guardian.IsReservedSecurityContextKey"
    config: []
    protected_operations:
      - "Evaluate, proxy and MCP requests bound through bindAuthenticatedGuardianContext."
    bypass_assumptions:
      - "Tenant and principal headers are still caller assertions checked against configuration (CTL-007)."
    tests:
      allowed:
        - "core/cmd/helm-ai-kernel.TestEvaluateRouteBindsReceiptToAuthenticatedPrincipal"
      forbidden:
        - "core/cmd/helm-ai-kernel.TestEvaluateRouteStripsCallerSuppliedEgressSecurityContext"
        - "core/cmd/helm-ai-kernel.TestEvaluateRouteRejectsConflictingAliasesBeforeReceiptIssuance"
        - "core/cmd/helm-ai-kernel.TestConfiguredTenantRuntimeAuthRejectsCallerIdentityOverride"
      removal:
        - "core/cmd/helm-ai-kernel.TestEvaluateRouteStripsCallerSuppliedEgressSecurityContext"
      bypass:
        - "core/pkg/guardian.TestPDPInterceptorIgnoresUntrustedSecurityContextOverrides"

  - id: CTL-023
    title: "Untenanted stores serve only the configured tenant"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      A route backed by a store with no tenant dimension answers only the
      kernel's configured tenant; every other tenant gets 403.
    status: enforced
    entry_points:
      - "core/cmd/helm-ai-kernel.protectConfiguredTenantStore"
    config:
      - "HELM_RUNTIME_TENANT_ID"
    protected_operations:
      - "Boundary, MCP and contract routes whose stores are not partitioned by tenant."
    bypass_assumptions:
