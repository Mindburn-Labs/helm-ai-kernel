name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 2"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Fast gate (~5s): only a docs/legal/Rust-only diff can skip all four required
  # CodeQL analyses. Every other path triggers the complete matrix.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      codeql: ${{ steps.filter.outputs.codeql }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          # schedule / workflow_dispatch / unknown base → full sweep
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "codeql=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # NUL-delimited paths preserve names containing spaces, newlines, or
          # non-ASCII bytes. Renames are represented as delete+add so a source
          # file cannot disappear behind a documentation or Rust destination.
          codeql=false
          while IFS= read -r -d '' file; do
            case "$file" in
              *.rs|Cargo.toml|*/Cargo.toml|Cargo.lock|*/Cargo.lock|.cargo/*|*/.cargo/*)
                ;;
              *.md|LICENSE|LICENSE.*|NOTICE|NOTICE.*)
                ;;
              *)
                codeql=true
                break
                ;;
            esac
          done < <(git diff --no-renames --name-only -z "$BASE"...HEAD)
          echo "codeql=$codeql" >> "$GITHUB_OUTPUT"

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
          - language: javascript-typescript
          - language: python
          - language: java-kotlin
    steps:
      - name: Skip docs/legal/Rust-only changes
        if: needs.changes.outputs.codeql != 'true'
        run: echo "only documentation, legal text, or Rust inputs changed; CodeQL skipped"
      - if: needs.changes.outputs.codeql == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - if: matrix.language == 'go' && needs.changes.outputs.codeql == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.25.12"
          cache-dependency-path: "**/go.sum"
          cache: false
      - if: needs.changes.outputs.codeql == 'true'
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
      - if: matrix.language == 'go' && needs.changes.outputs.codeql == 'true'
        name: Build Go modules for CodeQL
        run: |
          go version
          go test \
            ./core/cmd/helm-ai-kernel \
            ./core/pkg/... \
            ./examples/go_client/... \
            ./examples/otel-genai/... \
            ./sdk/go/... \
            ./tests/conformance/... \
            ./tests/launchpad/... \
            -run '^$'
      - if: needs.changes.outputs.codeql == 'true'
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        with:
          category: "/language:${{ matrix.language }}"

  rust-audit:
    name: Rust audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust SDK dependencies
        working-directory: sdk/rust
        run: cargo audit
