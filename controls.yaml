  - id: CTL-016
    title: "Spend proxy quotes before dispatch"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      In `helm-ai-kernel spend-proxy`, an inference request is dispatched only
      after an allowing quote, and a replayed idempotency key never reaches the
      provider; with caller credentials a key is its caller's, and a request
      that names none gets a minted one. A request is read against the model
      gateway's closed list for its route (core/pkg/gateway/modelbound),
      cache_control included, and refused with 400 when its bill could escape
      the quote, and the hold counts one input token per byte of the forwarded
      request plus the image and tool floors and the output ceiling, at the
      configured price with the platform fee on it. The hold is reserved
      against the spend envelope's max_amount_cents for its period and the
      balance in one step, so concurrent requests cannot both take the last
      cents; settlement moves the reservation to used, a provider bill within
      its part of the hold is debited no more than the hold, and the
      budget-verdict receipt (OK_WITHIN_ENVELOPE) exists only when that
      reservation succeeded. A provider bill above its part of the hold is
      debited as billed, its usage receipt says ESCALATE /
      ERR_SPEND_PER_REQUEST_LIMIT and names the windows it closed, and the
      envelope takes no further dispatch in the period of the reservation or
      the period the settlement falls in, also when the settlement fails and
      after a restart; a released reservation cannot be settled, and an
      unreserved settlement is decided against its envelope. A dispatch that
      may have reached the provider is debited at its hold and its key is
      spent; only an error before the upstream connection opened releases it.
      A dispatch journalled before its provider call without a committed
      settlement is held again on start until `spend-proxy reconcile`, which
      takes the receipts directory's lock and signs with the proxy's own key
      (without a seed, the one generated in the receipts directory), settles
      or releases it in a signed line; a dispatch the log records billed is
      never released, nor settled below the recorded actual without an
      override reason. A start refuses usage, settlement and release lines it
      cannot verify. An answer is priced by the model it names. The principal
      in a spend receipt is the envelope's, and with caller credentials
      configured each request's agent, envelope and workspace are its
      credential's, and /v1/models and /helm/spend/health need it; without
      them the proxy serves one principal. A receipt-log line carries exactly
      the payload its kind names, and `spend-proxy export` reports a signature
      verified only when it checked it against a --public-key from outside the
      receipts directory (helm-tracker#313).
    status: enforced
    entry_points:
      - "core/pkg/api.GovernedGateway.handleInference"
      - "core/pkg/gateway/modelbound.CheckBody"
      - "core/pkg/inferencegateway.Engine.Quote"
      - "core/pkg/inferencegateway.Engine.ReserveForDispatch"
      - "core/pkg/inferencegateway.Engine.SettleUsage"
      - "core/pkg/inferencegateway.Engine.SettleAtHold"
      - "core/pkg/inferencegateway.Engine.RestorePendingDispatch"
      - "core/pkg/inferencegateway.Engine.DebitFor"
      - "core/pkg/spendproxy.NewServer"
      - "core/pkg/spendproxy.Server.bindCaller"
      - "core/pkg/spendproxy.Upstream.Dispatch"
      - "core/pkg/spendproxy.LoadRecords"
      - "core/pkg/spendproxy.RestorePendingDispatches"
      - "core/pkg/spendproxy.Reconcile"
      - "core/pkg/spendproxy.ExportEvidencePacks"
    config:
      - "spend-proxy --addr (default 127.0.0.1; a non-loopback address is refused, see CTL-026)"
      - "The spend-proxy config's envelopes (max_amount_cents per UTC day, per_request_max_cents, principal_id; one principal across them unless callers are configured) and request_defaults.principal_id, which must be the default envelope's."
      - "The spend-proxy config's callers: id, token_sha256 (the SHA-256 of the bearer token, never the token), agent_id, envelopes, workspaces."
      - "spend-proxy export --public-key: the issuer's Ed25519 public key, printed at start and served as signing_public_key by /helm/spend/health."
      - "spend-proxy reconcile --intent with --settle-cents or --release, --reason, --override-reason (a settlement below the recorded actual), and --sign (the proxy's own seed)."
      - "spend-proxy --sign or HELM_SPEND_PROXY_SIGNING_SEED; without either, <receipts-dir>/signing-seed, generated on the first start (mode 0600). <receipts-dir>/spend-proxy.lock is held while a proxy or a reconcile runs."
      - "The spend-proxy config's platform_fee_bps, which the hold carries."
    protected_operations:
      - "Inference requests through the spend proxy."
      - "Reserving, settling and releasing a dispatch against its envelope and the balance."
      - "Restarting the spend proxy on an existing receipt log, and reconciling a pending dispatch."
      - "Exporting spend EvidencePacks with signature verification."
    bypass_assumptions:
      - "The ledger is a JSONL file, not Postgres (R5); envelope spend, closed envelopes and pending holds are rebuilt from it on start. A receipt-log writer can delete lines; the log is not a hash chain. A start verifies the lines that debit or free a hold against the proxy's key and the keys trusted_keys.json registered, so a writer of the receipts directory who also registers a key there, or who can read the generated signing-seed, can still forge them."
      - "The receipts directory lock is an OS file lock (flock, LockFileEx); on a platform without one it is not taken, and one proxy per directory, reconciled only while stopped, is the operator's rule."
      - "The listener binds loopback only; any process on the host can reach it. Caller credentials are bearer tokens on plain HTTP, stored as their unsalted SHA-256: a token is at least 32 bytes and assumed random. Without them headers pick among the envelopes of the one configured principal. The tenant comes from configuration."
      - "A denied route is refused for many independent reasons (model, price, terms, balance), so no single mutation removes the quote gate; the removal proof covers replay-before-dispatch."
      - "The hold bounds the bill under the model gateway's assumptions (docs/architecture/model-gateway.md): one token per byte, the image and tool floors, an honoured output maximum (an upstream's reasoning_effort budget within it), encrypted reasoning and thinking signatures costing no more than their bytes, the configured price at the upstream's tier when no service_tier is named, and no cache write, which the proxy refuses. A bill above the hold anyway passes the envelope's limit by at most the overages of the dispatches in flight when it settles; the envelope then closes for the reservation's and the settlement's period."
      - "Reconcile appends lines to the log of a stopped proxy: it takes the receipts directory's lock, which a running proxy holds. The recorded actual it guards is what the log's settle_failed, usage and settlement lines say; an override reason lets an operator settle below it."
      - "Without --public-key export checks no signature."
