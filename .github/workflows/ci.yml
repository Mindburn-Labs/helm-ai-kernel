# CI v2. `ci / gate` is the one required status check: it runs `make check`
# (the merge profile of scripts/ci/quality-gates.json) and the diff-aware
# dependency scan from Mindburn-Labs/platform-actions. Keep the job id `ci`.
#
# `make check` runs as four parallel jobs. Each gets CHECK_SHARD=<i>/4 and runs
# its part of the profile; the gate needs all four, and
# scripts/ci/quality_shard_test.py proves the parts cover every gate once.
#
# A push to main is the sha the merge queue just gated. That run is one job:
# scripts/ci/ci_setup.sh finds the successful merge_group run of the same sha
# and `make check` reports it instead of running the profile a second time. The
# push run still exists because dev-image.yml and receipt-verifier-wasm.yml
# start from a green CI run on main.
#
# The reusable workflow is pinned by commit, not by its mutable tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: Mindburn-Labs/platform-actions/.github/workflows/ci.yml@3cac00c9218bb0c37d367dbbb47bb584a0d7d3e4 # v2.2.1
    with:
      check-shards: ${{ github.event_name == 'push' && 1 || 4 }}
      check-timeout-minutes: 90
      setup-commands: bash scripts/ci/ci_setup.sh
