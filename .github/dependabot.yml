# From Mindburn-Labs/platform-actions templates/dependabot.yml (v2), plus
# maven for sdk/java.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: gomod
    directories: ['**/*']
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: npm
    directories: ['**/*']
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: pip
    directories: ['**/*']
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: cargo
    directories: ['**/*']
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: docker
    directories: ['**/*']
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: maven
    directory: /sdk/java
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]
