name: Launchpad Model Provider Catalog

# Scheduled runs intentionally produce evidence only. They never create a
# branch, commit, or pull request; a human can download the candidate patch
# from a manually dispatched run and review it in a normal owned change.
on:
  workflow_dispatch:
  schedule:
    - cron: "42 4 * * *"
  pull_request:
    branches: [ main ]
    paths:
      - 'core/pkg/launchpad/modelproviders/**'
      - 'scripts/launch/update_model_provider_catalog.py'
      - 'tools/launchpad/artifacts/model-gateway-check.sh'
      - '.github/workflows/launchpad-model-provider-catalog.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Validate provider sources
        run: python3 scripts/launch/update_model_provider_catalog.py --network
      - name: Validate and normalize catalog
        run: python3 scripts/launch/update_model_provider_catalog.py --write
      - name: Assert transparent egress readiness helper behavior
        run: |
          set -euo pipefail
          tempbin="$(mktemp -d)"
          trap 'rm -rf "$tempbin"' EXIT
          cat > "$tempbin/curl" <<'SH'
          #!/bin/sh
          printf '401'
          SH
          chmod +x "$tempbin/curl"

          set +e
          output="$(
            env -i \
              PATH="$tempbin:/usr/bin:/bin" \
              HELM_MODEL_GATEWAY_PROVIDER=openrouter \
              OPENROUTER_API_KEY=sk-fake \
              tools/launchpad/artifacts/model-gateway-check.sh 2>&1
          )"
          rc=$?
          set -e

          printf '%s\n' "$output"
          if [ "$rc" = "43" ]; then
            echo "::error::readiness helper still hard-requires HTTP(S)_PROXY env"
            exit 1
          fi
          if [ "$rc" != "44" ]; then
            echo "::error::expected helper to exit 44 after rejected probe, got ${rc}"
            exit 1
          fi
          grep -q 'HTTP 401' <<< "$output"
      - name: Summarize catalog coverage
        run: python3 scripts/launch/update_model_provider_catalog.py --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Ensure generated catalog artifacts are committed
        run: git diff --exit-code -- core/pkg/launchpad/modelproviders/catalog.json core/pkg/launchpad/modelproviders/source_fingerprints.json scripts/launch/update_model_provider_catalog.py tools/launchpad/artifacts/model-gateway-check.sh

  capture-refresh-candidate:
    name: Capture catalog refresh candidate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Generate reviewable catalog refresh candidate
        run: |
          set -euo pipefail
          python3 scripts/launch/update_model_provider_catalog.py --network --write
          changed_paths=(
            core/pkg/launchpad/modelproviders/catalog.json
            core/pkg/launchpad/modelproviders/source_fingerprints.json
            scripts/launch/update_model_provider_catalog.py
            tools/launchpad/artifacts/model-gateway-check.sh
          )
          git diff --check -- "${changed_paths[@]}"
          git diff --binary -- "${changed_paths[@]}" > model-provider-catalog-refresh.patch
          git diff --name-only -- "${changed_paths[@]}" > model-provider-catalog-refresh.changed-paths.txt
      - name: Summarize catalog coverage
        run: python3 scripts/launch/update_model_provider_catalog.py --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Record candidate disposition
        run: |
          set -euo pipefail
          if [ -s model-provider-catalog-refresh.patch ]; then
            echo "A reviewable catalog candidate was attached; a human must apply it in an owned branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Catalog source fingerprints are already current." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload catalog refresh candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-provider-catalog-refresh-candidate
          path: |
            model-provider-catalog-refresh.patch
            model-provider-catalog-refresh.changed-paths.txt
