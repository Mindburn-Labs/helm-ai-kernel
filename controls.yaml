  - id: INV-008
    title: "An EffectPermit authorizes one connector, one action, one scope"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      An EffectPermit authorizes one connector, one action and one scope, and is
      consumed once.
    status: observed-only
    reason: >-
      The verifier is a library that no shipped binary calls:
      PermitLedger.ConsumePermit and EvaluateAndConsumeGatewayResponse are in
      scripts/ci/deadcode-allowlist.txt. The gateway that would run it is not in
      this repository, so the tests prove the library, not a production path.
    entry_points:
      - "core/pkg/boundary/extauthz.PermitLedger.ConsumePermit"
      - "core/pkg/boundary/extauthz.EvaluateAndConsumeGatewayResponse"
    config: []
    protected_operations:
      - "Binding a permit to its verdict and effect, and consuming it."
    bypass_assumptions:
      - "A gateway that does not consume permits through the ledger can replay them."
    tests:
      allowed: []
      forbidden:
        - "core/pkg/boundary/extauthz.TestPermitLedgerRejectsDirectBindingMismatchAndReplayKeys"
        - "core/pkg/boundary/extauthz.TestEvaluateAndConsumeRequiresDurablePermitConsumer"
      removal: []
      bypass: []
    section: authorization
    body: |
      A permit is bound to the verdict that issued it and to the exact effect it
      describes. It cannot be replayed against a different connector, widened to a
      different action, or reused after consumption. Authorization that travels is
      not authorization.
    verify:
      - "`core/pkg/effects/types.go` · tests `TestPermitLedgerRejectsDirectBindingMismatchAndReplayKeys`, `TestEvaluateAndConsumeRequiresDurablePermitConsumer`"

  - id: INV-009
    title: "DENY and ESCALATE carry no permit material"
