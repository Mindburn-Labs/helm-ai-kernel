// HELM Policy Schema — CPI Verdict
//
// Returned by helm-policy-vm for every PlanIRDelta evaluation.
// Contains structured payloads for ALLOW, DENY, and REQUIRE_APPROVAL.
//
// Stability: v1 additive-only.
syntax = "proto3";
package helm.policy.v1;

option go_package = "helm.mindburn.run/policy/v1;policyv1";

import "google/protobuf/timestamp.proto";
import "foundations.proto";

// ── CPI Verdict ────────────────────────────────────────────────

message CpiVerdict {
  // VM version + semantics hash.
  bytes cpi_hash = 1;
  // PolicyBundle that produced this verdict.
  bytes policy_bundle_hash = 2;
  // Hash of the evaluated PlanIRDelta.
  bytes plan_ir_hash = 3;
  // Proposal identifier for correlation.
  string proposal_id = 4;
  // Verdict discriminant.
  VerdictKind kind = 5;

  // Exactly one populated based on kind.
  AllowPayload allow = 10;
  DenyPayload deny = 11;
  RequireApprovalPayload require_approval = 12;

  google.protobuf.Timestamp evaluated_at = 15;

  reserved 100 to 199;
  reserved 900 to 999;
}

enum VerdictKind {
  VERDICT_KIND_UNSPECIFIED = 0;
  VERDICT_KIND_ALLOW = 1;
  VERDICT_KIND_DENY = 2;
  VERDICT_KIND_REQUIRE_APPROVAL = 3;
}

// ── Payloads ───────────────────────────────────────────────────

message AllowPayload {
  // Obligations that were satisfied for this action.
  repeated string obligations_satisfied = 1;
  // Predicted effect summary.
  EffectDigest predicted_effects = 2;
  // Receipt commitment for the decision.
  ReceiptCommitment receipt_commitment = 3;

  reserved 100 to 199;
}

message DenyPayload {
  // Structured reason codes (LAYER.DOMAIN.CATEGORY.CAUSE.SPEC).
  repeated ReasonCodeRef reason_codes = 1;
  // Deterministic witness trace.
  string witness_id = 2;
  // What kind of "no" this was. UNSPECIFIED when the policy profile has not
  // opted in, or when no rule classified the denial.
  DenialFinality finality = 3;
  // Nearest allowed envelope. Absent unless the profile opts in AND the
  // denial's disclosure class permits one — see DenialCounterfactual.
  DenialCounterfactual counterfactual = 4;

  reserved 100 to 199;
}

message RequireApprovalPayload {
  repeated ReasonCodeRef reason_codes = 1;
  string witness_id = 2;
  // Required signers to unblock.
  repeated SignerSpec required_signatures = 3;
  // Optional fact requests.
  repeated FactRequest fact_requests = 4;
  // Escalations carry a finality too, and it is not always UNGRANTED: an
  // escalation raised because the context was tainted is INSTANCE_CONTEXT.
  // A consumer reads the verdict kind to know what to do, and the finality
  // to know what to learn.
  DenialFinality finality = 5;

  reserved 100 to 199;
}

// ── Denial Legibility ──────────────────────────────────────────

// DenialFinality says what kind of refusal this was, so an agent can draw the
// right lesson from it rather than retrying at random.
//
// It is derived from the rule that fired, never assigned by a caller. A
// hand-set value drifts from the rule it claims to describe, and a denial that
// teaches has to teach the same lesson every time it is replayed.
enum DenialFinality {
  // Not classified, or the policy profile has not opted in. A consumer must
  // treat this as "no information" and change nothing it has learned.
  DENIAL_FINALITY_UNSPECIFIED = 0;
  // The action itself is forbidden. Erase any stored bounds for it and stop
  // probing.
  DENIAL_FINALITY_CLASS_FORBIDDEN = 1;
  // Nothing granted this action. There is no bound to learn and nothing to
  // retry; it needs an authority to say yes. Carried on REQUIRE_APPROVAL
  // where a signer exists to address, and on DENY where none does.
  DENIAL_FINALITY_UNGRANTED = 2;
  // A bound was exceeded. Record the bound and retry within it.
  DENIAL_FINALITY_INSTANCE_PARAMETER = 3;
  // The surrounding context was refused — taint, for example. The refusal was
  // not about the action, so a consumer should touch none of its stored
  // bounds.
  DENIAL_FINALITY_INSTANCE_CONTEXT = 4;
}

// DenialCounterfactual is the nearest allowed envelope for a refusal: enough
// for an agent to retry correctly, and deliberately no more.
//
// Emitted for scalar bounds and required-capability names only. Refusals that
// turn on set membership never carry one. An egress allowlist or a set of
// workspace roots is a map of internal infrastructure, and answering "not that
// one, try these" would turn every refusal into a free probe of the estate.
//
// The counterfactual is computed from the same policy snapshot that produced
// the verdict — the bundle already committed in CpiVerdict.policy_bundle_hash.
// A counterfactual derived from any other snapshot would describe a boundary
// that never denied anything.
message DenialCounterfactual {
  // Policy field that bound the request, e.g. "ttl_days".
  string field = 1;
  // Scalar bound. Minor units for money, never float, per EffectDigest.
  int64 requested = 2;
  int64 max = 3;
  // Capability the action would have needed, from the fixed permission
  // vocabulary. Never an instance identifier.
  string capability = 4;

  reserved 100 to 199;
}

// ── Supporting Types ───────────────────────────────────────────

message EffectDigest {
  // Effect class types, e.g. ["E3", "E4"].
  repeated string effect_types = 1;
  // Estimated cost in minor currency units (int64, never float).
  int64 estimated_cost_cents = 2;
  string currency = 3;

  reserved 100 to 199;
}

message ReceiptCommitment {
  string receipt_id = 1;
  bytes commitment_hash = 2;
  google.protobuf.Timestamp valid_until = 3;

  reserved 100 to 199;
}

message SignerSpec {
  string principal_id = 1;
  // Required role for signing.
  string role_id = 2;
  // If true, any principal with this role suffices.
  bool any_of_group = 3;

  reserved 100 to 199;
}

// Lightweight reason code reference within a verdict.
// Full Reason payload is in explain.proto.
message ReasonCodeRef {
  // Canonical code string, e.g. "CPI.LICENSE.MISSING_PRIMITIVE.MICA".
  string code = 1;
  // Severity level.
  string severity = 2;

  reserved 100 to 199;
}

// ── Facts ──────────────────────────────────────────────────────

message FactRequest {
  string fact_id = 1;
  // Fact type, e.g. "license_validity", "kyc_status".
  string fact_type = 2;
  string target_node_id = 3;
  string description = 4;
  google.protobuf.Timestamp deadline = 5;

  reserved 100 to 199;
}

message FactResponse {
  string fact_id = 1;
  // Canonical JSON value.
  bytes value_canonical = 2;
  string provider_principal_id = 3;
  bytes signature = 4;
  google.protobuf.Timestamp provided_at = 5;

  reserved 100 to 199;
}
