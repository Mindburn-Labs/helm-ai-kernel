  - id: INV-021
    title: "The provider credential scrub is cross-provider"
    owner: Mindburn Labs core team (kernel)
    claim: The provider credential scrub is cross-provider.
    status: unmanaged
    reason: >-
      Retired 2026-09-24 (HELM-756): the implementation was deleted without ever
      having a production caller. Its rule survives as INV-011.
    retired: true
    entry_points: []
