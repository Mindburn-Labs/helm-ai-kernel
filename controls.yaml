  - id: CTL-046
    title: "Mandates only narrow on delegation"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      When helm-gateway's authority adapter applies a
      helm.authority.provision.v1 or narrow.v1 plan, the authority store's
      transaction (authorityrows.Tx) delegates a mandate only within every
      mandate above it as they stand at that moment, in each term the rule
      compares (effect types, per-call limit, approval threshold, validity
      window, targets, risk classes, approval requirements); only the
      parent's holder delegates, over a chain with no revoked link, and no
      stop on the tenant, the delegator or a mandate of the chain may be
      active. A mandate narrows in place only to terms within its own and
      never replaces a condition it has. A new limit on a delegated mandate is
      no higher than the lowest limit of its unit, measure, window and span on
      any mandate above it, and a limit is lowered, never raised. A narrowing
      bumps, in the same transaction, the version of the row it changes (a
      revoked or narrowed mandate, a lowered limit) or, when it adds a limit,
      of the limit's scope (the mandate, or the tenant). A root mandate needs
      an active human approver who is neither the requester nor its holder
      (HELM-750, ADR-0001). Admission re-checks every link of the chain it
      resolves against the link above it. The store's own Stop and Lift are
      not part of this claim.
    status: enforced
    entry_points:
      - "core/pkg/kernel/authority/mandates.Terms.Within"
      - "core/pkg/kernel/authority/authorityrows.Tx.CreateMandate"
      - "core/pkg/kernel/authority/authorityrows.Tx.Delegate"
      - "core/pkg/kernel/authority/authorityrows.Tx.Narrow"
      - "core/pkg/kernel/authority/authorityrows.Tx.Revoke"
      - "core/pkg/kernel/authority/authorityrows.Tx.CreateLimit"
      - "core/pkg/kernel/authority/authorityrows.Tx.SetLimit"
      - "core/pkg/kernel/authority/authorityrows.Tx.LowerLimit"
      - "core/pkg/gateway/adapters/provision.Check"
      - "core/pkg/gateway/admission.Decide"
    config: []
    protected_operations:
      - "Delegating a mandate, narrowing it in place, revoking it, and adding or lowering a limit on it, in the authority rows."
      - "Activating a root mandate."
      - "Applying a helm.authority.provision.v1 or narrow.v1 plan through helm-gateway's authority adapter, and the admission of an effect under the chain those rows form."
    bypass_assumptions:
      - "The schema holds no narrowing constraint. A role with INSERT or UPDATE on authority_mandates or authority_limits can write a row wider than the one above it without the store. Admission re-checks every link of the chain it resolves and denies a wider mandate (DELEGATION_SCOPE_VIOLATION, bypass test below). A limit written that way is not compared with the one above it again; admission counts every limit of every mandate of the chain and the tenant's, so the lower limit above it still binds."
      - "Only a plan applied by the authority adapter, and EnsurePrincipals, write the rows in a shipped binary; admission enforces what they say (CTL-052), not how they were written. The Store methods that wrap the same Tx calls in their own transaction (Store.CreateMandate, Delegate, Narrow, Revoke, CreateLimit, LowerLimit) have no shipped caller; the Postgres-gated tests drive the Tx code through them, and the plan path is what is enforced."
      - "A plan's root mandate takes its requester and approver from the gateway's approval record of the plan attempt (CTL-053). The store checks that the approver is an active human distinct from the requester and the holder, and takes the pair as given: the WideningApproval argument stays a bare pair of principal ids for any other caller of the library."
      - "Narrowing a mandate in place leaves the mandates delegated from it as they are. Admission holds them to the narrowed terms; a new delegation from them is refused by the store."
      - "Conditions are not compared when delegating: admission requires every link's condition to hold, so a child's condition only narrows. A narrowing in place keeps or adds a condition and never replaces one."
      - "Store.Stop and Store.Lift have no shipped caller, and are not claimed: the gateway's own stops and lifts are admission.Service.Stop and Lift (CTL-055). Delegate reads the same table (authority_stops) and the same scope_kind:scope_key key that the gateway's stop writer, admission.Service.Stop, writes. The tests that show an active stop refusing a delegation write that stop with Store.Stop, not with the gateway's writer."
      - "Tx.CreateLimit reads the chain without locking its mandate rows and FOR SHARE-locks only the ancestor limit rows that already exist. A concurrent CreateLimit or SetLimit that adds a limit to an ancestor can commit alongside it, so a mandate's new limit can stand above an ancestor limit of the same unit, measure, window and span. This stays authority-neutral only because admission counts every limit of every mandate of the chain, so the lower limit binds; no test drives that race."
      - "That a plan applied by helm-gateway's authority adapter goes through authorityrows.Tx (core/pkg/gateway/adapters/provision/apply.go) is established by code reachability, not by a removal proof."
      - "The removal proofs run on a scripted driver, without a database. They show that each check is in the code path and that the statement bumping a control row's version is issued by the transaction. What Postgres then does with it (the row lock, the bump itself, waiting for a concurrent narrowing, constraints, tenant isolation) is proved by the Postgres-gated tests, which are listed in scripts/ci/postgres-proofs.txt and carry no removal proof."
    tests:
      allowed:
        - "core/pkg/kernel/authority/authorityrows.TestDelegateStoresTermsWithinEveryLinkOfTheChain"
        - "core/pkg/kernel/authority/authorityrows.TestNarrowStoresTermsWithinTheCurrentOnesAndBumpsTheVersion"
        - "core/pkg/kernel/authority/authorityrows.TestCreateLimitStaysUnderTheLowestLimitAboveAndBumpsItsControlRow"
        - "core/pkg/kernel/authority/authorityrows.TestPostgresDelegationOnlyNarrowsOverRandomChains"
        - "core/pkg/kernel/authority/authorityrows.TestPostgresDelegationHoldsEveryTermToTheCeiling"
        - "core/pkg/gateway/admission.TestPostgresNarrowPlanIsAdmittedDispatchedAndObserved"
      forbidden:
        - "core/pkg/kernel/authority/mandates.TestWithinNamesEachWideningDimension"
        - "core/pkg/kernel/authority/authorityrows.TestDelegateRefusesTermsWiderThanTheParentInAnyOneTerm"
        - "core/pkg/kernel/authority/authorityrows.TestDelegateRefusesARevokedLinkAWrongDelegatorAndAnActiveStop"
