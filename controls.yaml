    tests:
      allowed:
        - "core/cmd/helm-ai-kernel.TestLocalConsoleCallersKeepBoundaryStatus"
      forbidden:
        - "core/cmd/helm-ai-kernel.TestTenantRoutesNeverShowAnotherTenantsData"
      removal:
        - "core/cmd/helm-ai-kernel.TestTenantRoutesNeverShowAnotherTenantsData"
      bypass:
        - "core/cmd/helm-ai-kernel.TestEveryTenantRouteDeclaresItsDataScope"
        - "core/cmd/helm-ai-kernel.TestTenantIsolationProbeDetectsASharedStore"
        - "core/cmd/helm-ai-kernel.TestLaunchpadRoutesAreOffByDefault"

  - id: CTL-024
    title: "Policy reconciliation fails closed"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      A policy update with an invalid or tampered signature never installs, a
      required signature cannot be omitted, and an expired last-known-good
      snapshot denies.
    status: enforced
    entry_points:
      - "core/pkg/policy/reconcile.Reconciler.Reconcile"
    config:
      - "HELM_POLICY_SIGNATURE_REQUIRED (off by default)"
      - "HELM_POLICY_ON_INVALID_UPDATE"
      - "HELM_POLICY_LAST_KNOWN_GOOD_MAX_AGE"
    protected_operations:
      - "Installing a policy snapshot from the configured source."
    bypass_assumptions:
      - "With HELM_POLICY_SIGNATURE_REQUIRED unset, an unsigned policy installs."
    tests:
      allowed:
        - "core/pkg/policy/reconcile.TestReconcilerInstallsValidEd25519Signature"
      forbidden:
        - "core/pkg/policy/reconcile.TestReconcilerRejectsInvalidSignature"
        - "core/pkg/policy/reconcile.TestReconcilerRejectsMissingRequiredSignature"
        - "core/pkg/policy/reconcile.TestReconcilerRejectsTamperedEd25519Signature"
        - "core/pkg/policy/reconcile.TestReconcilerSourceFaultExpiresLastKnownGoodFailClosed"
      removal:
        - "core/pkg/policy/reconcile.TestReconcilerRejectsTamperedEd25519Signature"
        - "core/pkg/policy/reconcile.TestReconcilerRejectsMissingRequiredSignature"
      bypass:
        - "core/pkg/guardian.TestGuardianInvalidatedSnapshotBeforeIntentDenies"

  - id: CTL-025
    title: "MCP authorize-call quarantine firewall"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      `mcp authorize-call` and POST /api/v1/mcp/authorize-call deny or escalate
      a call from a quarantined server, an unapproved tool, an unknown tool or a
      caller without the tool's scopes.
    status: enforced
    entry_points:
      - "core/pkg/mcp.ExecutionFirewall.AuthorizeToolCall"
    config: []
    protected_operations:
      - "Authorization of an MCP tool call through the execution firewall."
    bypass_assumptions:
      - "QuarantineRegistry.Approve always errors and is unreachable, so a shipped binary never returns ALLOW here; the allowed-case test approves through the library."
      - "List-time tool visibility (ExecutionFirewall.FilterVisibleTools) is unreachable from the shipped binary."
    tests:
      allowed:
        - "core/pkg/mcp.TestExecutionFirewallAllowsApprovedScopedCall"
      forbidden:
        - "core/pkg/mcp.TestExecutionFirewallDeniesScopeMismatch"
        - "core/pkg/mcp.TestExecutionFirewallFiltersToolsByQuarantineAndScope"
      removal:
        - "core/pkg/mcp.TestExecutionFirewallDeniesScopeMismatch"
      bypass:
        - "core/cmd/helm-ai-kernel.TestMCPApproveFailsClosed"

  - id: CTL-026
    title: "Non-loopback listeners require auth"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      The proxy, MCP and spend-proxy listeners refuse to start on a non-loopback
      address without authentication, and the proxy requires its token as a
      bearer. The spend-proxy never binds beyond loopback, with or without its
      caller credentials (CTL-016), which are bearer tokens on plain HTTP, and
      its refusal says that, not that no authentication is configured: it
      spends the upstream provider key.
    status: enforced
    entry_points:
      - "core/cmd/helm-ai-kernel.requireListenerAuth"
      - "core/cmd/helm-ai-kernel.requireLoopbackListener"
      - "core/cmd/helm-ai-kernel.wrapProxyAuth"
    config:
      - "helm-ai-kernel proxy and mcp serve bind flags and tokens"
      - "helm-ai-kernel spend-proxy --addr"
    protected_operations:
      - "Starting the proxy, MCP or spend-proxy listener on a non-loopback address."
      - "Calling the proxy when its token is configured."
    bypass_assumptions:
      - "A loopback bind needs no authentication; anything on the host can reach it."
      - "Removal of the bind check is proven through the spend-proxy refusal, which fails without serving. The proxy and MCP refusal tests would start a listener and block instead of failing, so they are forbidden tests only."
    tests:
      allowed:
        - "core/cmd/helm-ai-kernel.TestWrapProxyAuth"
      forbidden:
        - "core/cmd/helm-ai-kernel.TestProxyRefusesNonLoopbackBindWithoutToken"
        - "core/cmd/helm-ai-kernel.TestMCPServeRefusesNonLoopbackBindWithoutAuth"
        - "core/cmd/helm-ai-kernel.TestSpendProxyRefusesNonLoopbackBind"
      removal:
        - "core/cmd/helm-ai-kernel.TestSpendProxyRefusesNonLoopbackBind"
        - "core/cmd/helm-ai-kernel.TestWrapProxyAuth"
      bypass:
