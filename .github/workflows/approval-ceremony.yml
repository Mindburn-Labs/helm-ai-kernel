name: Approval Ceremony

# Runs on every pull request and push to main. The Postgres-gated proofs used to
# run only when one of a hand-kept list of paths changed, and seven of the eleven
# never ran at all (T-12).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-concurrency-and-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
        env:
          POSTGRES_USER: helm_admin
          POSTGRES_PASSWORD: helm_ci_password
          POSTGRES_DB: helm_approval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helm_admin -d helm_approval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HELM_TEST_POSTGRES_URL: postgres://helm_admin:helm_ci_password@127.0.0.1:5432/helm_approval?sslmode=disable
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.25.13"
          cache-dependency-path: "core/go.sum"
      - name: Verify ceremony golden vectors
        run: make verify-approval-ceremony-vectors
      - name: Verify connector release authority vectors
        run: make verify-connector-release-authority-vectors
      - name: Verify signed effect close vectors
        run: make verify-effect-close-vectors
      - name: Verify signed effect disposition vectors
        run: make verify-effect-disposition-vectors
      - name: Postgres-gated proofs (every one listed in scripts/ci/postgres-proofs.txt; a skip fails)
        run: bash scripts/ci/postgres_proofs.sh
