  - id: CTL-047
    title: "Production egress is deny-all"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      Every production Guardian (serve, proxy and mcp serve) denies an
      evaluation whose trusted context names or requires an egress destination,
      and no configuration adds an allowlist.
    status: enforced
    entry_points:
      - "core/cmd/helm-ai-kernel.newProductionGuardian"
      - "core/pkg/guardian.TaintEgressInterceptor.Evaluate"
    config:
      - "None: newProductionGuardian builds the egress checker with a nil policy, and no flag, variable or file supplies one. Allowing any destination needs a code change."
    protected_operations:
      - "Guardian evaluations whose trusted context names a destination or requires one, denied with DATA_EGRESS_BLOCKED."
      - "POST /v1/chat/completions on serve, which requires its upstream host as the destination and is therefore denied before the upstream is called."
    bypass_assumptions:
      - "Egress that no Guardian evaluation names as a trusted destination is not governed by this gate; HELM is not on the network path (INV-024)."
      - "The checker semantics (empty allowlist denies, explicit deny wins) are INV-004."
    tests:
      allowed:
        - "core/cmd/helm-ai-kernel.TestProxyNonStreamingToolCallGetsPolicyVerdict"
      forbidden:
        - "core/cmd/helm-ai-kernel.TestProductionGuardianFactoryRunsEveryRequiredDenyGate"
      removal:
        - "core/cmd/helm-ai-kernel.TestProductionGuardianFactoryRunsEveryRequiredDenyGate"
      bypass:
        - "core/pkg/guardian.TestEgressGateUsesTrustedDestinationRequirementInsteadOfRiskClass"
  - id: CTL-048
    title: "Kernel credentials never reach the model provider"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      POST /v1/chat/completions on serve never forwards the admin, service or
      organization-runtime key to the model provider; only a caller's provider
      key reaches it (R8).
    status: enforced
    entry_points:
      - "core/cmd/helm-ai-kernel.handleGovernedOpenAIProxy"
      - "core/cmd/helm-ai-kernel.withoutKernelCredential"
    config:
      - "HELM_ADMIN_API_KEY, HELM_SERVICE_API_KEY and HELM_ORGANIZATION_RUNTIME_API_KEY, the values that are dropped"
    protected_operations:
      - "The Authorization header that api.HandleOpenAIProxy forwards upstream as the provider credential."
    bypass_assumptions:
      - "Only exact kernel keys are recognised, with or without an auth scheme; a value derived from a key is not."
      - "The Control Plane token path drops its token separately (control_plane_token.go)."
      - "The standalone `helm-ai-kernel proxy` forwards the caller's Authorization; it holds no kernel credential to leak."
    tests:
