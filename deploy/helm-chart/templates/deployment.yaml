{{/* quantum_posture: chart wiring supplies a raw Ed25519 command-key keyring;
      it does not claim hybrid or post-quantum command signing. */}}
{{- include "helm-ai-kernel.validateDeployment" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm-ai-kernel.fullname" . }}
  labels:
    {{- include "helm-ai-kernel.labels" . | nindent 4 }}
spec:
  {{- if .Values.helm.production }}
  strategy:
    type: Recreate
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "helm-ai-kernel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "helm-ai-kernel.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helm-ai-kernel.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: prepare-authority-state
          image: {{ .Values.runtimeInit.image | quote }}
          imagePullPolicy: {{ .Values.runtimeInit.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            # Secret volumes and supported data volumes receive the pod
            # fsGroup. Run as the kernel identity so no root initializer or
            # added capability is needed to materialize private authority
            # state.
            runAsNonRoot: true
            runAsUser: {{ required "podSecurityContext.runAsUser is required for authority-state initialization" .Values.podSecurityContext.runAsUser }}
            runAsGroup: {{ required "podSecurityContext.runAsGroup is required for authority-state initialization" .Values.podSecurityContext.runAsGroup }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              {{- required "missing chart file files/prepare-authority-state.sh" (.Files.Get "files/prepare-authority-state.sh") | trimSuffix "\n" | nindent 14 }}
          env:
            - name: HELM_AUTHORITY_DATA_DIR
              value: {{ .Values.helm.dataDir | quote }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.helm.dataDir | quote }}
            - name: signing-key
              mountPath: /var/run/helm-signing-key
              readOnly: true
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "helm-ai-kernel.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --policy
            - {{ include "helm-ai-kernel.policyPath" . | quote }}
            - --addr
            - {{ .Values.helm.bindAddr | quote }}
            - --port
            - {{ .Values.service.port | quote }}
            - --data-dir
            - {{ .Values.helm.dataDir | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.service.healthPort }}
              protocol: TCP
            {{- if .Values.helm.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: HELM_DATA_DIR
              value: {{ .Values.helm.dataDir | quote }}
            - name: HELM_HEALTH_PORT
              value: {{ .Values.service.healthPort | quote }}
            - name: HELM_METRICS_ENABLED
              value: {{ ternary "1" "0" .Values.helm.metrics.enabled | quote }}
            - name: HELM_METRICS_PORT
              value: {{ .Values.service.metricsPort | quote }}
            {{- with .Values.helm.metrics.bearerTokenSecret.name }}
            - name: HELM_METRICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.helm.metrics.bearerTokenSecret.key | quote }}
            {{- end }}
            {{- if .Values.telemetry.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ required "telemetry.endpoint is required when telemetry.enabled is true" .Values.telemetry.endpoint | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.telemetry.metricsExporter | quote }}
            {{- with .Values.telemetry.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.telemetry.syntheticLifecycleEvents }}
            - name: HELM_ENV
              value: "synthetic"
            {{- end }}
            {{- end }}
            - name: HELM_LIMIT_GLOBAL_RPS
              value: {{ .Values.helm.limits.global.rps | quote }}
            - name: HELM_LIMIT_GLOBAL_BURST
              value: {{ .Values.helm.limits.global.burst | quote }}
            - name: HELM_LIMIT_ACTOR_RPS
              value: {{ .Values.helm.limits.actor.rps | quote }}
            - name: HELM_LIMIT_ACTOR_BURST
              value: {{ .Values.helm.limits.actor.burst | quote }}
            - name: HELM_CONCURRENCY_MAX
              value: {{ .Values.helm.limits.concurrency.max | quote }}
            - name: HELM_LOAD_SHED_ENABLED
              value: {{ ternary "1" "0" .Values.helm.limits.loadShed.enabled | quote }}
            - name: HELM_LOAD_SHED_LOW_PRIORITY_MAX
              value: {{ .Values.helm.limits.loadShed.lowPriorityMax | quote }}
            {{- if gt (int .Values.helm.guardian.semanticThreatEscalationBP) 0 }}
            - name: HELM_SEMANTIC_THREAT_ESCALATION_BP
              value: {{ .Values.helm.guardian.semanticThreatEscalationBP | quote }}
            {{- end }}
            {{- include "helm-ai-kernel.deploymentPolicyEnv" . | nindent 12 }}
            - name: HELM_PRODUCTION
              value: {{ ternary "1" "0" .Values.helm.production | quote }}
            - name: PORT
              value: {{ .Values.service.port | quote }}
            {{- if .Values.helm.tls.existingSecret }}
            - name: HELM_TLS_CERT_FILE
              value: "/var/run/secrets/helm-tls/tls.crt"
            - name: HELM_TLS_KEY_FILE
              value: "/var/run/secrets/helm-tls/tls.key"
            {{- if .Values.helm.tls.clientAuth }}
            - name: HELM_TLS_CLIENT_CA_FILE
              value: "/var/run/secrets/helm-tls/ca.crt"
            - name: HELM_TLS_CLIENT_AUTH
              value: {{ .Values.helm.tls.clientAuth | quote }}
            {{- end }}
            {{- end }}
            - name: HELM_REGION
              value: {{ .Values.helm.region | quote }}
            {{- if .Values.helm.proxy.enabled }}
            - name: HELM_ENABLE_OPENAI_PROXY
              value: "1"
            - name: HELM_UPSTREAM_URL
              value: {{ .Values.helm.proxy.upstream | quote }}
            {{- end }}
            {{- if .Values.helm.demoMode }}
            - name: HELM_DEMO_MODE
              value: "1"
            {{- end }}
            - name: HELM_SIGNING_ALGORITHM
              value: {{ .Values.helm.signing.algorithm | quote }}
            - name: EVIDENCE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-ai-kernel.signingSecretName" . }}
                  key: signing-key
            {{- if or .Values.helm.auth.existingSecret .Values.helm.auth.adminAPIKey }}
            - name: HELM_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-ai-kernel.authSecretName" . }}
                  key: {{ .Values.helm.auth.adminAPIKeySecretKey }}
            {{- end }}
            {{- if or .Values.helm.auth.existingSecret .Values.helm.auth.serviceAPIKey }}
            - name: HELM_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-ai-kernel.authSecretName" . }}
                  key: {{ .Values.helm.auth.serviceAPIKeySecretKey }}
            {{- end }}
            {{- /* The Kernel needs the organization-runtime key and the Control
                   Plane activation public key together; one without the other
                   fails its service init. So the key is wired only with the
                   activation public key, and the pair is checked above. */}}
            {{- if and .Values.helm.auth.controlPlaneActivationPublicKey .Values.helm.auth.existingSecret .Values.helm.auth.organizationRuntimeAPIKeySecretKey }}
            - name: HELM_CONTROL_PLANE_ACTIVATION_PUBLIC_KEY
              value: {{ .Values.helm.auth.controlPlaneActivationPublicKey | quote }}
            - name: HELM_ORGANIZATION_RUNTIME_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.helm.auth.existingSecret }}
                  key: {{ .Values.helm.auth.organizationRuntimeAPIKeySecretKey }}
            {{- end }}
            {{- if .Values.helm.githubEffects.existingSecret }}
            - name: HELM_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.helm.githubEffects.existingSecret }}
                  key: {{ required "helm.githubEffects.tokenSecretKey is required when helm.githubEffects.existingSecret is set" .Values.helm.githubEffects.tokenSecretKey }}
            {{- if .Values.helm.githubEffects.apiURL }}
            - name: HELM_GITHUB_API_URL
              value: {{ .Values.helm.githubEffects.apiURL | quote }}
            {{- end }}
            {{- end }}
            - name: HELM_RUNTIME_TENANT_ID
              value: {{ .Values.helm.auth.tenantID | quote }}
            - name: HELM_RUNTIME_PRINCIPAL_ID
              value: {{ .Values.helm.auth.principalID | quote }}
            - name: HELM_RUNTIME_WORKSPACE_ID
              value: {{ .Values.helm.auth.workspaceID | quote }}
            {{- with .Values.helm.auth.crossTenantPrincipals }}
            - name: HELM_CROSS_TENANT_PRINCIPALS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.helm.auth.controlPlaneIdentity }}
            {{- if or .jwksURL .issuer .audience .actor }}
            - name: HELM_CP_IDENTITY_JWKS_URL
              value: {{ .jwksURL | quote }}
            - name: HELM_CP_IDENTITY_ISSUER
              value: {{ .issuer | quote }}
            - name: HELM_CP_IDENTITY_AUDIENCE
              value: {{ .audience | quote }}
            - name: HELM_CP_IDENTITY_ACTOR
              value: {{ .actor | quote }}
            - name: HELM_CP_IDENTITY_REQUIRE_CNF
              value: {{ ternary "1" "0" (default false .requireCNF) | quote }}
            {{- if .caBundleConfigMap }}
            - name: HELM_CP_IDENTITY_OUTBOUND_CA_BUNDLE_FILE
              value: {{ printf "/var/run/secrets/helm-cp-identity-ca/%s" (default "ca.crt" .caBundleKey) | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: HELM_EMERGENCY_STOP_FENCE_ENABLED
              value: {{ ternary "1" "0" .Values.helm.emergencyStop.enabled | quote }}
            {{- if .Values.helm.emergencyStop.enabled }}
            - name: HELM_EMERGENCY_STOP_COMMAND_AUDIENCE
              value: {{ required "helm.emergencyStop.audience is required when the scoped emergency-stop fence is enabled" .Values.helm.emergencyStop.audience | quote }}
            - name: HELM_EMERGENCY_STOP_COMMAND_PUBLIC_KEYS
              {{- if .Values.helm.emergencyStop.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.helm.emergencyStop.existingSecret }}
                  key: {{ .Values.helm.emergencyStop.commandPublicKeysSecretKey }}
              {{- else }}
              value: {{ required "helm.emergencyStop.commandPublicKeys or helm.emergencyStop.existingSecret is required when the scoped emergency-stop fence is enabled" .Values.helm.emergencyStop.commandPublicKeys | quote }}
              {{- end }}
            {{- if or .Values.helm.emergencyStop.commandReplayKeyring .Values.helm.emergencyStop.commandReplayKeyringSecretKey }}
            - name: HELM_EMERGENCY_STOP_COMMAND_REPLAY_KEYRING
              {{- if .Values.helm.emergencyStop.commandReplayKeyringSecretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.helm.emergencyStop.existingSecret }}
                  key: {{ .Values.helm.emergencyStop.commandReplayKeyringSecretKey }}
              {{- else }}
              value: {{ .Values.helm.emergencyStop.commandReplayKeyring | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- if eq .Values.helm.storage.type "postgres" }}
            - name: HELM_DB_MAX_OPEN_CONNS
              value: {{ .Values.helm.storage.postgres.maxOpenConns | quote }}
            - name: HELM_DB_MAX_IDLE_CONNS
              value: {{ .Values.helm.storage.postgres.maxIdleConns | quote }}
            - name: HELM_DB_CONN_MAX_LIFETIME
              value: {{ .Values.helm.storage.postgres.connMaxLifetime | quote }}
            {{- if .Values.helm.storage.postgres.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.helm.storage.postgres.existingSecret }}
                  key: {{ .Values.helm.storage.postgres.existingSecretKey }}
            {{- else if .Values.postgresql.enabled }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ include "helm-ai-kernel.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode={{ .Values.helm.storage.postgres.sslMode }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helm-ai-kernel.fullname" . }}-postgresql
                  key: password
            {{- else }}
            - name: DATABASE_URL
              value: {{ include "helm-ai-kernel.databaseURL" . | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.helm.dataDir }}
            - name: policy
              mountPath: {{ include "helm-ai-kernel.policyMountPath" . }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if and (eq .Values.helm.policy.source.kind "controlplane") (eq .Values.helm.policy.source.controlplane.auth.mode "serviceAccountJWT") }}
            - name: policy-service-account-token
              mountPath: /var/run/secrets/helm-policy
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.helm.policy.source.kind "controlplane") .Values.helm.policy.source.controlplane.tls.existingSecret }}
            - name: policy-controlplane-tls
              mountPath: /var/run/secrets/helm-policy-controlplane-tls
              readOnly: true
            {{- end }}
            {{- with .Values.helm.auth.controlPlaneIdentity }}
            {{- if .caBundleConfigMap }}
            - name: cp-identity-ca
              mountPath: /var/run/secrets/helm-cp-identity-ca
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.helm.tls.existingSecret }}
            # A whole-Secret mount (no subPath) so rotated files appear in place.
            - name: api-tls
              mountPath: /var/run/secrets/helm-tls
              readOnly: true
            {{- end }}
        {{- if and .Values.helm.policy.reloadHints.enabled .Values.helm.policy.reloadHints.configReloaderSidecar.enabled }}
        - name: config-reloader
          image: {{ .Values.helm.policy.reloadHints.configReloaderSidecar.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --volume-dir={{ include "helm-ai-kernel.policyMountPath" . }}
            - --webhook-url=http://127.0.0.1:{{ .Values.service.port }}{{ .Values.helm.policy.reloadHints.httpWakeEndpoint }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: policy
              mountPath: {{ include "helm-ai-kernel.policyMountPath" . }}
              readOnly: true
        {{- end }}
      volumes:
        - name: data
          {{ if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "helm-ai-kernel.pvcName" . }}
          {{ else }}
          emptyDir: {}
          {{ end }}
        - name: signing-key
          secret:
            secretName: {{ include "helm-ai-kernel.signingSecretName" . }}
            defaultMode: 256
            items:
              - key: signing-key
                path: root.key
        - name: policy
          {{- if .Values.helm.policy.source.mountedFile.existingSecret }}
          secret:
            secretName: {{ include "helm-ai-kernel.policySecretName" . }}
          {{- else }}
          configMap:
            name: {{ include "helm-ai-kernel.policyConfigMapName" . }}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.helm.auth.controlPlaneIdentity }}
        {{- if .caBundleConfigMap }}
        - name: cp-identity-ca
          configMap:
            name: {{ .caBundleConfigMap | quote }}
        {{- end }}
        {{- end }}
        {{- if and (eq .Values.helm.policy.source.kind "controlplane") (eq .Values.helm.policy.source.controlplane.auth.mode "serviceAccountJWT") }}
        - name: policy-service-account-token
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken:
                  audience: {{ required "helm.policy.source.controlplane.auth.serviceAccountJWT.audience is required" .Values.helm.policy.source.controlplane.auth.serviceAccountJWT.audience | quote }}
                  expirationSeconds: {{ .Values.helm.policy.source.controlplane.auth.serviceAccountJWT.expirationSeconds }}
                  path: token
        {{- end }}
        {{- if .Values.helm.tls.existingSecret }}
        - name: api-tls
          secret:
            secretName: {{ .Values.helm.tls.existingSecret }}
            defaultMode: 256
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              {{- if .Values.helm.tls.clientAuth }}
              - key: ca.crt
                path: ca.crt
              {{- end }}
        {{- end }}
        {{- if and (eq .Values.helm.policy.source.kind "controlplane") .Values.helm.policy.source.controlplane.tls.existingSecret }}
        - name: policy-controlplane-tls
          secret:
            secretName: {{ .Values.helm.policy.source.controlplane.tls.existingSecret }}
            defaultMode: 256
            items:
              - key: {{ .Values.helm.policy.source.controlplane.tls.existingSecretKey }}
                path: ca.pem
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
