name: Lean Proofs

on:
  push:
    branches: [main]
    paths:
      - "proofs/**"
      - "scripts/ci/lean_proof_gate.sh"
      - ".github/workflows/lean.yml"
  pull_request:
    branches: [main]
    paths:
      - "proofs/**"
      - "scripts/ci/lean_proof_gate.sh"
      - ".github/workflows/lean.yml"
  workflow_dispatch: {}

permissions: read-all

# Builds the EffectPermitSoundness Lean proof on every push/PR that
# touches the proofs tree, then checks that a theorem closed by `sorry`
# fails the build (scripts/ci/lean_proof_gate.sh). This job is not a
# required status check and the release workflow does not read it; a
# failure here blocks nothing until the ruleset requires it.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


jobs:
  lake-build:
    name: lake build (EffectPermitSoundness)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install elan + Lean toolchain
        run: |
          set -euo pipefail
          # Pinned elan release, verified by sha256 before it runs.
          ver=4.2.4
          sha256='42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63'
          tmp="$(mktemp -d)"
          archive="$tmp/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/leanprover/elan/releases/download/v${ver}/elan-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$tmp"
          # -y: non-interactive; --default-toolchain none lets the
          # lean-toolchain file in proofs/Lean pin the version on first
          # `lake` invocation, so a single source of truth controls the
          # version across local + CI.
          "$tmp/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        working-directory: proofs/Lean
        run: |
          set -euo pipefail
          elan --version
          lean --version
          lake --version

      - name: lake build, with a sorry control
        run: bash scripts/ci/lean_proof_gate.sh

      - name: Upload .olean artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-olean-${{ github.sha }}
          path: |
            proofs/Lean/.lake/build/lib/**/*.olean
          if-no-files-found: warn
          retention-days: 14
