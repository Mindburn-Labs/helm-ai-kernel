        - "core/cmd/helm-ai-kernel.TestControlPlaneTokenCrossCheckForACrossTenantPrincipal"

  - id: CTL-050
    title: "Public receipt keyring"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      GET /api/v1/receipt-keyring publishes exactly the key id, profile and
      public keys that the running receipt signer stamps on every receipt, in
      the kernel-evaluate-receipt-keyring.v1 shape the Control Plane pins as
      HELM_KERNEL_RECEIPT_KEYRING. It carries no private material, and without
      a publishable signer it answers 503 instead of an empty keyring (HELM-786).
    status: enforced
    entry_points:
      - "core/cmd/helm-ai-kernel.registerReceiptKeyringRoute"
    config:
      - "HELM_RECEIPT_PROFILE (classical or hybrid) and the root key in the data directory select the signer the route describes."
    protected_operations:
      - "GET /api/v1/receipt-keyring on the API listener."
    bypass_assumptions:
      - "The route is public and unauthenticated by design; it serves public keys only."
      - "Over plain HTTP a network attacker can substitute the keyring in transit. Fetch it over the TLS listener (HELM_TLS_*) or pin it out of band."
      - "The Control Plane trusts what an operator copies into HELM_KERNEL_RECEIPT_KEYRING; the route does not push or rotate that pin."
    tests:
      allowed:
        - "core/cmd/helm-ai-kernel.TestReceiptKeyringRouteServesTheExactVector"
        - "core/cmd/helm-ai-kernel.TestReceiptKeyringMatchesTheIdentityStampedOnReceipts"
        - "core/cmd/helm-ai-kernel.TestServeListensOverTLSWhenConfigured"
      forbidden:
        - "core/cmd/helm-ai-kernel.TestReceiptKeyringRouteRefusesWithoutASigner"
        - "core/cmd/helm-ai-kernel.TestReceiptKeyringRouteIsReadOnly"
      removal:
        - "core/cmd/helm-ai-kernel.TestReceiptKeyringRouteRefusesWithoutASigner"
        - "core/cmd/helm-ai-kernel.TestReceiptKeyringMatchesTheIdentityStampedOnReceipts"
      bypass:
        - "core/cmd/helm-ai-kernel.TestPublicRoutesAreDeclaredWithAReason"
  - id: CTL-051
    title: "Effect gateway admission"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      helm-gateway admits an effect only in one READ COMMITTED Postgres
      transaction bound to the token's tenant (ADR-0001): idempotency first on
      (tenant, key) with a request digest; the mandate resolved from the
      token's principal and the effect type; the tenant row, the chain's
      principals, the mandates root to leaf, the effect type and the limits
      locked FOR SHARE; stops read after the locks; counters locked FOR UPDATE;
      then a pure decide. ALLOW records ADMITTED with a conditional hold and a
      permit, DENY records DENIED, and high risk or an approval threshold
      records ESCALATED with approval digest v1. Tenant, workspace and
      principal come only from an ADR-0005 token with the RPC's one scope;
      reads outside the token's tenant or workspace are not found; malformed
      requests and closed-schema argument violations create no attempt
      (HELM-751 s2, HELM-750 s2b).
    status: enforced
    entry_points:
      - "core/cmd/helm-gateway.serve"
      - "core/pkg/gateway/server.Authenticator.Authenticate"
      - "core/pkg/gateway/admission.Service.Propose"
      - "core/pkg/gateway/admission.Decide"
      - "core/pkg/gateway/effectargs.Validate"
      - "core/pkg/gateway/admission.Service.Get"
      - "core/pkg/gateway/admission.Service.GetContent"
    config:
      - "HELM_GATEWAY_DATABASE_URL, the gateway's database; helm-gateway migrate applies the schema and /readyz requires it at head."
      - "HELM_CP_IDENTITY_JWKS_URL, HELM_CP_IDENTITY_ISSUER, HELM_CP_IDENTITY_AUDIENCE (helm-gateway:<env>), HELM_CP_IDENTITY_ACTOR, HELM_CP_IDENTITY_MAX_TTL, HELM_CP_IDENTITY_REQUIRE_CNF and HELM_CP_IDENTITY_OUTBOUND_CA_BUNDLE_FILE; serve refuses to start without the first four."
      - "HELM_TLS_CERT_FILE, HELM_TLS_KEY_FILE, HELM_TLS_CLIENT_AUTH and HELM_TLS_CLIENT_CA_FILE; serve refuses to start without TLS unless --dev-insecure-listen names a loopback IP."
      - "HELM_GATEWAY_PERMIT_TTL (default 10m) and HELM_GATEWAY_APPROVAL_WINDOW (default 24h)."
    protected_operations:
      - "Propose, GetAttempt and GetAttemptContent of helm.gateway.v1.EffectGatewayService on helm-gateway serve."
    bypass_assumptions:
      - "Dispatch, Observe, Stop and Lift answer unimplemented in this slice; nothing in the binary consumes a permit yet, so the dispatch-claim half of ADR-0001 (version re-check, stops after admission) is not enforced here. Approve, Reject and Cancel are CTL-052."
      - "Authority rows (tenants, principals, effect types, mandates, limits, stops) are written by core/pkg/kernel/authority/authorityrows, which no shipped binary calls yet (CTL-046); the gateway trusts the rows it finds."
      - "Token trust is ADR-0005's: a compromised Control Plane issuer can mint a token for any tenant; row security by session variable does not protect against a compromised gateway process (ADR-0004 §5.2)."
      - "A mandate condition is compiled at activation and once per condition text per gateway process; a condition that fails there is denied (PRG_EVALUATION_ERROR)."
      - "helm-gateway has no container image or chart yet; it is enforced where it runs, and nothing deploys it."
    tests:
      allowed:
        - "core/pkg/gateway/admission.TestPostgresProposeAdmitsDeniesAndEscalates"
        - "core/pkg/gateway/server.TestPostgresGatewayAPIOnTheWire"
        - "core/pkg/gateway/admission.TestDecideAllowsDeniesAndEscalatesInOrder"
        - "core/pkg/gateway/effectargs.TestValidateAcceptsTheSkeletonArguments"
        - "core/pkg/gateway/server.TestAuthenticateTakesIdentityOnlyFromAValidToken"
        - "core/cmd/helm-gateway.TestPostgresGatewayMigrateAndReadiness"
      forbidden:
        - "core/pkg/gateway/admission.TestPostgresStopsDenyAdmission"
        - "core/pkg/gateway/admission.TestPostgresProposeIsIdempotent"
        - "core/pkg/gateway/admission.TestPostgresConcurrentProposalsAdmitOnce"
        - "core/pkg/gateway/admission.TestPostgresReadsAreTenantAndWorkspaceScoped"
        - "core/pkg/gateway/admission.TestPostgresMalformedProposalsCreateNoAttempt"
        - "core/pkg/gateway/admission.TestPostgresMandateSelectionIsBoundToThePrincipal"
        - "core/pkg/gateway/admission.TestPostgresDraftPullRequestNeedsItsObservedBranch"
        - "core/pkg/gateway/admission.TestRequestDigestCoversEveryFieldButTheKey"
        - "core/pkg/gateway/effectargs.TestValidateRefusesMalformedArguments"
        - "core/pkg/gateway/server.TestAuthenticateRefusesBadTokens"
        - "core/cmd/helm-gateway.TestDevInsecureListenRefusesAnythingButLoopback"
        - "core/cmd/helm-gateway.TestServeRefusesToStartWithoutItsConfiguration"
        - "core/cmd/helm-gateway.TestServeRequiresAClientCertificateWhenConfigured"
      removal:
        - "core/pkg/gateway/admission.TestDecideAllowsDeniesAndEscalatesInOrder"
        - "core/pkg/gateway/admission.TestApprovalDigestV1MatchesTheDesignNoteVector"
        - "core/pkg/gateway/effectargs.TestValidateRefusesMalformedArguments"
        - "core/pkg/gateway/server.TestAuthenticateRefusesBadTokens"
      bypass:
        - "core/pkg/gateway/server.TestAuthenticateBindsTheTokenToTheClientCertificateWhenRequired"
        - "core/pkg/gateway/admission.TestGatewayDoesNotImportTheLegacyRuntime"
        - "core/cmd/helm-gateway.TestServeOverDevInsecureLoopbackAnswersGRPC"
  - id: CTL-052
    title: "Gateway approval decisions"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      helm-gateway records at most one decision per ESCALATED attempt, by an
      active human principal of the tenant distinct from the requester
      (ADR-0001 I6), with a helm.gateway.decide token bound by RFC 9396
      authorization_details to that attempt and action and used once: its
      jti is recorded in Postgres in the decision's transaction. The
      approval digest must equal the attempt's, the escalation must not have
      expired, and high, irreversible or authority-widening effects fail
      closed until step-up exists (STEP_UP_REQUIRED). Approve re-runs
      admission in the same transaction, re-reading stops, the mandate chain
      and counters, so the attempt becomes ADMITTED or DENIED; a refused
      precondition leaves it ESCALATED. Cancel follows ESCALATED or ADMITTED
      to CANCELLED only, voiding the permit and releasing held exposure in
      the same transaction, for the requester's propose token or an active
      human operator's single-use stop token.
    status: enforced
    entry_points:
      - "core/pkg/gateway/admission.Service.Approve"
      - "core/pkg/gateway/admission.Service.Reject"
      - "core/pkg/gateway/admission.Service.Cancel"
      - "core/pkg/gateway/server.Server.Approve"
      - "core/pkg/gateway/server.Server.Cancel"
    config:
      - "The HELM_CP_IDENTITY_* token configuration of CTL-051; decide and stop tokens are minted per decision by the Control Plane and carry iss, jti and exp."
    protected_operations:
      - "Approve, Reject and Cancel of helm.gateway.v1.EffectGatewayService on helm-gateway serve."
    bypass_assumptions:
      - "Step-up does not exist yet, so a high, irreversible or helm.authority.* effect cannot be approved at all; a medium effect a mandate escalates (approval_required) is approved without it."
      - "An escalation past its expiry is refused but stays ESCALATED: the River job that moves it to EXPIRED is a later slice."
      - "A decide token binds the attempt and action; the approver sees and hashes the arguments through GetAttemptContent, which this slice serves but cannot force a client to use."
      - "Releasing an ADMITTED attempt keeps its distinct-value rows, so the value still counts as seen in its bucket."
      - "The trust limits of CTL-051 (ADR-0005 issuer trust, no deployment yet) apply."
    tests:
      allowed:
        - "core/pkg/gateway/admission.TestPostgresApproveByADistinctHumanAdmits"
        - "core/pkg/gateway/server.TestPostgresGatewayDecisionsOnTheWire"
        - "core/pkg/gateway/admission.TestPostgresCancelReleasesAndFollowsTheAllowedEdges"
      forbidden:
        - "core/pkg/gateway/admission.TestPostgresApprovalPreconditionsLeaveTheAttemptEscalated"
        - "core/pkg/gateway/admission.TestPostgresDecideAndStopTokensAreSingleUse"
        - "core/pkg/gateway/admission.TestPostgresApproveRereadsStopsAndTheMandate"
        - "core/pkg/gateway/admission.TestPostgresStepUpAndExpiryFailClosed"
        - "core/pkg/gateway/admission.TestPostgresConcurrentApprovalsAdmitOnce"
        - "core/pkg/gateway/server.TestDecisionBinding"
      removal:
        - "core/pkg/gateway/server.TestDecisionBinding"
        - "core/pkg/gateway/admission.TestDecideAllowsDeniesAndEscalatesInOrder"
        - "core/pkg/gateway/admission.TestStepUpCoversHighIrreversibleAndAuthorityChanges"
      bypass:
        - "core/pkg/gateway/admission.TestStepUpCoversHighIrreversibleAndAuthorityChanges"
