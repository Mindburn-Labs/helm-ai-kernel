name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 2"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
          - language: javascript-typescript
          - language: python
          - language: java-kotlin
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - if: matrix.language == 'go'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.25.13"
          cache-dependency-path: "**/go.sum"
          cache: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
      # Manual build mode extracts only what is compiled here, so compile every
      # package and test binary of every tracked Go module (26-09: the old list
      # skipped nine of the ten core/cmd mains, tools/* and the nested modules).
      # The step fails if a module does not build or if any core/cmd main was
      # not in the compiled package list.
      - if: matrix.language == 'go'
        name: Build every Go module for CodeQL
        run: |
          set -euo pipefail
          go version
          modules="$(git ls-files ':(glob)**/go.mod' | xargs -n1 dirname | sort -u)"
          test -n "$modules"
          : > "$RUNNER_TEMP/codeql-packages.txt"
          for module in $modules; do
            echo "==> $module"
            (cd "$module" && GOWORK=off go list -f '{{.ImportPath}}' ./... >> "$RUNNER_TEMP/codeql-packages.txt")
            (cd "$module" && GOWORK=off go test ./... -run '^$' >/dev/null)
          done
          for main in core/cmd/*/; do
            pkg="github.com/Mindburn-Labs/helm-ai-kernel/${main%/}"
            grep -qx "$pkg" "$RUNNER_TEMP/codeql-packages.txt" || { echo "::error::$pkg was not compiled for CodeQL"; exit 1; }
          done
          echo "compiled $(wc -l < "$RUNNER_TEMP/codeql-packages.txt") packages across $(echo "$modules" | wc -l) modules"
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:${{ matrix.language }}"
