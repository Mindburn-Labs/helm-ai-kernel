{{- if and .Values.helm.metrics.enabled .Values.helm.metrics.serviceMonitor.enabled -}}
{{- if not .Values.helm.metrics.bearerTokenSecret.name -}}
{{- fail "helm.metrics.serviceMonitor.enabled requires helm.metrics.bearerTokenSecret.name: the kernel answers remote /metrics scrapes only with a bearer token" -}}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "helm-ai-kernel.fullname" . }}
  labels:
    {{- include "helm-ai-kernel.labels" . | nindent 4 }}
    {{- with .Values.helm.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "helm-ai-kernel.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.helm.metrics.serviceMonitor.interval }}
      path: /metrics
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.helm.metrics.bearerTokenSecret.name | quote }}
          key: {{ .Values.helm.metrics.bearerTokenSecret.key | quote }}
{{- end }}
