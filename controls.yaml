      - "HELM_GATEWAY_GITHUB_API_URL (default https://api.github.com; https, or http on loopback only)."
    protected_operations:
      - "Dispatch and Observe of github.repository.get, github.branch.create_from_changes and github.pull_request.create_draft on helm-gateway serve."
    bypass_assumptions:
      - "The digest binds the bytes, not their meaning: the gateway's admission decides what those bytes may do (CTL-052)."
      - "The gateway trusts the App key and installations file as mounted; whoever can write them can widen a tenant's repositories."
      - "The chart's egress rule for GitHub is port 443 to any address; a NetworkPolicy cannot name api.github.com."
