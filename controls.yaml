    tests:
      - "core/pkg/canonicalize.TestJCS_Sorting"
      - "core/pkg/canonicalize.TestJCS_RecursiveSorting"
  - control: INV-002
    file: core/pkg/proofgraph/node.go
    find: "\t\tPrincipalSeq: n.PrincipalSeq,\n\t\tPayload:      n.Payload,\n\t\tSig:          n.Sig,\n"
    replace: "\t\tPrincipalSeq: n.PrincipalSeq + uint64(n.Timestamp),\n\t\tPayload:      n.Payload,\n\t\tSig:          n.Sig,\n"
    tests:
      - "core/pkg/proofgraph.TestNodeHash_TimestampExcluded"
  - control: INV-002
    file: core/pkg/proofgraph/graph.go
    find: "\tdefer g.mu.Unlock()\n\n\tg.lamport++\n\n\t// Standard v1.2"
    replace: "\tdefer g.mu.Unlock()\n\n\t// Standard v1.2"
