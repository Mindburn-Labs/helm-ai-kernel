  - id: CTL-051
    title: "Effect adapters act only on the permitted bytes"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      helm-gateway's Dispatch and Observe act on GitHub only through the
      GitHub effect adapter, for github.repository.get,
      github.branch.create_from_changes and github.pull_request.create_draft.
      The adapter's Dispatch refuses with PERMIT_ARGUMENT_MISMATCH, before any
      provider call, unless the permit's argument digest is SHA-256 of the
      exact argument bytes it is about to act on (audit 09-01). It takes the
      repository only from a validated github.com/{owner}/{repo} target and
      refuses arguments outside the closed v1 schemas with SCHEMA_VIOLATION
      (audit 09-02). Its credential is an installation token the gateway's
      GitHub App custody mints per repository, only for a repository the
      tenant's installation entry allows, scoped to that one repository and
      to the least permissions its effect type needs, cached per key under
      that key's own lock, and never logged (R8, HELM-751 s3).
    status: enforced
    entry_points:
      - "core/pkg/gateway/runtime.effectsFromEnv"
      - "core/pkg/gateway/adapters.CheckPermitDigest"
      - "core/pkg/gateway/adapters/github.Adapter.Dispatch"
      - "core/pkg/gateway/adapters/github.Adapter.Observe"
