        - "core/pkg/gateway/admission.TestPostgresCrashAfterTheClaimIsReconciledNeverResent"
  - id: CTL-055
    title: "Gateway stops and lifts"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      helm-gateway's Stop writes a stop row and bumps its scope's control row
      (tenant, principal, mandate or effect type) in one transaction, for an
      active human operator of the tenant with a single-use helm.gateway.stop
      token, idempotent on (tenant, key) with a request digest (HELM-751 s3b).
      The stop token names the stop request (authorization_details
      helm_stop), and concurrent Stops under one key make one stop.
      Admissions after it are DENIED and admitted attempts are CANCELLED at
      their dispatch claim, both EMERGENCY_STOP_FENCED; a principal stop
      covers the requester, the workload that carries its call (act.sub), the
      dispatcher and its act, and a stopped approver cannot approve. A call
      already dispatched is not retracted and is read back as usual. Lift,
      the only way to create a helm.authority.lift attempt, proposes one for
      the stop its single-use stop token names (helm_stop_lift); the lift is
      blocked by every stop but that one. Every helm.authority.* effect
      escalates whatever its risk row or approval_required says, counts
      against no limit, needs a distinct human approver and fails closed
      without step-up (STEP_UP_REQUIRED).
    status: enforced
    entry_points:
      - "core/pkg/gateway/server.Server.Stop"
      - "core/pkg/gateway/server.Server.Lift"
      - "core/pkg/gateway/admission.Service.Stop"
      - "core/pkg/gateway/admission.Service.Lift"
      - "core/pkg/kernel/authority/mandates.BumpControlRow"
    config:
      - "The HELM_CP_IDENTITY_* token configuration of CTL-052; stop tokens are minted per operator action and carry iss, jti and exp."
    protected_operations:
      - "Stop and Lift of helm.gateway.v1.EffectGatewayService on helm-gateway serve, and the Console's emergency stop (HELM-799) through Stop."
    bypass_assumptions:
      - "Step-up does not exist yet, so no lift can be approved: a stop through the gateway stays until it expires, or until the authority-row store (CTL-046) lifts it with a distinct approver."
      - "A lift attempt that were ADMITTED has no applier yet: applying the lift at dispatch lands with step-up."
      - "An operator is whoever the gateway's principal rows record as an active human; the token's issuer is trusted as in CTL-052."
    tests:
      allowed:
        - "core/pkg/gateway/admission.TestPostgresStopBlocksProposeApproveAndDispatch"
        - "core/pkg/gateway/server.TestPostgresStopLiftAndCancelOnTheWire"
        - "core/pkg/gateway/server.TestStopTokenBindings"
      forbidden:
        - "core/pkg/gateway/admission.TestPostgresStopBlocksProposeApproveAndDispatch"
        - "core/pkg/gateway/admission.TestPostgresLiftNeedsADistinctStepUpApprover"
        - "core/pkg/gateway/admission.TestPostgresPrincipalStopCoversTheWorkloadAndTheDispatcher"
        - "core/pkg/gateway/admission.TestPostgresAStoppedApproverCannotApprove"
        - "core/pkg/gateway/admission.TestPostgresLiftIsBlockedByEveryStopButItsOwn"
        - "core/pkg/gateway/admission.TestPostgresConcurrentStopsUnderOneKeyReplay"
        - "core/pkg/gateway/server.TestPostgresStopLiftAndCancelOnTheWire"
        - "core/pkg/gateway/admission.TestDecideEscalatesAuthorityChangesAndLetsALiftThroughStops"
        - "core/pkg/gateway/server.TestStopTokenBindings"
      removal:
        - "core/pkg/gateway/admission.TestDecideEscalatesAuthorityChangesAndLetsALiftThroughStops"
        - "core/pkg/gateway/server.TestStopTokenBindings"
      bypass:
        - "core/pkg/gateway/admission.TestPostgresStopMidFlightDoesNotRetractADispatchedCall"
  - id: CTL-056
    title: "Gateway escalation timers and reconciliation jobs"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      helm-gateway enqueues River jobs in its own Postgres in the transaction
      that makes them due (TA §6.2): an escalation's expiry job with the
      escalation, and a reconciliation job with the dispatch claim. The
      expiry job writes EXPIRED (APPROVAL_TIMEOUT) under the attempt's row
      lock, so an approval and the expiry make exactly one transition. The
      reconciliation job reads the attempt back with doubling backoff, waits
      out a dispatch fence without spending an attempt, never dispatches, and
      at the last attempt moves an attempt still unresolved to
      ESCALATED_TO_HUMAN with its reservation held, in a transaction of its
      own, whatever made the read-back fail. A graceful stop lets running
      jobs finish (a 15 s soft stop) (HELM-751 s3b).
    status: enforced
    entry_points:
      - "core/pkg/gateway/jobs.Runner.EnqueueTx"
      - "core/pkg/gateway/jobs.Runner.Run"
      - "core/pkg/gateway/admission.Service.ExpireEscalation"
      - "core/pkg/gateway/admission.Service.Reconcile"
    config:
      - "helm-gateway migrate applies River's migrations with the gateway schema; /readyz requires both current. River's tables need the helm_gateway grants listed in the chart's 002_grants.sql."
      - "Defaults: the first read-back 30s after the claim, backoff 30s doubling to 30m, 12 read-backs (about four hours)."
    protected_operations:
      - "Escalation expiry and UNKNOWN reconciliation for every attempt helm-gateway serve admits or dispatches."
    bypass_assumptions:
      - "Jobs run in helm-gateway serve; with no serve process running, nothing expires or reconciles until one starts. Jobs are durable rows and run late, never not at all."
      - "A last attempt whose hand-off transaction itself fails (the database unreachable) is discarded by River; the attempt stays UNKNOWN with its hold, and Observe still resolves it."
      - "River's tables have no row security; job arguments carry tenant, workspace and attempt IDs only (follow-up L3). All jobs share one worker pool (follow-up L4)."
      - "River's tables carry job arguments (tenant, workspace and attempt IDs) outside row security; every job binds its own transaction to the tenant it names."
    tests:
      allowed:
        - "core/pkg/gateway/jobs.TestPostgresEscalationExpiresOnItsTimer"
        - "core/pkg/gateway/jobs.TestPostgresReconcilePollsUnknownToAnOutcome"
        - "core/pkg/gateway/jobs.TestReconcileWorkerEscalatesOnlyOnTheLastAttempt"
      forbidden:
        - "core/pkg/gateway/jobs.TestPostgresApprovalAndExpiryMakeOneTransition"
        - "core/pkg/gateway/jobs.TestPostgresReconcileHandsAnUnresolvableAttemptToAHuman"
        - "core/pkg/gateway/jobs.TestPostgresReconcileWaitsForTheDispatchFence"
        - "core/pkg/gateway/jobs.TestReconcileWorkerEscalatesOnlyOnTheLastAttempt"
        - "core/pkg/gateway/jobs.TestBackoffDoublesToItsCap"
        - "core/pkg/gateway/admission.TestPostgresFinalReconcileHandsOffWhateverTheReadBackError"
      removal:
        - "core/pkg/gateway/jobs.TestReconcileWorkerEscalatesOnlyOnTheLastAttempt"
      bypass:
        - "core/pkg/gateway/runtime.TestPostgresGatewayMigrateAndReadiness"

  - id: CTL-057
    title: "Gateway worker endpoint and episode isolation"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      helm-gateway serves its effect types to episode workers as MCP tools at
      /mcp on the worker listener (HELM-751 K3), stateless, in the 2026-07-28
      revision and the legacy initialize handshake. Tenant, workspace,
      principal, actor and episode come only from the verified worker token;
      only agent principals are served; tools/list names the effect types of the
      caller's live mandate chains that the gateway performs; and a tool call is
      proposed, admitted, dispatched and observed under the same admission
      transaction and permit as any effect, the permit claimed by the worker's
      own principal and never under a helm.gateway.execute token. An escalation
      is a structured non-error result, a denial a tool error with its reason
      code, and the same request replayed is the same attempt. An attempt
      proposed under an episode token records the claim's episode and takes its
      work item as its case; a token with an episode claim proposes under that
      work item only and reads only the attempts of its own episode that its own
      principal proposed, in every read of an attempt (HELM-751 N1). Public
      executors use a separate listener and audience, a signed canonical client
      marker, complete episode linkage and a strict 900-second maximum lease.
      Internal worker tokens, including short ones, cannot authenticate there.
      Registered custom argument schemas are compiled as closed objects at
      startup and enforced against the complete input before any admission
      transaction. Exact published builtin schemas retain their native
      semantic validators; a changed declaration cannot inherit that exemption.
