  - id: CTL-054
    title: "Gateway dispatch claim and observation"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      helm-gateway dispatches and observes an attempt only for the active
      workload principal (agent or service) it was proposed through, its
      requester actor or its requester principal, in the token's tenant and
      workspace with a helm.gateway.execute token, and dispatches it only
      through one claim transaction, which records the dispatcher,
      committed before any provider I/O (ADR-0001 §1, TA §4.1): it locks the
      attempt and its unused permit, re-locks the authority rows FOR SHARE and
      reads the stops after them. An active stop (EMERGENCY_STOP_FENCED), an
      expired permit (PERMIT_EXPIRED), any change to a row the permit was
      issued under (AUTHORITY_CHANGED) or a mandate outside its validity
      (MANDATE_OUTSIDE_VALIDITY) voids the permit, releases the held exposure
      and records CANCELLED; otherwise the permit is consumed once and the
      attempt becomes DISPATCHING with a fence. The adapter's SENT becomes
      DISPATCHED and is read back; NOT_SENT becomes OBSERVED(FAILED) with the
      adapter's reason and releases the hold; INDEFINITE becomes UNKNOWN and
      keeps it. A repeated Dispatch returns the stored attempt, and UNKNOWN or
      a DISPATCHING attempt past its fence is only ever read back by Observe,
      never sent again. A FAILED read-back that rests only on the object's
      absence is inconclusive until the fence has passed. Observe records the
      typed result the effect type defines, with evidence_digest and
      result_ref, SHA-256 over the result's JCS form, and in the same
      transaction consumes the held exposure (SUCCEEDED, or an object that
      contradicts the effect) or releases it (absent after the fence)
      (HELM-751 s3). Adapter invocation context carries the authenticated
      tenant/workspace, requester, original attempt/permit/claim, expiry and
      admitted resource quote from the locked rows, never from arguments.
      Observe reconstructs the same context without granting another dispatch.
    status: enforced
    entry_points:
      - "core/pkg/gateway/server.Server.Dispatch"
      - "core/pkg/gateway/server.Server.Observe"
      - "core/pkg/gateway/admission.Service.Dispatch"
      - "core/pkg/gateway/admission.Service.Observe"
    config:
      - "HELM_GATEWAY_DISPATCH_TIMEOUT (default 2m) bounds one adapter call; the fence is the claim time plus it plus a one-minute grace."
      - "The HELM_CP_IDENTITY_* token configuration of CTL-052; execute tokens are minted for workload principals only."
    protected_operations:
      - "Dispatch and Observe of helm.gateway.v1.EffectGatewayService on helm-gateway serve."
    bypass_assumptions:
      - "A provider that applies a write more than a minute after the gateway stopped waiting can be read back as FAILED before it lands; the fence bounds this, it does not remove it."
      - "UNKNOWN is reconciled by the reconcile job (CTL-056) or a workload's Observe."
      - "Stops are written by the Stop RPC (CTL-055) or core/pkg/kernel/authority/authorityrows (CTL-046)."
      - "An observation is what the adapter read back from the provider (trust class provider_readback); the gateway checks its shape, not its truth."
      - "A count-unit effect's exposure settles at its observed outcome; the SETTLED state is left to model-call settlement (HELM-752)."
      - "The trust limits of CTL-052 (ADR-0005 issuer trust) apply."
    tests:
      allowed:
        - "core/pkg/gateway/admission.TestPostgresAdapterInvocationSurvivesRecovery"
        - "core/pkg/gateway/admission.TestInvocationForUsesLockedScope"
        - "core/pkg/gateway/admission.TestPostgresDispatchClaimsThePermitOnce"
        - "core/pkg/gateway/admission.TestPostgresObserveRecordsTheTypedResult"
        - "core/pkg/gateway/server.TestPostgresWalkingSkeletonOnTheWire"
        - "core/pkg/gateway/admission.TestClaimRefusal"
      forbidden:
        - "core/pkg/gateway/admission.TestPostgresPermitIsConsumedOnce"
        - "core/pkg/gateway/admission.TestPostgresClaimRefusalsCancelAndRelease"
        - "core/pkg/gateway/admission.TestPostgresLostResponseIsReconciledByObserve"
        - "core/pkg/gateway/admission.TestPostgresNotSentIsObservedFailedAndReleased"
        - "core/pkg/gateway/admission.TestPostgresDispatchIsTenantWorkspaceAndWorkloadScoped"
        - "core/pkg/gateway/admission.TestPostgresAbsenceInsideTheFenceIsInconclusive"
        - "core/pkg/gateway/admission.TestPostgresContradictedReadBackConsumesTheReservation"
        - "core/pkg/gateway/admission.TestPostgresLateAnswerAfterTheFenceIsIgnored"
        - "core/pkg/gateway/admission.TestPostgresOnlyTheProposingWorkloadDispatches"
        - "core/pkg/gateway/admission.TestReadBackVerdict"
        - "core/pkg/gateway/admission.TestMayExecute"
        - "core/pkg/gateway/admission.TestClaimRefusal"
        - "core/pkg/gateway/admission.TestAfterDispatch"
        - "core/pkg/gateway/admission.TestTypedResultFollowsTheEffectType"
      removal:
