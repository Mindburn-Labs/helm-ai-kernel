# controls.yaml — the HELM control registry (binding rule R1, HELM-746).
#
# Every enforcement claim this kernel makes is an entry here. An entry names
# its owner, entry points, configuration, protected operations and bypass
# assumptions, and the Go tests for the allowed operation, the forbidden
# operation, removal of the control and the bypass cases that apply.
#
# status is one of:
#   enforced       every entry point is reachable from a shipped binary
#                  (scripts/ci/deadcode-roots.txt) and the allowed, forbidden
#                  and removal tests exist. Only this tested path is enforced.
#   observed-only  code or tests exist, but the path is not enforced in a
#                  shipped binary; `reason` says what is missing.
#   unmanaged      nothing in this tree enforces the claim; `reason` says why.
#
# References are checked by `make controls-check`:
#   entry_points   <core dir>.<Func> or <core dir>.<Type>.<Method>
#   tests          <core dir>.<TestName>, as `go test -list` reports it
#   removal_mutation  optional. The gate applies it with `go test -overlay`
#                  and requires every removal test to pass without it and
#                  fail with it.
#
# Ids are never removed or reused: retire an invariant in place, and keep a
# control's number. A gap in either sequence fails the gate.
#
# INV-NNN entries also carry the text of HELM_INVARIANTS.md (section, body,
# verify). That file and coverage-map.json are generated: edit this file, then
# run `make controls`. A commit that changes an invariant's text still needs a
# CONCEPT-CHANGE(INV-NNN) marker (`make concept-gate`).
#
# quantum_posture: this registry records which code paths hold existing
# signing, hashing and key-separation properties. It pins no algorithm and
# makes no post-quantum claim; migration follows kernel-wide signing policy.

version: 1

# The frame of HELM_INVARIANTS.md around the invariant blocks.
document:
  title: HELM Invariants
  last_reviewed: "2026-09-24"
  preamble: |
    The properties this kernel does not trade away, each one pinned to the artifact
    that proves it.

    ## How this document works

    **Ids are permanent.** An invariant is `INV-NNN`. Numbers are never renumbered
    and never reused. When an invariant stops being the right rule it keeps its id,
    gains a `RETIRED` marker, and points at whatever superseded it. A reader who
    finds `INV-007` in a two-year-old commit message must land on the same idea it
    described then, even if the answer today is "that became `INV-019`".

    **Every invariant carries a `verify:` hint.** The hint names the test, gate, or
    artifact that proves the claim. An invariant nobody can check is a wish, not an
    invariant — and a wish written in this format is worse than no entry at all,
    because it borrows the authority of the ones that are real.

    **Hint form is load-bearing.** A `verify:` line either cites references in
    backticks — repo paths, Go test names, `make` targets — or it is free prose. The
    gate resolves the backticked references and refuses anything dangling. It does
    not touch the prose, and it prints every prose hint under a heading saying so.
    Some obligations are genuinely human-owned; the honest move is to mark them,
    not to dress them as automation. An invariant may carry one line of each.

    **Amending this file requires a marker.** A commit that adds, edits, or retires
    an invariant must carry `CONCEPT-CHANGE(INV-NNN)` in its message naming every id
    it touched. Editing the surrounding prose is not a concept change and needs no
    marker. This is what stops the constitution from drifting one convenient
    sentence at a time.

    **This file is generated.** [`controls.yaml`](controls.yaml) is the control
    registry (binding rule R1). It holds the text of every invariant together with
    its owner, entry points, protected operations, bypass assumptions and tests,
    plus the controls that are not invariants. Edit the registry and run
    `make controls`, which rewrites this file and `coverage-map.json`. The marker
    rule above still applies to the invariant text.

    **Gates.**

    ```bash
    make inv-check        # hints resolve; ids unique; checker self-tests first
    make concept-gate     # amendments carry a CONCEPT-CHANGE marker
    make controls-check   # registry valid; enforced paths reachable and tested; files current
    ```

    `make inv-check` runs synthetic negative controls before it reads this file and
    fails itself if any control comes back wrong. A checker that has stopped
    discriminating would report a green constitution it never inspected, which is
    strictly worse than having no checker at all.

    The numbered-invariant pattern follows razzant/claudexor (MIT).

sections:
  - id: determinism
    title: "Determinism and canonicalization"
  - id: fail-closed
    title: "Fail-closed enforcement"
  - id: authorization
    title: "Authorization binding"
  - id: live-tree-delivery
    title: "Live-tree delivery"
    intro: |
      RETIRED section, 2026-09-24 (HELM-756). INV-013 to INV-020 were held by
      `core/pkg/patchdelivery` and `core/pkg/worktree`. Neither package ever had a
      production caller, a CLI command, a route, or a receipt, and both are deleted.
      Under the target architecture (rev 3.4, §7.1–7.2) agents work inside a bought
      sandbox, and a change reaches a repository only as an effect admitted through
      the gateway. No kernel code writes to a user's live working tree, so the
      behaviour these invariants governed is out of scope here. The authorization
      half of the rules continues under the successors each entry names. The
      decision and its evidence are recorded in
      [the wave-1 retirement inventory](docs/retirement/wave-1-inventory.md).
  - id: agent-process-envelope
    title: "Agent process envelope"
    intro: |
      INV-021 to INV-023 are RETIRED, 2026-09-24 (HELM-756). They were held by
      `core/pkg/harness`, which spawned vendor coding-agent CLIs as child processes.
      It never had a production caller and is deleted. In the target architecture
      (rev 3.4, §7.1–7.2) a runner inside the sandbox image speaks the episode
      protocol, and the sandbox holds no credentials at all. Two requirements outlive
      the package: no provider credential reaches an agent run, and each run ends in
      exactly one terminal event (`done` or `failed`). Both must acquire a tested
      owner in the episode runner and the control registry (architecture §14.4)
      before any release claims them. Until then nothing in this repository enforces
      them, and no document may say otherwise. INV-024 stays in force.
  - id: repository-gates
    title: "Repository-level enforcement"

controls:

  - id: INV-001
    title: "Every hashed structure is JCS-canonical first"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      A structure whose hash is signed, compared or stored is hashed over its
      RFC 8785 (JCS) canonical form.
    status: enforced
    entry_points:
      - "core/pkg/canonicalize.JCS"
      - "core/pkg/canonicalize.CanonicalHash"
    config: []
    protected_operations:
      - "Hashing a value through canonicalize.JCS or canonicalize.CanonicalHash before it is signed, compared or stored."
    bypass_assumptions:
      - "A caller that hashes encoding/json output directly skips canonicalization. No gate finds such callers, so the claim covers hashes computed through these entry points only."
    tests:
      allowed:
        - "core/pkg/canonicalize.TestCanonicalHash_Stability"
        - "core/pkg/canonicalize.TestJCS_Sorting"
      forbidden:
        - "core/pkg/canonicalize.TestJCS_RecursiveSorting"
        - "core/pkg/canonicalize.TestJCS_NoHTMLEscaping"
      removal:
        - "core/pkg/canonicalize.TestJCS_Sorting"
        - "core/pkg/canonicalize.TestJCS_RecursiveSorting"
      bypass: []
    section: determinism
    body: |
      Anything whose hash is signed, compared, or stored goes through JCS (RFC 8785)
      before SHA-256. Two hosts that disagree about key order or number formatting
      would produce two hashes for one fact, and every downstream proof would inherit
      the disagreement. Canonicalization is what makes an EvidencePack verify
      identically on a machine that never saw the run.
    verify:
      - "`core/pkg/canonicalize/jcs.go` · tests `TestCanonicalHash_Stability`, `TestJCS_RecursiveSorting`, `FuzzJCS`"

  - id: INV-002
    title: "ProofGraph ordering and node hashes are wall-clock independent"
    owner: Mindburn Labs core team (proofgraph)
    claim: >-
      ProofGraph Lamport values increase monotonically and a node hash excludes
      its timestamp.
    status: enforced
    entry_points:
      - "core/pkg/proofgraph.Graph.Append"
      - "core/pkg/proofgraph.Node.ComputeNodeHash"
    config: []
    protected_operations:
      - "Appending a node to a ProofGraph."
      - "Computing and re-validating a node hash."
    bypass_assumptions:
      - "A node assembled without Graph.Append gets no Lamport value from the graph; Graph.ValidateChain recomputes every hash when the graph is read back."
    tests:
      allowed:
        - "core/pkg/proofgraph.TestGraph_AppendAndValidate"
        - "core/pkg/proofgraph.TestNodeHash_TimestampExcluded"
      forbidden:
        - "core/pkg/proofgraph.TestDAGValidation_TamperedNode"
        - "core/pkg/proofgraph.TestGraph_LamportMonotonicity"
      removal:
        - "core/pkg/proofgraph.TestNodeHash_TimestampExcluded"
        - "core/pkg/proofgraph.TestGraph_LamportMonotonicity"
      bypass: []
    section: determinism
    body: |
      Lamport values increase monotonically, and a node's hash excludes its timestamp.
      Causal order is a property of the graph, not of whichever clock happened to
      observe it, so replaying the same run on a different host reproduces the same
      node identities.
    verify:
      - "`core/pkg/proofgraph/node.go`, `core/pkg/proofgraph/graph.go` · tests `TestNodeHash_TimestampExcluded`, `TestGraph_LamportMonotonicity`, `TestDAGValidation_TamperedNode`"

  - id: INV-003
    title: "EvidencePack roots are deterministic and inclusion is tamper-evident"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      An EvidencePack Merkle root is a function of its entries alone, and an
      inclusion path fails once any sibling is altered.
    status: enforced
    entry_points:
      - "core/pkg/evidencepack.ComputeEntriesMerkleRoot"
      - "core/pkg/evidencepack.VerifyInclusionPath"
    config: []
    protected_operations:
      - "Computing an EvidencePack root."
      - "Verifying an entry's inclusion path."
    bypass_assumptions:
      - "A verifier that trusts a pack's stated root without recomputing it gets no protection from this control."
    tests:
      allowed:
        - "core/pkg/evidencepack.TestComputeEntriesMerkleRoot_Deterministic"
        - "core/pkg/evidencepack.TestInclusionPath_RoundTripEveryEntry"
      forbidden:
        - "core/pkg/evidencepack.TestInclusionPath_TamperedSiblingFails"
        - "core/pkg/evidencepack.TestInclusionPath_WrongEntryFails"
        - "core/pkg/evidencepack.TestVerifyInclusionPath_RejectsMalformedHashes"
      removal:
        - "core/pkg/evidencepack.TestInclusionPath_TamperedSiblingFails"
        - "core/pkg/evidencepack.TestInclusionPath_WrongEntryFails"
      bypass: []
    section: determinism
    body: |
      The Merkle root over pack entries is a function of the entries alone, and an
      inclusion path stops verifying the moment any sibling is altered. A pack that
      hashed differently on re-computation would prove nothing; one whose proofs
      survived tampering would prove the wrong thing.
    verify:
      - "`core/pkg/evidencepack/merkle.go` · tests `TestComputeEntriesMerkleRoot_Deterministic`, `TestInclusionPath_RoundTripEveryEntry`, `TestInclusionPath_TamperedSiblingFails`"

  - id: INV-004
    title: "Egress enforcement is fail-closed"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      Egress is fail-closed: an empty or nil allowlist denies everything and an
      explicit deny beats an allow.
    status: enforced
    entry_points:
      - "core/pkg/firewall.EgressChecker.CheckEgress"
      - "core/pkg/guardian.TaintEgressInterceptor.Evaluate"
    config:
      - "No knob: core/cmd/helm-ai-kernel/production_guardian.go builds the checker with a nil policy, which denies every destination."
    protected_operations:
      - "A Guardian evaluation whose trusted context names a destination or requires one."
    bypass_assumptions:
      - "The check runs only when the trusted request context names a destination or requires one. HELM is not on the network path, so egress never submitted for a decision is ungoverned (INV-024)."
      - "No knob feeds an allowlist, so the shipped binary denies every egress-classed request; the allowed-case tests exercise the checker with a policy the binary cannot configure."
    tests:
      allowed:
        - "core/pkg/firewall.TestEgressChecker_AllowedDomain"
        - "core/pkg/firewall.TestEgressChecker_CIDRAllowed"
      forbidden:
        - "core/pkg/firewall.TestEgressChecker_EmptyPolicyDenyAll"
        - "core/pkg/firewall.TestEgressChecker_NilPolicyDenyAll"
        - "core/pkg/firewall.TestEgressChecker_DeniedTakesPrecedence"
        - "core/pkg/firewall.TestEgressChecker_UnknownDomainDenied"
        - "core/cmd/helm-ai-kernel.TestProductionGuardianFactoryRunsEveryRequiredDenyGate"
      removal:
        - "core/pkg/firewall.TestEgressChecker_EmptyPolicyDenyAll"
        - "core/pkg/firewall.TestEgressChecker_NilPolicyDenyAll"
        - "core/pkg/firewall.TestEgressChecker_UnknownDomainDenied"
      bypass:
        - "core/pkg/guardian.TestEgressGateUsesTrustedDestinationRequirementInsteadOfRiskClass"
    removal_mutation:
      file: core/pkg/firewall/egress.go
      find: "\t// Fail-closed: not in allowlist → deny\n\tdecision.Allowed = false\n"
      replace: "\t// Fail-closed: not in allowlist → deny\n\tdecision.Allowed = true\n"
    section: fail-closed
    body: |
      An empty allowlist is deny-all, not allow-all. A nil policy is deny-all. An
      explicit deny always beats an allow. The failure mode of a misconfigured
      firewall must be a blocked request, never an unrecorded one.
    verify:
      - "`core/pkg/firewall/egress.go` · tests `TestEgressChecker_EmptyPolicyDenyAll`, `TestEgressChecker_NilPolicyDenyAll`, `TestEgressChecker_DeniedTakesPrecedence`"

  - id: INV-005
    title: "A policy runtime that cannot evaluate denies"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      A policy that cannot be evaluated, or an action with no policy, is denied.
    status: enforced
    entry_points:
      - "core/pkg/kernel/authority.Decide"
      - "core/pkg/kernel/authority.Compile"
    config: []
    protected_operations:
      - "Every Guardian evaluation decided by the CEL authority snapshot."
    bypass_assumptions:
      - "A decision path that does not call authority.Decide is outside this control."
    tests:
      allowed:
        - "core/pkg/kernel/authority.TestDecideConditions"
        - "core/pkg/kernel/authority.TestDecideLogic"
      forbidden:
        - "core/pkg/kernel/authority.TestDecideFailsClosed"
        - "core/pkg/kernel/authority.TestCompileErrorsDenyOnlyTheirAction"
        - "core/pkg/kernel/authority.TestDecideCostLimitDenies"
        - "core/pkg/kernel/authority.TestCompileNilGraphDeniesEverything"
        - "core/pkg/kernel/authority.TestPropertyUnknownActionDenies"
      removal:
        - "core/pkg/kernel/authority.TestDecideFailsClosed"
        - "core/pkg/kernel/authority.TestCompileNilGraphDeniesEverything"
        - "core/pkg/kernel/authority.TestPropertyUnknownActionDenies"
      bypass: []
    removal_mutation:
      file: core/pkg/kernel/authority/authority.go
      find: "func deny(d Decision, code contracts.ReasonCode, detail string) Decision {\n\td.Verdict = contracts.VerdictDeny\n"
      replace: "func deny(d Decision, code contracts.ReasonCode, detail string) Decision {\n\td.Verdict = contracts.VerdictAllow\n"
    section: fail-closed
    body: |
      A rule that does not compile, an evaluation error, a non-boolean result, an
      evaluation that exceeds its cost limit, an action with no policy: each answers
      DENY. "Could not decide" and "decided to allow" are different facts and the
      kernel never collapses them.

      The owner is the CEL `decide` that the Guardian calls on every evaluation
      (HELM-750). The rule was previously pinned to the WASM host
      `core/pkg/policy/wasm`, which never had a production caller and was removed in
      HELM-756.
    verify:
      - "`core/pkg/kernel/authority/authority.go` · tests `TestDecideFailsClosed`, `TestCompileErrorsDenyOnlyTheirAction`, `TestDecideCostLimitDenies`, `TestCompileNilGraphDeniesEverything`, `TestPropertyUnknownActionDenies`"

  - id: INV-006
    title: "An unclassified effect is irreversible until proven otherwise"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      An effect type the reversibility table has never seen is treated as
      irreversible.
    status: observed-only
    reason: >-
      The reversibility classifier is unreachable from core/cmd/helm-ai-kernel:
      ReversibilityClassifier.Classify and DefaultForType are in
      scripts/ci/deadcode-allowlist.txt. No shipped path classifies an effect,
      so the default governs nothing at runtime.
    entry_points:
      - "core/pkg/effects.ReversibilityClassifier.Classify"
      - "core/pkg/effects.ReversibilityClassifier.DefaultForType"
    config: []
    protected_operations:
      - "Classifying an effect's reversibility before its approval requirement is set."
    bypass_assumptions:
      - "No shipped caller exists."
    tests:
      allowed: []
      forbidden:
        - "core/pkg/effects.TestUnknownEffectTypeDefaultsToIrreversible"
      removal: []
      bypass: []
    section: fail-closed
    body: |
      An effect type the reversibility table has never seen is treated as
      irreversible, so it inherits the strictest approval requirement rather than the
      laxest. The safe default for an unknown is the expensive one.
    verify:
      - "`core/pkg/effects/reversibility.go` · test `TestUnknownEffectTypeDefaultsToIrreversible`"

  - id: INV-007
    title: "A verdict the gateway cannot verify is not a verdict"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      The gateway fails closed on a kernel outage, a malformed response, a wrong
      trust root or a stale policy epoch.
    status: observed-only
    reason: >-
      The verifier is a library that no shipped binary calls: VerifyResponse and
      EvaluateGatewayResponse are in scripts/ci/deadcode-allowlist.txt. The
      gateway that would run it is not in this repository, so the tests prove
      the library, not a production path.
    entry_points:
      - "core/pkg/boundary/extauthz.VerifyResponse"
      - "core/pkg/boundary/extauthz.EvaluateGatewayResponse"
    config: []
    protected_operations:
      - "Gateway verification of a signed kernel verdict before dispatch."
    bypass_assumptions:
      - "A gateway that does not call the verifier dispatches without it."
    tests:
      allowed: []
      forbidden:
        - "core/pkg/boundary/extauthz.TestGatewayResponseFailsClosedOnKernelOutageOrUnverifiableVerdict"
        - "core/pkg/boundary/extauthz.TestMalformedRequestOrResponseFailsClosedEvenWhenSigned"
        - "core/pkg/boundary/extauthz.TestTrustRootBindingRejectsWrongRoot"
      removal: []
      bypass: []
    section: fail-closed
    body: |
      Kernel outage, malformed response, wrong trust root, stale policy epoch: the
      gateway fails closed on each. A signature it cannot check is treated as one that
      failed, never as one it may skip.
    verify:
      - "`core/pkg/boundary/extauthz/verifier.go` · tests `TestGatewayResponseFailsClosedOnKernelOutageOrUnverifiableVerdict`, `TestMalformedRequestOrResponseFailsClosedEvenWhenSigned`, `TestTrustRootBindingRejectsWrongRoot`"

  - id: INV-008
    title: "An EffectPermit authorizes one connector, one action, one scope"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      An EffectPermit authorizes one connector, one action and one scope, and is
      consumed once.
    status: observed-only
    reason: >-
      The verifier is a library that no shipped binary calls:
      PermitLedger.ConsumePermit and EvaluateAndConsumeGatewayResponse are in
      scripts/ci/deadcode-allowlist.txt. The gateway that would run it is not in
      this repository, so the tests prove the library, not a production path.
    entry_points:
      - "core/pkg/boundary/extauthz.PermitLedger.ConsumePermit"
      - "core/pkg/boundary/extauthz.EvaluateAndConsumeGatewayResponse"
    config: []
    protected_operations:
      - "Binding a permit to its verdict and effect, and consuming it."
    bypass_assumptions:
      - "A gateway that does not consume permits through the ledger can replay them."
    tests:
      allowed: []
      forbidden:
        - "core/pkg/boundary/extauthz.TestPermitLedgerRejectsDirectBindingMismatchAndReplayKeys"
        - "core/pkg/boundary/extauthz.TestEvaluateAndConsumeRequiresDurablePermitConsumer"
      removal: []
      bypass: []
    section: authorization
    body: |
      A permit is bound to the verdict that issued it and to the exact effect it
      describes. It cannot be replayed against a different connector, widened to a
      different action, or reused after consumption. Authorization that travels is
      not authorization.
    verify:
      - "`core/pkg/effects/types.go` · tests `TestPermitLedgerRejectsDirectBindingMismatchAndReplayKeys`, `TestEvaluateAndConsumeRequiresDurablePermitConsumer`"

  - id: INV-009
    title: "DENY and ESCALATE carry no permit material"
    owner: Mindburn Labs core team (kernel)
    claim: A DENY or ESCALATE verdict carries no permit material.
    status: observed-only
    reason: >-
      The verifier is a library that no shipped binary calls: VerifyResponse is
      in scripts/ci/deadcode-allowlist.txt. The gateway that would run it is not
      in this repository, so the tests prove the library, not a production path.
    entry_points:
      - "core/pkg/boundary/extauthz.VerifyResponse"
    config: []
    protected_operations:
      - "Gateway verification of a non-allowing verdict."
    bypass_assumptions:
      - "A gateway that does not call the verifier does not check the verdict shape."
    tests:
      allowed: []
      forbidden:
        - "core/pkg/boundary/extauthz.TestDenyAndEscalateCannotCarryPermitMaterial"
      removal: []
      bypass: []
    section: authorization
    body: |
      A non-allowing verdict cannot ship anything a connector could mistake for
      authority. The absence of a permit is the enforcement; a "denied" response
      carrying permit fields would be one deserialization bug away from an allow.
    verify:
      - "`core/pkg/boundary/extauthz/verifier.go` · test `TestDenyAndEscalateCannotCarryPermitMaterial`"

  - id: INV-010
    title: "A permit cannot outlive the verdict that authorized it"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      A permit expires no later than the verdict that authorized it, and an
      expired permit fails before dispatch.
    status: observed-only
    reason: >-
      The verifier is a library that no shipped binary calls: VerifyResponse is
      in scripts/ci/deadcode-allowlist.txt. The gateway that would run it is not
      in this repository, so the tests prove the library, not a production path.
    entry_points:
      - "core/pkg/boundary/extauthz.VerifyResponse"
    config: []
    protected_operations:
      - "Gateway verification of permit and verdict expiry."
    bypass_assumptions:
      - "A gateway that does not call the verifier does not check expiry."
    tests:
      allowed: []
      forbidden:
        - "core/pkg/boundary/extauthz.TestPermitExpiryCannotOutliveVerdict"
        - "core/pkg/boundary/extauthz.TestExpiredPermitFailsBeforeDispatch"
        - "core/pkg/boundary/extauthz.TestAllowRequiresExplicitVerifierContextAndBoundedTTL"
      removal: []
      bypass: []
    section: authorization
    body: |
      Permit expiry is bounded by verdict expiry, and an expired permit fails before
      dispatch rather than at the connector. The window in which an effect may execute
      is the window in which someone actually authorized it.
    verify:
      - "`core/pkg/boundary/extauthz/verifier.go` · tests `TestPermitExpiryCannotOutliveVerdict`, `TestExpiredPermitFailsBeforeDispatch`, `TestAllowRequiresExplicitVerifierContextAndBoundedTTL`"

  - id: INV-011
    title: "A credential binds to exactly one principal"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      The first binding of a credential hash to a principal is permanent; a
      different principal presenting it is an isolation violation.
    status: enforced
    entry_points:
      - "core/pkg/identity.IsolationChecker.ValidateAgentIdentity"
      - "core/pkg/guardian.PDPInterceptor.Evaluate"
    config: []
    protected_operations:
      - "A Guardian evaluation that names a principal: the trusted credential hash is bound to it."
    bypass_assumptions:
      - "Bindings live in process memory, so a restart forgets them (R5 wants a Postgres row)."
      - "The gate runs only when the request names a principal."
      - "Tenant routes share HELM_ADMIN_API_KEY, so a second principal presenting that key in the same process is refused; no test covers that interaction."
    tests:
      allowed:
        - "core/pkg/identity.TestIsolationChecker_FirstBindingAllowed"
        - "core/pkg/identity.TestIsolationChecker_SamePrincipalIdempotent"
      forbidden:
        - "core/pkg/identity.TestIsolationChecker_DifferentPrincipalReuse"
        - "core/pkg/guardian.TestExt_IdentityIsolationViolationDenies"
        - "core/cmd/helm-ai-kernel.TestProductionGuardianFactoryRunsEveryRequiredDenyGate"
      removal:
        - "core/pkg/identity.TestIsolationChecker_DifferentPrincipalReuse"
        - "core/pkg/identity.TestIsolationChecker_ViolationHistory"
      bypass: []
    removal_mutation:
      file: core/pkg/identity/isolation.go
      find: "\t\tif existing != principalID {\n"
      replace: "\t\tif false && existing != principalID {\n"
    section: authorization
    body: |
      The first binding of a credential hash to a principal is permanent. The same
      principal may re-present it; a different principal presenting it is an isolation
      violation and is receipted as one. This is the agent-impersonation path, and it
      is closed by construction rather than by review.
    verify:
      - "`core/pkg/identity/isolation.go` · tests `TestIsolationChecker_DifferentPrincipalReuse`, `TestIsolationChecker_SamePrincipalIdempotent`, `TestIsolationChecker_ViolationHistory`"

  - id: INV-012
    title: "Signature algorithms do not cross-verify"
    owner: Mindburn Labs core team (crypto)
    claim: >-
      Signature algorithms do not cross-verify, an empty key ring cannot sign
      and a revoked key cannot verify.
    status: observed-only
    reason: >-
      The key ring is unreachable from core/cmd/helm-ai-kernel: every KeyRing
      method is in scripts/ci/deadcode-allowlist.txt, so no shipped signing or
