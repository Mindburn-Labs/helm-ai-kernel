  - id: CTL-017
    title: "Boundary Enforcement Profile attestation"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      The kernel compiles systemd and nftables enforcement artifacts from
      hash-bound policy input and fails attestation when the live posture
      drifts.
    status: observed-only
    reason: >-
      The kernel attests; systemd and nftables enforce. The shipped binary
      observes posture at service start and on demand, and
      deploy/appliance/helm-boundary-attest.service turns a failed attestation
      into a blocked gateway start.
    entry_points:
      - "core/cmd/helm-ai-kernel.runBoundaryProfileAttest"
    config: []
    protected_operations:
      - "Gateway start on the appliance."
    bypass_assumptions:
      - "Drift between attestations is not detected; the check is not continuous."
    tests:
      allowed:
        - "core/cmd/helm-ai-kernel.TestBoundaryProfileCompileVerifyFlow"
      forbidden:
        - "core/cmd/helm-ai-kernel.TestBoundaryProfileAttestEnforceFailsClosedOffAppliance"
        - "core/cmd/helm-ai-kernel.TestBoundaryProfileAttestTamperedArtifactsHardError"
      removal: []
      bypass: []

  - id: CTL-018
    title: "Tainted-data egress deny"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      A Guardian evaluation that carries pii, credential or secret taint toward
      a destination is denied with TAINTED_DATA_EGRESS_DENY.
    status: enforced
    entry_points:
      - "core/pkg/guardian.TaintEgressInterceptor.Evaluate"
    config:
      - "HELM_TAINT_TRACKING (enforced unless set to 0 or false; the opt-out is logged)"
    protected_operations:
      - "Guardian evaluations whose context names a destination and carries sensitive taint labels."
    bypass_assumptions:
      - "Taint labels come from the request context; an unlabeled request is not checked."
      - "The gate fires only when a destination is present."
      - "The in-process override (WithTrustedTaintedEgressOverride) is unreachable from the shipped binary, so no shipped path approves tainted egress."
    tests:
      allowed:
        - "core/pkg/guardian.TestTaintEgressOverrideRequiresTrustedContext"
      forbidden:
        - "core/pkg/guardian.TestTaintInterceptorEgressBlock"
        - "core/pkg/guardian.TestExt_TaintedEgressDeniesWhenFlagEnabled"
        - "core/pkg/guardian.TestTaintEgressEnforcementDefault"
      removal:
        - "core/pkg/guardian.TestTaintInterceptorEgressBlock"
        - "core/pkg/guardian.TestExt_TaintedEgressDeniesWhenFlagEnabled"
      bypass:
        - "core/pkg/guardian.TestAllowTaintedEgressIsReservedSecurityContextKey"
        - "core/pkg/guardian.TestTaintLabellingIsUnconditional"

  - id: CTL-019
    title: "Guardian threat-scan gate"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      Untrusted text with high-risk threat findings (prompt injection,
      obfuscation, credential exposure) is denied before policy evaluation.
    status: enforced
    entry_points:
      - "core/pkg/guardian.PDPInterceptor.Evaluate"
      - "core/pkg/threatscan.Scanner.ScanInput"
    config: []
    protected_operations:
      - "Guardian evaluations that carry user_input, text or content from an untrusted source."
    bypass_assumptions:
      - "Only the user_input, text and content context keys are scanned."
      - "Only tainted (untrusted) input with high-risk findings is denied; trusted input is scanned and recorded, not denied."
    tests:
      allowed:
        - "core/pkg/threatscan.TestPromptArmorDoesNotFlagBenignDiscussion"
        - "core/pkg/threatscan.TestThreat_CleanInput"
      forbidden:
        - "core/pkg/guardian.TestGuardianThreatScanCoversAllTextFields"
        - "core/pkg/guardian.TestGuardianPreToolCallDeniesPromptArmorToolHijack"
        - "core/cmd/helm-ai-kernel.TestProductionGuardianFactoryRunsEveryRequiredDenyGate"
      removal:
        - "core/pkg/guardian.TestGuardianThreatScanCoversAllTextFields"
        - "core/pkg/guardian.TestGuardianPreToolCallDeniesPromptArmorToolHijack"
      bypass: []

  - id: CTL-020
    title: "Context-fingerprint gate"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      A Guardian evaluation after the environment fingerprint changed is denied
      with CONTEXT_MISMATCH.
    status: enforced
    entry_points:
      - "core/pkg/guardian.FreezeInterceptor.Evaluate"
      - "core/pkg/kernel.ContextGuard.ValidateCurrent"
