  - id: CTL-046
    title: "Mandates only narrow on delegation"
    owner: Mindburn Labs core team (kernel)
    claim: >-
      A delegated mandate is within every mandate above it, and no stop on the
      tenant, the delegator or the chain is active. A narrowing (stop, revoke,
      narrow, add or lower a limit) bumps its scope's control-row version in
      the same transaction. A widening (a root mandate, a lift) needs an
      active human approver who is neither the requester nor the principal
      whose authority widens (HELM-750, ADR-0001).
    status: observed-only
    reason: >-
      The write store has no shipped caller: no binary imports
      core/pkg/kernel/authority/authorityrows (a declared library root in
      scripts/ci/dead-packages-allowlist.txt), so delegation, narrowing,
      stops and lifts happen only through the library. Their shipped caller
      is the authority-change effect (helm.authority.*, contract 5) that a
      later HELM-751 slice dispatches. The read side is shipped: helm-gateway
      admission (CTL-051) reads the same rows through
      core/pkg/kernel/authority/mandates, re-checks that every link of the
      chain is within the one above it (DELEGATION_SCOPE_VIOLATION), and
      denies under a stop on any holder or delegator of the chain.
    entry_points:
      - "core/pkg/kernel/authority/authorityrows.Store.Delegate"
      - "core/pkg/kernel/authority/authorityrows.Store.Stop"
      - "core/pkg/kernel/authority/authorityrows.Store.Lift"
    config: []
    protected_operations:
      - "Delegating, narrowing and revoking a mandate; adding and lowering limits; issuing and lifting stops."
    bypass_assumptions:
      - "No shipped caller writes the rows; admission enforces what they say (CTL-051), not how they were written."
      - "The approval argument names principals; it is not yet a verified approval record (HELM-751)."
    tests:
      allowed:
        - "core/pkg/kernel/authority/authorityrows.TestPostgresDelegationOnlyNarrowsOverRandomChains"
      forbidden:
        - "core/pkg/kernel/authority/authorityrows.TestPostgresDelegationWaitsForAConcurrentNarrowing"
        - "core/pkg/kernel/authority/authorityrows.TestPostgresStoppedAuthorityCannotDelegate"
        - "core/pkg/kernel/authority/authorityrows.TestPostgresRootMandateNeedsADistinctHumanApprover"
        - "core/pkg/kernel/authority/authorityrows.TestPostgresStopExpiresAndLiftNeedsApproval"
        - "core/pkg/kernel/authority/authorityrows.TestPostgresEveryNarrowingBumpsItsControlRowVersion"
        - "core/pkg/kernel/authority/authorityrows.TestPostgresAuthorityRowsIsolateTenantsForARestrictedRole"
        - "core/pkg/kernel/authority/authorityrows.TestPostgresMandateTermsRoundTripAndOnlyNarrow"
        - "core/pkg/kernel/authority/authorityrows.TestMandateTermsTargetsRiskAndCondition"
      removal: []
      bypass: []
