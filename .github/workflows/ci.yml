# CI v2. `ci / gate` is the one required status check: it runs `make check`
# (the merge profile of scripts/ci/quality-gates.json) and the diff-aware
# dependency scan from Mindburn-Labs/platform-actions. Keep the job id `ci`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # Local copy of platform-actions ci.yml@v2; see the header of ci-v2.yml.
    uses: ./.github/workflows/ci-v2.yml
    with:
      setup-commands: bash scripts/ci/install_check_tools.sh
